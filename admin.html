<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Microsite Portal</title>
  <!-- Google Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0b0f19;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(56, 189, 248, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(99, 102, 241, 0.08) 0%, transparent 40%);
      background-attachment: fixed;
      color: #f8fafc;
      min-height: 100vh;
      padding: 24px;
    }

    /* --- LOGIN BOX --- */
    .login-container {
      width: 100%;
      max-width: 420px;
      margin: 80px auto;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 36px 32px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
    }

    .login-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .login-header i {
      font-size: 2.5rem;
      color: #38bdf8;
      margin-bottom: 12px;
    }

    .login-header h2 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #fff;
    }

    /* --- DASHBOARD FULLSCREEN DESKTOP --- */
    .dashboard-container {
      width: 100%;
      max-width: 100%;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 20px 32px;
      margin-bottom: 24px;
      box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
    }

    .top-bar-title h1 {
      font-size: 1.4rem;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .top-bar-title p {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-top: 2px;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      align-items: start;
    }

    .panel-card {
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 15px 35px -10px rgba(0, 0, 0, 0.4);
      width: 100%;
    }

    .panel-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      padding-bottom: 14px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 6px;
    }

    input, select {
      width: 100%;
      padding: 12px 16px;
      background: #090d16;
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fff;
      font-family: inherit;
      font-size: 0.92rem;
      border-radius: 10px;
      transition: all 0.2s ease;
    }

    select option {
      background: #0f172a;
      color: #fff;
      padding: 10px;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 22px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: #38bdf8;
      color: #090d16;
      width: 100%;
    }

    .btn-primary:hover {
      background: #0284c7;
      color: #fff;
      box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
    }

    .btn-secondary {
      background: #475569;
      color: #fff;
      width: 100%;
      margin-top: 8px;
    }

    .btn-secondary:hover { background: #334155; }

    .btn-danger {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 8px 16px;
      font-size: 0.85rem;
    }

    .btn-danger:hover {
      background: #ef4444;
      color: #fff;
    }

    .btn-edit {
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 8px 16px;
      font-size: 0.85rem;
    }

    .btn-edit:hover {
      background: #38bdf8;
      color: #090d16;
    }

    .link-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(9, 13, 22, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      padding: 16px 22px;
      transition: all 0.2s ease;
    }

    .link-item:hover {
      border-color: rgba(56, 189, 248, 0.3);
      background: rgba(15, 23, 42, 0.9);
    }

    .link-info {
      display: flex;
      align-items: center;
      gap: 16px;
      flex: 1;
      padding-right: 20px;
    }

    .badge-order {
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      font-size: 0.85rem;
      font-weight: 800;
      padding: 8px 12px;
      border-radius: 8px;
      min-width: 40px;
      text-align: center;
    }

    .link-details h4 {
      font-size: 1rem;
      color: #fff;
      font-weight: 600;
    }

    .link-details p {
      font-size: 0.85rem;
      color: #64748b;
      margin-top: 3px;
      word-break: break-all;
    }

    .actions {
      display: flex;
      gap: 10px;
    }

    .hidden { display: none !important; }

    @media (max-width: 900px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- ================= SECTION LOGIN ================= -->
  <div id="login-section" class="login-container">
    <div class="login-header">
      <i class="fa-solid fa-user-shield"></i>
      <h2>Admin Login</h2>
      <p style="font-size:0.85rem; color:#64748b; margin-top:4px;">Portal Microsite Management</p>
    </div>
    
    <div class="form-group">
      <label>Email Admin</label>
      <input type="email" id="login-email" placeholder="nama@domain.com">
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" id="login-password" placeholder="••••••••">
    </div>

    <button id="btn-login" class="btn btn-primary" style="margin-top: 10px;">
      <i class="fa-solid fa-right-to-bracket"></i> Masuk Dashboard
    </button>
    <p id="login-error" style="color:#ef4444; margin-top:12px; font-size:0.85rem; text-align:center;"></p>
  </div>


  <!-- ================= SECTION DASHBOARD ================= -->
  <div id="dashboard-section" class="dashboard-container hidden">
    
    <!-- Top Header Bar -->
    <header class="top-bar">
      <div class="top-bar-title">
        <h1><i class="fa-solid fa-sliders" style="color: #38bdf8;"></i> Dashboard Admin Portal</h1>
        <p>Kelola daftar link microsite secara penuh dan realtime</p>
      </div>
      <button id="btn-logout" class="btn btn-danger">
        <i class="fa-solid fa-power-off"></i> Logout
      </button>
    </header>

    <!-- Split Screen Content -->
    <div class="main-grid">
      
      <!-- Kolom Kiri: Form Input / Edit -->
      <div class="panel-card">
        <h3 id="form-title" class="panel-title">
          <i class="fa-solid fa-plus-circle"></i> Tambah Link Baru
        </h3>

        <input type="hidden" id="link-id">

        <div class="form-group">
          <label>Judul Link</label>
          <input type="text" id="link-title" placeholder="Contoh: GitHub Repositories">
        </div>

        <div class="form-group">
          <label>URL Tujuan</label>
          <input type="url" id="link-url" placeholder="https://github.com/username">
        </div>

        <!-- DROPDOWN IKON -->
        <div class="form-group">
          <label>Pilih Ikon Link</label>
          <select id="link-icon">
            <option value="fa-solid fa-link">🔗 Default Link (Tautan Umum)</option>
            <option value="fa-brands fa-github">🐙 GitHub</option>
            <option value="fa-brands fa-youtube">▶️ YouTube</option>
            <option value="fa-brands fa-linkedin">💼 LinkedIn</option>
            <option value="fa-brands fa-instagram">📸 Instagram</option>
            <option value="fa-brands fa-whatsapp">💬 WhatsApp</option>
            <option value="fa-brands fa-facebook">📘 Facebook</option>
            <option value="fa-brands fa-x-twitter">🐦 X / Twitter</option>
            <option value="fa-brands fa-tiktok">🎵 TikTok</option>
            <option value="fa-solid fa-globe">🌐 Website / Blog</option>
            <option value="fa-solid fa-envelope">✉️ Email / Kontak</option>
            <option value="fa-solid fa-file-pdf">📄 PDF / Dokumen</option>
            <option value="fa-solid fa-download">📥 Download / File</option>
          </select>
        </div>

        <div class="form-group">
          <label>Urutan Tampil (Order)</label>
          <input type="number" id="link-order" placeholder="1, 2, 3...">
        </div>

        <button id="btn-save" class="btn btn-primary">
          <i class="fa-solid fa-floppy-disk"></i> Simpan Link
        </button>
        <button id="btn-cancel" class="btn btn-secondary hidden">
          Batal Edit
        </button>
      </div>

      <!-- Kolom Kanan: Daftar Link Aktif -->
      <div class="panel-card">
        <h3 class="panel-title">
          <i class="fa-solid fa-list-check"></i> Daftar Link Aktif
        </h3>

        <div id="admin-links-list" class="link-list">
          <p style="color:#64748b; font-size:0.9rem;">Memuat daftar link...</p>
        </div>
      </div>

    </div>

  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDhq4QoCn00GkfpKXSP8PnvSvEKa2yn0ic",
      authDomain: "portal-iskakfatoni.firebaseapp.com",
      projectId: "portal-iskakfatoni",
      storageBucket: "portal-iskakfatoni.firebasestorage.app",
      messagingSenderId: "367350728822",
      appId: "1:367350728822:web:6b0c6fd4824102d8acf757",
      measurementId: "G-0BNNKQQ24V"
    };

    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const loginSection = document.getElementById('login-section');
    const dashboardSection = document.getElementById('dashboard-section');
    const loginError = document.getElementById('login-error');

    // Cek Sesi Auth
    onAuthStateChanged(auth, (user) => {
      if (user) {
        loginSection.classList.add('hidden');
        dashboardSection.classList.remove('hidden');
        loadAdminLinks();
      } else {
        loginSection.classList.remove('hidden');
        dashboardSection.classList.add('hidden');
      }
    });

    // Action Login
    document.getElementById('btn-login').addEventListener('click', async () => {
      const email = document.getElementById('login-email').value;
      const pass = document.getElementById('login-password').value;
      loginError.innerText = '';
      try {
        await signInWithEmailAndPassword(auth, email, pass);
      } catch (err) {
        loginError.innerText = 'Login gagal: Periksa email dan password.';
      }
    });

    // Action Logout
    document.getElementById('btn-logout').addEventListener('click', () => signOut(auth));

    // Form Elements
    const linkIdInput = document.getElementById('link-id');
    const linkTitleInput = document.getElementById('link-title');
    const linkUrlInput = document.getElementById('link-url');
    const linkIconInput = document.getElementById('link-icon');
    const linkOrderInput = document.getElementById('link-order');
    const btnSave = document.getElementById('btn-save');
    const btnCancel = document.getElementById('btn-cancel');

    // Realtime List untuk Admin Dashboard
    function loadAdminLinks() {
      const q = query(collection(db, "links"), orderBy("order", "asc"));
      onSnapshot(q, (snapshot) => {
        const listDiv = document.getElementById('admin-links-list');
        listDiv.innerHTML = '';

        if (snapshot.empty) {
          listDiv.innerHTML = '<p style="color:#64748b; font-size:0.85rem;">Belum ada link yang tersimpan.</p>';
          return;
        }

        snapshot.forEach((docSnap) => {
          const data = docSnap.data();
          const row = document.createElement('div');
          row.className = 'link-item';
          row.innerHTML = `
            <div class="link-info">
              <span class="badge-order">#${data.order || 1}</span>
              <div class="link-details">
                <h4><i class="${data.icon || 'fa-solid fa-link'}" style="color:#38bdf8; margin-right:6px;"></i> ${data.title}</h4>
                <p>${data.url}</p>
              </div>
            </div>
            <div class="actions">
              <button class="btn btn-edit"><i class="fa-solid fa-pen"></i> Edit</button>
              <button class="btn btn-danger"><i class="fa-solid fa-trash"></i> Hapus</button>
            </div>
          `;
          
          row.querySelector('.btn-edit').onclick = () => {
            linkIdInput.value = docSnap.id;
            linkTitleInput.value = data.title;
            linkUrlInput.value = data.url;
            linkIconInput.value = data.icon || 'fa-solid fa-link';
            linkOrderInput.value = data.order || 1;
            document.getElementById('form-title').innerHTML = '<i class="fa-solid fa-pen-to-square"></i> Edit Link';
            btnCancel.classList.remove('hidden');
          };

          row.querySelector('.btn-danger').onclick = async () => {
            if (confirm(`Yakin ingin menghapus "${data.title}"?`)) {
              await deleteDoc(doc(db, "links", docSnap.id));
            }
          };

          listDiv.appendChild(row);
        });
      });
    }

    // Save/Update Link
    btnSave.addEventListener('click', async () => {
      const id = linkIdInput.value;
      const title = linkTitleInput.value.trim();
      const url = linkUrlInput.value.trim();
      const icon = linkIconInput.value;
      const order = parseInt(linkOrderInput.value) || 1;

      if (!title || !url) {
        alert('Judul dan URL wajib diisi!');
        return;
      }

      if (id) {
        await updateDoc(doc(db, "links", id), { title, url, icon, order });
      } else {
        await addDoc(collection(db, "links"), { title, url, icon, order });
      }

      resetForm();
    });

    btnCancel.addEventListener('click', resetForm);

    function resetForm() {
      linkIdInput.value = '';
      linkTitleInput.value = '';
      linkUrlInput.value = '';
      linkIconInput.value = 'fa-solid fa-link';
      linkOrderInput.value = '';
      document.getElementById('form-title').innerHTML = '<i class="fa-solid fa-plus-circle"></i> Tambah Link Baru';
      btnCancel.classList.add('hidden');
    }
  </script>

</body>
</html>
