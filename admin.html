<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>PORTAL :: Master Admin Dashboard</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0b0f19;
      color: #ffffff;
    }

    #particle-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .main-container {
      position: relative;
      z-index: 10;
    }

    .glass-card {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 selection:bg-cyan-500 selection:text-slate-950">

  <!-- PARTICLE CANVAS BACKGROUND -->
  <canvas id="particle-canvas"></canvas>

  <main class="main-container w-full max-w-md my-auto space-y-6">
    
    <!-- ========================================== -->
    <!-- SECTION 1: FORM LOGIN ADMIN HUB            -->
    <!-- ========================================== -->
    <div id="login-section" class="glass-card rounded-2xl p-6 border border-slate-800 shadow-2xl space-y-6">
      <div class="text-center">
        <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-cyan-500/10 text-cyan-400 mb-3 border border-cyan-500/30">
          <i class="fa-solid fa-user-gear text-2xl"></i>
        </div>
        <h1 class="text-xl font-bold text-white tracking-wide">MASTER ADMIN PORTAL</h1>
        <p class="text-xs text-slate-400 mt-1">Iskak Fatoni :: Control Panel</p>
      </div>

      <form id="login-form" class="space-y-4" onsubmit="return false;">
        <div class="space-y-1">
          <label for="login-email" class="block text-xs font-semibold text-slate-300">Email Admin</label>
          <input type="email" id="login-email" placeholder="nama@domain.com" required class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-slate-100 focus:outline-none focus:border-cyan-500 text-sm">
        </div>

        <div class="space-y-1">
          <label for="login-password" class="block text-xs font-semibold text-slate-300">Password</label>
          <input type="password" id="login-password" placeholder="••••••••" required class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-slate-100 focus:outline-none focus:border-cyan-500 text-sm">
        </div>

        <p id="login-error" class="text-red-400 text-xs font-semibold text-center hidden"></p>

        <button type="submit" id="btn-login" class="w-full py-3.5 px-4 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-sm rounded-xl transition shadow-lg shadow-cyan-500/20 flex items-center justify-center gap-2 cursor-pointer">
          <i class="fa-solid fa-right-to-bracket"></i> Masuk Master Dashboard
        </button>
      </form>
    </div>

    <!-- ========================================== -->
    <!-- SECTION 2: MENU UTAMA ADMIN HUB            -->
    <!-- ========================================== -->
    <div id="dashboard-section" class="hidden space-y-6">
      
      <!-- TOP BAR HEADER -->
      <header class="flex items-center justify-between glass-card p-4 rounded-2xl shadow-xl">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-cyan-500/10 border border-cyan-500/30 flex items-center justify-center text-cyan-400 font-bold">
            <i class="fa-solid fa-sliders text-lg"></i>
          </div>
          <div>
            <h2 class="text-sm font-bold text-white tracking-wide">Master Control Hub</h2>
            <p id="user-email-display" class="text-[11px] text-slate-400 font-mono">admin@domain.com</p>
          </div>
        </div>

        <button id="btn-logout" title="Logout" class="p-2.5 bg-red-500/15 hover:bg-red-500/30 text-red-400 border border-red-500/40 font-bold text-xs rounded-xl transition shadow-md shadow-red-500/10 flex items-center gap-1 cursor-pointer">
          <i class="fa-solid fa-power-off"></i>
        </button>
      </header>

      <!-- CARD PILIHAN MODUL KONTROL -->
      <div class="space-y-4">
        
        <!-- MODUL 1: KELOLA PORTAL LINK -->
        <a 
          href="link/index.html" 
          class="group glass-card p-5 rounded-2xl flex items-center justify-between border border-cyan-500/30 hover:border-cyan-400 transition-all duration-300 hover:scale-[1.02] shadow-lg shadow-cyan-500/5 block"
        >
          <div class="flex items-center gap-4">
            <div class="w-12 h-12 rounded-xl bg-cyan-500/10 border border-cyan-500/30 flex items-center justify-center text-cyan-400 text-xl group-hover:bg-cyan-500 group-hover:text-slate-950 transition-colors shrink-0">
              <i class="fa-solid fa-link"></i>
            </div>
            <div class="text-left">
              <h2 class="text-sm font-bold text-white group-hover:text-cyan-400 transition-colors">Kelola Link &amp; Running Text</h2>
              <p class="text-[11px] text-slate-400 mt-0.5">Tambah/hapus tautan portal &amp; teks pengumuman</p>
            </div>
          </div>
          <i class="fa-solid fa-arrow-right text-xs text-slate-500 group-hover:text-cyan-400 group-hover:translate-x-1 transition-all"></i>
        </a>

        <!-- MODUL 2: DASHBOARD GURU ABSENSI -->
        <a 
          href="guru/index.html" 
          class="group glass-card p-5 rounded-2xl flex items-center justify-between border border-emerald-500/30 hover:border-emerald-400 transition-all duration-300 hover:scale-[1.02] shadow-lg shadow-emerald-500/5 block"
        >
          <div class="flex items-center gap-4">
            <div class="w-12 h-12 rounded-xl bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400 text-xl group-hover:bg-emerald-500 group-hover:text-slate-950 transition-colors shrink-0">
              <i class="fa-solid fa-qrcode"></i>
            </div>
            <div class="text-left">
              <h2 class="text-sm font-bold text-white group-hover:text-emerald-400 transition-colors">Dashboard Absensi Guru</h2>
              <p class="text-[11px] text-slate-400 mt-0.5">Buka sesi QR Absensi &amp; rekap realtime</p>
            </div>
          </div>
          <i class="fa-solid fa-arrow-right text-xs text-slate-500 group-hover:text-emerald-400 group-hover:translate-x-1 transition-all"></i>
        </a>

      </div>

      <!-- FOOTER SIMPLE -->
      <footer class="pt-2 text-center border-t border-slate-800/60">
        <p class="text-[11px] text-slate-500 font-mono">Developed by Iskak Fatoni, S.Pd., Gr.</p>
      </footer>

    </div>

  </main>

  <!-- SCRIPT AUTHENTICATION & PARTICLES -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { 
      getAuth, 
      signInWithEmailAndPassword, 
      onAuthStateChanged, 
      signOut,
      setPersistence,
      browserSessionPersistence 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    // Kredensial Firebase Portal IskakFatoni
    const firebaseConfig = {
      apiKey: "AIzaSyDhq4QoCn00GkfpKXSP8PnvSvEKa2yn0ic",
      authDomain: "portal-iskakfatoni.firebaseapp.com",
      projectId: "portal-iskakfatoni",
      storageBucket: "portal-iskakfatoni.firebasestorage.app",
      messagingSenderId: "367350728822",
      appId: "1:367350728822:web:6b0c6fd4824102d8acf757",
      measurementId: "G-0BNNKQQ24V"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const loginSection = document.getElementById('login-section');
    const dashboardSection = document.getElementById('dashboard-section');
    const loginForm = document.getElementById('login-form');
    const loginError = document.getElementById('login-error');
    const userEmailDisplay = document.getElementById('user-email-display');
    const btnLogout = document.getElementById('btn-logout');

    // 🔒 MONITORING AUTHENTICATION STATUS
    onAuthStateChanged(auth, (user) => {
      if (user) {
        loginSection.classList.add('hidden');
        dashboardSection.classList.remove('hidden');
        userEmailDisplay.innerText = user.email;
      } else {
        loginSection.classList.remove('hidden');
        dashboardSection.classList.add('hidden');
      }
    });

    // 🔒 LOGIN PROCESS
    loginForm.addEventListener('submit', async () => {
      const email = document.getElementById('login-email').value.trim();
      const pass = document.getElementById('login-password').value.trim();
      loginError.classList.add('hidden');

      try {
        await setPersistence(auth, browserSessionPersistence);
        await signInWithEmailAndPassword(auth, email, pass);
      } catch (err) {
        loginError.innerText = "Login gagal: Email atau password salah!";
        loginError.classList.remove('hidden');
      }
    });

    // 🚪 LOGOUT
    btnLogout.addEventListener('click', () => {
      if (confirm("Apakah Anda yakin ingin keluar?")) {
        signOut(auth);
      }
    });

    // PARTICLE ANIMATION SCRIPT
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function initCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      particles = [];
      for (let i = 0; i < 25; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          radius: Math.random() * 2 + 1,
          speedY: Math.random() * -0.5 - 0.2,
          speedX: (Math.random() - 0.5) * 0.3,
          opacity: Math.random() * 0.5 + 0.2
        });
      }
    }

    function drawParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(56, 189, 248, ${p.opacity})`;
        ctx.fill();

        p.y += p.speedY;
        p.x += p.speedX;
        if (p.y < 0) {
          p.y = canvas.height;
          p.x = Math.random() * canvas.width;
        }
      });
      requestAnimationFrame(drawParticles);
    }

    window.addEventListener('resize', initCanvas);
    initCanvas();
    drawParticles();
  </script>
</body>
</html>
