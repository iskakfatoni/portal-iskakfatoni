<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PORTAL :: Scanner QR Absensi Siswa</title>
  
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- HTML5 QR Code Scanner Library -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0b0f19;
      color: #ffffff;
    }
    .glass-card {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    /* Custom style overlay area scanner */
    #reader video {
      object-fit: cover !important;
      border-radius: 16px;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center p-4">

  <!-- TOP BAR HEADER PROFILE SISWA -->
  <header class="max-w-md w-full glass-card p-4 rounded-2xl shadow-xl flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-cyan-500/15 border border-cyan-500/30 flex items-center justify-center text-cyan-400 font-bold">
        <i class="fa-solid fa-user-graduate text-lg"></i>
      </div>
      <div>
        <h2 id="siswa-nama-display" class="text-sm font-bold text-white leading-tight">Memuat...</h2>
        <p class="text-[11px] text-slate-400 font-mono"><span id="siswa-nis-display">-</span> | <span id="siswa-kelas-display">-</span></p>
      </div>
    </div>

    <!-- HANYA BADGE STATUS TERIKAT (TANPA TOMBOL LOGOFF/RESET) -->
    <span class="px-2.5 py-1 rounded-full text-[10px] font-bold bg-emerald-500/15 text-emerald-400 border border-emerald-500/30 flex items-center gap-1">
      <i class="fa-solid fa-lock text-[9px]"></i> HP Terikat
    </span>
  </header>

  <!-- MAIN SCANNER CAMERA CONTAINER -->
  <main class="max-w-md w-full my-auto space-y-4">
    
    <div class="glass-card p-4 rounded-3xl shadow-2xl space-y-3 text-center">
      <div class="flex items-center justify-between border-b border-slate-800 pb-2.5 px-1">
        <span class="text-xs font-bold text-cyan-400 uppercase tracking-wider flex items-center gap-2">
          <i class="fa-solid fa-camera"></i> Scan QR Absensi Kelas
        </span>
        <span id="scan-status-badge" class="text-[10px] font-mono px-2.5 py-0.5 rounded-full bg-cyan-500/10 text-cyan-400 border border-cyan-500/20">
          Kamera Aktif
        </span>
      </div>

      <!-- VIEWPORT KAMERA -->
      <div class="relative w-full aspect-square bg-slate-950 rounded-2xl overflow-hidden border border-slate-800 flex items-center justify-center">
        <div id="reader" class="w-full h-full"></div>
      </div>

      <p class="text-[11px] text-slate-400 font-mono pt-1">
        Arahkan kamera ke QR Code yang ditampilkan oleh Guru di depan kelas
      </p>
    </div>

    <!-- NOTIFIKASI / FEEDBACK SUCCESS ERROR -->
    <div id="scan-feedback" class="hidden p-4 rounded-2xl text-xs font-bold text-center border transition"></div>

  </main>

  <!-- FOOTER & NAVIGASI KEMBALI -->
  <footer class="max-w-md w-full space-y-3">
    <a href="../absensi.html" class="w-full py-3.5 px-4 bg-slate-900 hover:bg-slate-800 text-slate-300 border border-slate-800 font-bold text-xs rounded-xl transition flex items-center justify-center gap-2 cursor-pointer shadow-lg">
      <i class="fa-solid fa-arrow-left"></i> Kembali ke Dashboard Absensi
    </a>

    <p class="text-[11px] text-slate-500 text-center font-mono">Developed by Iskak Fatoni, S.Pd., Gr.</p>
  </footer>


  <!-- LOGIC FIREBASE & QR SCANNER -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      query, 
      where, 
      getDocs, 
      serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDhq4QoCn00GkfpKXSP8PnvSvEKa2yn0ic",
      authDomain: "portal-iskakfatoni.firebaseapp.com",
      projectId: "portal-iskakfatoni",
      storageBucket: "portal-iskakfatoni.firebasestorage.app",
      messagingSenderId: "367350728822",
      appId: "1:367350728822:web:6b0c6fd4824102d8acf757",
      measurementId: "G-0BNNKQQ24V"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const namaDisplay = document.getElementById('siswa-nama-display');
    const nisDisplay = document.getElementById('siswa-nis-display');
    const kelasDisplay = document.getElementById('siswa-kelas-display');
    const scanFeedback = document.getElementById('scan-feedback');
    const scanStatusBadge = document.getElementById('scan-status-badge');

    let currentSiswa = null;
    let html5QrCode = null;
    let isProcessing = false;

    // 1. CEK PROFIL SISWA DARI LOCALSTORAGE
    document.addEventListener('DOMContentLoaded', () => {
      const savedUser = localStorage.getItem('portal_siswa_user');
      if (!savedUser) {
        window.location.href = "../absensi.html";
        return;
      }

      try {
        currentSiswa = JSON.parse(savedUser);
        namaDisplay.innerText = currentSiswa.nama_siswa;
        nisDisplay.innerText = currentSiswa.nis;
        kelasDisplay.innerText = currentSiswa.nama_kelas;

        startScanner();
      } catch (e) {
        window.location.href = "../absensi.html";
      }
    });

    // 2. JALANKAN KAMERA SCANNER
    function startScanner() {
      html5QrCode = new Html5Qrcode("reader");

      const config = { 
        fps: 10, 
        qrbox: { width: 220, height: 220 },
        aspectRatio: 1.0
      };

      html5QrCode.start(
        { facingMode: "environment" }, 
        config, 
        onScanSuccess
      ).catch(err => {
        showFeedback("Gagal mengakses kamera HP. Pastikan izin kamera telah diberikan!", "error");
      });
    }

    // 3. LOGIKA KETIKA SCANNER BERHASIL MEMBACA QR
    async function onScanSuccess(decodedText) {
      if (isProcessing) return;
      isProcessing = true;

      scanStatusBadge.innerText = "Memproses...";
      scanStatusBadge.className = "text-[10px] font-mono px-2.5 py-0.5 rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/20";

      try {
        // A. Cek Sesi Absensi Aktif berdasarkan Token QR
        const qSesi = query(
          collection(db, "sesi_absensi"), 
          where("current_qr_token", "==", decodedText),
          where("is_active", "==", true)
        );
        const sesiSnap = await getDocs(qSesi);

        if (sesiSnap.empty) {
          showFeedback("❌ QR Code tidak valid atau sesi absensi sudah ditutup oleh Guru!", "error");
          resumeScanning(3000);
          return;
        }

        let activeSesiData = null;
        let activeSesiId = null;

        sesiSnap.forEach(d => {
          activeSesiId = d.id;
          activeSesiData = d.data();
        });

        // B. Cek Kesesuaian Kelas Siswa dengan Sesi Guru
        if (activeSesiData.id_kelas !== currentSiswa.nama_kelas && activeSesiData.id_kelas !== currentSiswa.id_kelas) {
          showFeedback(`❌ QR Code ini khusus untuk kelas ${activeSesiData.id_kelas}!`, "error");
          resumeScanning(3000);
          return;
        }

        // C. Cek Apakah Siswa Sudah Pernah Scan di Sesi Ini
        const qLog = query(
          collection(db, "log_absensi"),
          where("id_sesi", "==", activeSesiId),
          where("nis", "==", currentSiswa.nis)
        );
        const logSnap = await getDocs(qLog);

        if (!logSnap.empty) {
          showFeedback("ℹ️ Anda sudah melakukan absensi untuk sesi pelajaran ini!", "info");
          resumeScanning(4000);
          return;
        }

        // D. Catat Kehadiran ke Firestore
        const now = new Date();
        const waktuFormat = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' }) + ' WIB';

        await addDoc(collection(db, "log_absensi"), {
          id_sesi: activeSesiId,
          nis: currentSiswa.nis,
          nama_siswa: currentSiswa.nama_siswa,
          id_kelas: currentSiswa.nama_kelas,
          nama_mapel: activeSesiData.nama_mapel,
          waktu_scan: waktuFormat,
          status: "Hadir",
          created_at: serverTimestamp()
        });

        showFeedback(`🎉 ABSENSI BERHASIL!\nTerima kasih ${currentSiswa.nama_siswa}, kehadiran Anda telah dicatat pada ${waktuFormat}.`, "success");

        // Vibrasi HP jika mendukung
        if (navigator.vibrate) navigator.vibrate(200);

        resumeScanning(5000);

      } catch (err) {
        showFeedback("Terjadi kesalahan sistem: " + err.message, "error");
        resumeScanning(3000);
      }
    }

    function resumeScanning(delayMs) {
      setTimeout(() => {
        isProcessing = false;
        scanStatusBadge.innerText = "Kamera Aktif";
        scanStatusBadge.className = "text-[10px] font-mono px-2.5 py-0.5 rounded-full bg-cyan-500/10 text-cyan-400 border border-cyan-500/20";
      }, delayMs);
    }

    function showFeedback(msg, type) {
      scanFeedback.innerText = msg;
      scanFeedback.classList.remove('hidden', 'bg-red-500/15', 'text-red-400', 'border-red-500/30', 'bg-emerald-500/15', 'text-emerald-400', 'border-emerald-500/30', 'bg-amber-500/15', 'text-amber-400', 'border-amber-500/30');

      if (type === 'error') {
        scanFeedback.classList.add('bg-red-500/15', 'text-red-400', 'border-red-500/30');
      } else if (type === 'success') {
        scanFeedback.classList.add('bg-emerald-500/15', 'text-emerald-400', 'border-emerald-500/30');
      } else {
        scanFeedback.classList.add('bg-amber-500/15', 'text-amber-400', 'border-amber-500/30');
      }
    }
  </script>
</body>
</html>
