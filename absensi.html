    .absensi-box {

      font-weight: 700;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);

    .error-msg {

      color: #f87171;
      padding: 10px;
      border-radius: 10px;
      font-size: 0.8rem;
      text-align: center;
      margin-bottom: 14px;
    }

    .hidden { display: none !important; }

<body>

  <!-- PARTICLE CANVAS -->

  <main class="container">

    <!-- SECTION ABSENSI SISWA -->

        <button id="btn-buka-scanner" type="button" class="btn-absensi btn-emerald">

    </section>

    <!-- Footer -->
    <footer class="footer">

        <a href="https://tiktok.com/@iskakfatoni" target="_blank" rel="noopener noreferrer" class="social-btn tt"><i class="fa-brands fa-tiktok"></i></a>

      <div class="supported-by">

  </main>

  <!-- PARTICLE CANVAS -->
  <script>
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function initCanvas() {
      canvas.width = document.documentElement.clientWidth || window.innerWidth;
      canvas.height = window.innerHeight;
      particles = [];
      for (let i = 0; i < 35; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          radius: Math.random() * 2 + 1,
          speedY: Math.random() * -0.5 - 0.2,
          speedX: (Math.random() - 0.5) * 0.3,
          opacity: Math.random() * 0.6 + 0.3
        });
      }
    }

    function drawParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const isDarkMode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const particleColor = isDarkMode ? "0, 245, 212" : "139, 92, 246";

      particles.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${particleColor}, ${p.opacity})`;
        ctx.shadowBlur = 6;
        ctx.shadowColor = `rgb(${particleColor})`;
        ctx.fill();

        p.y += p.speedY; p.x += p.speedX;
        if (p.y < 0) { p.y = canvas.height; p.x = Math.random() * canvas.width; }
      });
      requestAnimationFrame(drawParticles);
    }

    window.addEventListener('resize', initCanvas);
    initCanvas();
    drawParticles();
  </script>

  <!-- LOGIC FIREBASE & HARDWARE FINGERPRINTING -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { 
      getFirestore, 
      doc, 
      getDoc, 
      updateDoc,
      collection,
      query,
      where,
      getDocs 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDhq4QoCn00GkfpKXSP8PnvSvEKa2yn0ic",
      authDomain: "portal-iskakfatoni.firebaseapp.com",
      projectId: "portal-iskakfatoni",
      storageBucket: "portal-iskakfatoni.firebasestorage.app",
      messagingSenderId: "367350728822",
      appId: "1:367350728822:web:6b0c6fd4824102d8acf757",
      measurementId: "G-0BNNKQQ24V"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const sectionLoading = document.getElementById('section-loading-absensi');
    const sectionLogin = document.getElementById('section-login-absensi');
    const sectionProfile = document.getElementById('section-profile-absensi');
    const nisInput = document.getElementById('nis-input');
    const btnVerifikasi = document.getElementById('btn-verifikasi');
    const btnText = document.getElementById('btn-text');
    const errorMsg = document.getElementById('error-msg');

    const profileNama = document.getElementById('profile-nama');
    const profileNis = document.getElementById('profile-nis');
    const profileKelas = document.getElementById('profile-kelas');
    const btnBukaScanner = document.getElementById('btn-buka-scanner');

    // FUNGSI FINGERPRINT HARDWARE HP (TAHAN HAPUS CACHE BROWSER)
    async function getHardwareFingerprint() {
      const gl = document.createElement('canvas').getContext('webgl');
      let gpuVendor = '';
      if (gl) {
        const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
        if (debugInfo) {
          gpuVendor = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) || '';
        }
      }

      const rawString = [
        navigator.userAgent,
        screen.width + 'x' + screen.height,
        screen.colorDepth,
        navigator.hardwareConcurrency || 2,
        gpuVendor,
        Intl.DateTimeFormat().resolvedOptions().timeZone
      ].join('||');

      // Hash string menggunakan SHA-256 bawaan Crypto API browser
      const msgBuffer = new TextEncoder().encode(rawString);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
      
      return 'HW-' + hashHex.substring(0, 16).toUpperCase();
    }

    let currentDeviceId = '';

    // INISIALISASI APLIKASI
    document.addEventListener('DOMContentLoaded', async () => {
      // Hitung Hardware Fingerprint HP secara konsisten
      currentDeviceId = await getHardwareFingerprint();
      localStorage.setItem('portal_device_id', currentDeviceId);

      // 1. DULUAN CEK FIRESTORE BERDASARKAN DEVICE_ID PERANGKAT INI
      try {
        const qDevice = query(collection(db, "siswa"), where("device_id", "==", currentDeviceId));
        const deviceSnap = await getDocs(qDevice);

        if (!deviceSnap.empty) {
          // HP ini SUDAH TERIKAT di Firestore! Langsung tampilkan profilnya meski cache pernah di-clear!
          const docSnap = deviceSnap.docs[0];
          const dbData = docSnap.data();

          const updatedUser = {
            doc_id: docSnap.id,
            nis: dbData.nis,
            nama_siswa: dbData.nama_siswa,
            id_kelas: dbData.id_kelas,
            nama_kelas: dbData.nama_kelas || dbData.id_kelas,
            device_id: currentDeviceId
          };

          localStorage.setItem('portal_siswa_user', JSON.stringify(updatedUser));
          showProfile(updatedUser);
          return;
        }
      } catch (e) {
        console.error("Gagal auto-restore via hardware ID:", e);
      }

      // 2. JIKA CHIP DOKUMEN BELUM TERIKAT PADA FIRESTORE, TAMPILKAN FORM LOGIN
      localStorage.removeItem('portal_siswa_user');
      showLoginForm();
    });

    // VERIFIKASI SISWA & IKAT HP
    btnVerifikasi.addEventListener('click', async () => {
      const rawNis = nisInput.value.trim();
      hideError();

      if (!rawNis) {
        showError("Silakan masukkan NIS Anda terlebih dahulu.");
        return;
      }

      setLoading(true);

      try {
        const safeDocId = rawNis.replace(/\//g, '-');
        
        let docSnap = await getDoc(doc(db, "siswa", safeDocId));
        let dataSiswa = null;
        let actualDocId = safeDocId;

        if (docSnap.exists()) {
          dataSiswa = docSnap.data();
        } else {
          const qNis = query(collection(db, "siswa"), where("nis", "==", rawNis));
          const querySnap = await getDocs(qNis);

          if (!querySnap.empty) {
            docSnap = querySnap.docs[0];
            dataSiswa = docSnap.data();
            actualDocId = docSnap.id;
          }
        }

        if (!dataSiswa) {
          showError(`NIS "${rawNis}" tidak ditemukan! Pastikan terdaftar.`);
          setLoading(false);
          return;
        }

        // VALIDASI 1: Akun NIS ini sudah terikat di HP lain?
        if (dataSiswa.device_id && dataSiswa.device_id !== currentDeviceId) {
          showError("❌ Akun NIS ini sudah terikat di HP lain! Minta Guru/Admin untuk mereset perangkat.");
          setLoading(false);
          return;
        }

        // VALIDASI 2: HP ini terikat ke akun NIS siswa lain?
        const qDevice = query(collection(db, "siswa"), where("device_id", "==", currentDeviceId));
        const deviceSnap = await getDocs(qDevice);

        if (!deviceSnap.empty) {
          let activeOwner = null;
          deviceSnap.forEach(d => {
            if (d.id !== actualDocId && d.data().nis !== rawNis) {
              activeOwner = d.data();
            }
          });

          if (activeOwner) {
            showError(`❌ HP ini sudah terikat dengan siswa: ${activeOwner.nama_siswa} (${activeOwner.nis}). 1 HP hanya untuk 1 siswa!`);
            setLoading(false);
            return;
          }
        }

        // Ikat HP ke Firestore
        await updateDoc(doc(db, "siswa", actualDocId), { device_id: currentDeviceId });

        const userData = {
          doc_id: actualDocId,
          nis: dataSiswa.nis || rawNis,
          nama_siswa: dataSiswa.nama_siswa,
          id_kelas: dataSiswa.id_kelas,
          nama_kelas: dataSiswa.nama_kelas || dataSiswa.id_kelas,
          device_id: currentDeviceId
        };

        localStorage.setItem('portal_siswa_user', JSON.stringify(userData));
        showProfile(userData);

      } catch (err) {
        console.error(err);
        showError("Terjadi kesalahan: " + err.message);
      } finally {
        setLoading(false);
      }
    });

    function showProfile(user) {
      profileNama.innerText = user.nama_siswa;
      profileNis.innerText = user.nis;
      profileKelas.innerText = user.nama_kelas || user.id_kelas;

      sectionLoading.classList.add('hidden');
      sectionLogin.classList.add('hidden');
      sectionProfile.classList.remove('hidden');
    }

    function showLoginForm() {
      sectionLoading.classList.add('hidden');
      sectionProfile.classList.add('hidden');
      sectionLogin.classList.remove('hidden');
    }

    btnBukaScanner.addEventListener('click', () => {
      window.location.href = "siswa/index.html";
    });

    function showError(msg) {
      errorMsg.innerText = msg;
      errorMsg.classList.remove('hidden');
    }

    function hideError() {
      errorMsg.innerText = '';
      errorMsg.classList.add('hidden');
    }

    function setLoading(isLoading) {
      if (isLoading) {
        btnVerifikasi.disabled = true;
        btnText.innerText = "Mengecek NIS & Validasi HP...";
      } else {
        btnVerifikasi.disabled = false;
        btnText.innerText = "Verifikasi NIS & Ikat HP";
      }
    }
  </script>
</body>
