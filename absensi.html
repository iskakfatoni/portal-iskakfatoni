  <style>
    /* Styling khusus Form & Profil Absensi agar padu dengan style.css */
    .absensi-box {
      background: var(--card-bg, rgba(15, 23, 42, 0.85));
      border: 1px solid var(--card-border, rgba(255, 255, 255, 0.1));
      border-radius: 20px;
      padding: 24px 20px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      margin: 20px 0;
      width: 100%;
      box-shadow: 0 15px 35px -10px rgba(0, 0, 0, 0.4);
    }

    .form-group-absensi {
      margin-bottom: 16px;
      text-align: left;
    }

    .form-group-absensi label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }

    .input-absensi {
      width: 100%;
      padding: 14px 16px;
      background: rgba(3, 7, 18, 0.7);
      border: 1.5px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      color: #ffffff;
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }

    .input-absensi:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25);
    }

    .btn-absensi {
      width: 100%;
      padding: 14px 20px;
      border: none;
      border-radius: 12px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .btn-cyan {
      background: #38bdf8;
      color: #090d16;
      box-shadow: 0 8px 20px -4px rgba(56, 189, 248, 0.3);
    }

    .btn-cyan:hover {
      background: #0284c7;
      color: #ffffff;
    }

    .btn-emerald {
      background: linear-gradient(135deg, #10b981, #14b8a6);
      color: #090d16;
      box-shadow: 0 8px 20px -4px rgba(16, 185, 129, 0.3);
    }

    .btn-emerald:hover {
      opacity: 0.9;
    }

    .btn-refresh {
      background: rgba(148, 163, 184, 0.12);
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.15);
      margin-top: 10px;
    }

    .btn-refresh:hover {
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
    }

    .profile-info-grid {
      background: rgba(3, 7, 18, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 16px;
      text-align: left;
      margin-bottom: 18px;
    }

    .badge-status {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 700;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .error-msg {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
      padding: 10px;
      border-radius: 10px;
      font-size: 0.8rem;
      text-align: center;
      margin-bottom: 14px;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- PARTICLE CANVAS -->
  <canvas id="particle-canvas"></canvas>

  <main class="container">
    
    <!-- Header Profil -->
    <header class="profile">
      <div class="avatar-ring">
        <img 
          src="foto_asn_profile.png" 
          alt="Muchamad Iskak Fatoni" 
          class="avatar">
      </div>
      <h1 class="name">PORTAL::Iskak Fatoni</h1>
      <p class="bio">I'am certified electronical and computer teacher, also a former Kamen Rider</p>
    </header>

    <!-- SECTION ABSENSI SISWA -->
    <section class="absensi-box">
      
      <!-- STATE 1: FORM INPUT NIS & DEVICE BINDING -->
      <div id="section-login-absensi">
        <div style="text-align:center; margin-bottom: 20px;">
          <h2 style="font-size: 1.1rem; font-weight: 800; color: #ffffff;">VERIFIKASI ABSENSI SISWA</h2>
          <p style="font-size: 0.8rem; color: #94a3b8; margin-top: 4px;">Masukkan NIS Anda untuk mengikat akun di HP ini</p>

      <!-- STATE 2: PROFIL SISWA TERIKAT -->

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
          <span style="font-size: 0.75rem; color: #94a3b8; font-weight: 700;">STATUS PERANGKAT</span>
          <span class="badge-status">🔒 HP Terikat Resmi</span>
        </div>

        <div class="profile-info-grid">
          <p style="font-size: 0.75rem; color: #94a3b8;">Nama Siswa</p>
          <p id="profile-nama" style="font-size: 1rem; font-weight: 800; color: #ffffff; margin-bottom: 10px;">-</p>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
            <div>
              <p style="font-size: 0.7rem; color: #94a3b8;">NIS</p>
              <p id="profile-nis" style="font-size: 0.85rem; font-weight: 700; color: #38bdf8; font-family: monospace;">-</p>
            </div>
            <div>
              <p style="font-size: 0.7rem; color: #94a3b8;">Kelas</p>
              <p id="profile-kelas" style="font-size: 0.85rem; font-weight: 700; color: #cbd5e1;">-</p>
            </div>
          </div>
        </div>

        <button id="btn-buka-scanner" type="button" class="btn-absensi btn-emerald">
          <i class="fa-solid fa-camera"></i>
          <span>Buka Scanner QR Absensi</span>
        </button>

        <!-- TOMBOL REFRESH SESI / PERBARUI DATA -->
        <button id="btn-refresh-sesi" type="button" class="btn-absensi btn-refresh">
          <i class="fa-solid fa-arrows-rotate"></i>
          <span>Refresh Sesi / Perbarui Data</span>
        </button>
      </div>

    </section>

    <!-- Footer -->
    <footer class="footer">
      <div class="social-icons">
        <a href="https://wa.me/085645453111" target="_blank" rel="noopener noreferrer" class="social-btn wa" title="WhatsApp Iskak">
          <i class="fa-brands fa-whatsapp"></i>
        </a>
        <a href="https://facebook.com/iskakfatoni" target="_blank" rel="noopener noreferrer" class="social-btn fb" title="Facebook Iskak">
          <i class="fa-brands fa-facebook-f"></i>
        </a>
        <a href="https://instagram.com/iskakfatoni" target="_blank" rel="noopener noreferrer" class="social-btn ig" title="Instagram Iskak">
          <i class="fa-brands fa-instagram"></i>
        </a>
        <a href="https://youtube.com/iskakfatoni" target="_blank" rel="noopener noreferrer" class="social-btn yt" title="YouTube Iskak">
          <i class="fa-brands fa-youtube"></i>
        </a>
        <a href="https://tiktok.com/@iskakfatoni" target="_blank" rel="noopener noreferrer" class="social-btn tt" title="TikTok">
          <i class="fa-brands fa-tiktok"></i>
        </a>
      </div>

      <div class="supported-by">
        <img src="nisnas_logo_colorful.png" alt="Logo NisNas Computer" class="supporter-logo">
        <p>Supported by <span>NisNas Computer</span></p>
      </div>
    </footer>

  </main>

  <!-- PARTICLE CANVAS SCRIPT -->
  <script>
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function initCanvas() {
      canvas.width = document.documentElement.clientWidth || window.innerWidth;
      canvas.height = window.innerHeight;
      particles = [];
      for (let i = 0; i < 35; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          radius: Math.random() * 2 + 1,
          speedY: Math.random() * -0.5 - 0.2,
          speedX: (Math.random() - 0.5) * 0.3,
          opacity: Math.random() * 0.6 + 0.3
        });
      }
    }

    function drawParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const isDarkMode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const particleColor = isDarkMode ? "0, 245, 212" : "139, 92, 246";

      particles.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${particleColor}, ${p.opacity})`;
        ctx.shadowBlur = 6;
        ctx.shadowColor = `rgb(${particleColor})`;
        ctx.fill();

        p.y += p.speedY;
        p.x += p.speedX;

        if (p.y < 0) {
          p.y = canvas.height;
          p.x = Math.random() * canvas.width;
        }
      });
      requestAnimationFrame(drawParticles);
    }

    window.addEventListener('resize', initCanvas);
    initCanvas();
    drawParticles();
  </script>

  <!-- LOGIC FIREBASE & DEVICE LOCKING -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { 
      getFirestore, 
      doc, 
      getDoc, 
      updateDoc 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // Konfigurasi Firebase Portal IskakFatoni
    const firebaseConfig = {
      apiKey: "AIzaSyDhq4QoCn00GkfpKXSP8PnvSvEKa2yn0ic",
      authDomain: "portal-iskakfatoni.firebaseapp.com",
      projectId: "portal-iskakfatoni",
      storageBucket: "portal-iskakfatoni.firebasestorage.app",
      messagingSenderId: "367350728822",
      appId: "1:367350728822:web:6b0c6fd4824102d8acf757",
      measurementId: "G-0BNNKQQ24V"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // DOM Elements
    const sectionLogin = document.getElementById('section-login-absensi');
    const sectionProfile = document.getElementById('section-profile-absensi');
    const nisInput = document.getElementById('nis-input');
    const btnVerifikasi = document.getElementById('btn-verifikasi');
    const btnText = document.getElementById('btn-text');
    const errorMsg = document.getElementById('error-msg');

    const profileNama = document.getElementById('profile-nama');
    const profileNis = document.getElementById('profile-nis');
    const profileKelas = document.getElementById('profile-kelas');
    const btnBukaScanner = document.getElementById('btn-buka-scanner');
    const btnRefreshSesi = document.getElementById('btn-refresh-sesi');

    // Generate Unique Device ID
    function getDeviceId() {
      let deviceId = localStorage.getItem('portal_device_id');
      if (!deviceId) {
        deviceId = 'DEV-' + Math.random().toString(36).substring(2, 15) + '-' + Date.now().toString(36);
        localStorage.setItem('portal_device_id', deviceId);
      }
      return deviceId;
    }

    const currentDeviceId = getDeviceId();

    // Auto-Login Check
    document.addEventListener('DOMContentLoaded', () => {
      const savedUser = localStorage.getItem('portal_siswa_user');
      if (savedUser) {
        try {
          const user = JSON.parse(savedUser);
          showProfile(user);
        } catch (e) {
          localStorage.removeItem('portal_siswa_user');
        }
      }
    });

    // Proses Verifikasi & Device Binding
    btnVerifikasi.addEventListener('click', async () => {
      const nis = nisInput.value.trim();
      hideError();

      if (!nis) {
        showError("Silakan masukkan NIS Anda terlebih dahulu.");
        return;
      }

      setLoading(true);

      try {
        const docRef = doc(db, "siswa", nis);
        const docSnap = await getDoc(docRef);

        if (!docSnap.exists()) {
          showError("NIS tidak ditemukan! Pastikan NIS terdaftar.");
          setLoading(false);
          return;
        }

        const dataSiswa = docSnap.data();

        // Check Device Binding
        if (dataSiswa.device_id && dataSiswa.device_id !== currentDeviceId) {
          showError("❌ Akun ini sudah terikat di HP lain! Silakan minta Guru/Admin untuk mereset perangkat Anda.");
          setLoading(false);
          return;
        }

        // Bind Device ID jika belum ada
        if (!dataSiswa.device_id) {
          await updateDoc(docRef, { device_id: currentDeviceId });
        }

        const userData = {
          nis: dataSiswa.nis,
          nama_siswa: dataSiswa.nama_siswa,
          id_kelas: dataSiswa.id_kelas,
          nama_kelas: dataSiswa.nama_kelas,
          device_id: currentDeviceId
        };

        localStorage.setItem('portal_siswa_user', JSON.stringify(userData));
        showProfile(userData);

      } catch (err) {
        console.error(err);
        showError("Terjadi kesalahan: " + err.message);
      } finally {
        setLoading(false);
      }
    });

    function showProfile(user) {
      profileNama.innerText = user.nama_siswa;
      profileNis.innerText = user.nis;
      profileKelas.innerText = user.nama_kelas;

      sectionLogin.classList.add('hidden');
      sectionProfile.classList.remove('hidden');
    }

    btnBukaScanner.addEventListener('click', () => {
      window.location.href = "siswa/index.html";
    });

    // REFRESH SESI: Cek status Device ID di Firestore tanpa perlu hapus data jika masih valid
    btnRefreshSesi.addEventListener('click', async () => {
      const savedUserJson = localStorage.getItem('portal_siswa_user');
      
      if (!savedUserJson) {
        window.location.reload();
        return;
      }

      const user = JSON.parse(savedUserJson);
      const btnTextOri = btnRefreshSesi.innerHTML;
      btnRefreshSesi.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Memeriksa Status...';
      btnRefreshSesi.disabled = true;

      try {
        // Ambil data siswa terbaru langsung dari Firestore
        const docRef = doc(db, "siswa", user.nis);
        const docSnap = await getDoc(docRef);

        if (docSnap.exists()) {
          const dataSiswa = docSnap.data();

          // Jika pautan HP di database sudah di-reset oleh Admin (kosong / beda)
          if (!dataSiswa.device_id || dataSiswa.device_id !== currentDeviceId) {
            alert("Pautan HP Anda telah di-reset oleh Guru/Admin. Silakan verifikasi NIS kembali.");
            localStorage.removeItem('portal_siswa_user');
            window.location.reload();
            return;
          }
          
          // Jika masih valid, update data nama/kelas terbaru jika ada perubahan
          user.nama_siswa = dataSiswa.nama_siswa;
          user.nama_kelas = dataSiswa.nama_kelas;
          localStorage.setItem('portal_siswa_user', JSON.stringify(user));
          showProfile(user);
          alert("Sesi dan data profil berhasil diperbarui!");
        } else {
          // Jika akun NIS dihapus dari database
          alert("Akun NIS ini tidak ditemukan lagi di database.");
          localStorage.removeItem('portal_siswa_user');
          window.location.reload();
        }
      } catch (err) {
        alert("Gagal memperbarui data: " + err.message);
      } finally {
        btnRefreshSesi.innerHTML = btnTextOri;
        btnRefreshSesi.disabled = false;
      }
    });

    function showError(msg) {
      errorMsg.innerText = msg;
      errorMsg.classList.remove('hidden');
    }

    function hideError() {
      errorMsg.innerText = '';
      errorMsg.classList.add('hidden');
    }

    function setLoading(isLoading) {
      if (isLoading) {
        btnVerifikasi.disabled = true;
        btnText.innerText = "Mengecek NIS & HP...";
      } else {
        btnVerifikasi.disabled = false;
        btnText.innerText = "Verifikasi NIS & Ikat HP";
      }
    }
  </script>
</body>
