<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>PORTAL::IskakFatoni - Absensi Siswa</title>
  <link rel="preload" href="style/style.css" as="style">
  <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" as="style" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="style/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body class="theme-glass">

  <!-- PARTICLE CANVAS -->
  <canvas id="particle-canvas"></canvas>

  <main class="container">
    
    <!-- Header Profil -->
    <header class="profile">
      <div class="avatar-ring">
        <img src="assets/img/foto_asn_profile.webp" alt="Muchamad Iskak Fatoni" class="avatar">
      </div>
      <h1 class="name">PORTAL::Iskak Fatoni</h1>
      <p class="bio">I'am certified electronical and computer teacher, also a former Kamen Rider</p>
    </header>

    <!-- SECTION ABSENSI SISWA -->
    <section class="dark-panel">
      
      <!-- LOADING STATE INITIALIZATION -->
      <div id="section-loading-absensi" class="text-center py-6">
        <i class="fa-solid fa-spinner fa-spin text-2xl text-cyan-400"></i>
        <p class="text-xs text-slate-400 mt-2 font-mono">Memeriksa hardware fingerprint &amp; status HP...</p>
      </div>

      <!-- STATE 1: FORM INPUT NIS & DEVICE BINDING -->
      <div id="section-login-absensi" class="hidden">
        <div class="intro-block">
          <h2 class="intro-title">VERIFIKASI ABSENSI SISWA</h2>
          <p class="intro-subtitle">Masukkan NIS Anda di HP ini</p>
        </div>

        <div class="form-group">
          <label for="nis-input">Nomor Induk Siswa (NIS)</label>
          <input 
            type="text" 
            id="nis-input" 
            placeholder="Contoh: 1234/123" 
            class="input-field"
            inputmode="text"
            autocomplete="off"
          >
        </div>

        <div id="error-msg" class="error-msg hidden"></div>

        <button id="btn-verifikasi" type="button" class="btn btn-cyan">
          <span id="btn-text">Verifikasi NIS</span>
        </button>
      </div>

      <!-- STATE 2: PROFIL SISWA TERIKAT -->
      <div id="section-profile-absensi" class="hidden">
        <div class="device-status-row">
          <span class="auth-label">STATUS PERANGKAT</span>
          <span class="badge-pill badge-pill--success">🔒 HP Terikat Resmi</span>
        </div>

        <div class="profile-info-grid">
          <p class="profile-field-label">Nama Siswa</p>
          <p id="profile-nama" class="profile-field-value">-</p>

          <div class="profile-grid">
            <div>
              <p class="profile-subfield-label">NIS</p>
              <p id="profile-nis" class="profile-subfield-value">-</p>
            </div>
            <div>
              <p class="profile-subfield-label">Kelas</p>
              <p id="profile-kelas" class="profile-subfield-value--muted">-</p>
            </div>
          </div>
        </div>

        <button id="btn-buka-scanner" type="button" class="btn btn-emerald">
          <i class="fa-solid fa-camera"></i>
          <span>Buka Scanner QR Absensi</span>
        </button>
      </div>

    </section>

    <!-- Footer -->
    <footer class="footer">
      <div class="social-icons">
        <a href="https://wa.me/085645453111" target="_blank" rel="noopener noreferrer" class="social-btn wa"><i class="fa-brands fa-whatsapp"></i></a>
        <a href="https://facebook.com/iskakfatoni" target="_blank" rel="noopener noreferrer" class="social-btn fb"><i class="fa-brands fa-facebook-f"></i></a>
        <a href="https://instagram.com/iskakfatoni" target="_blank" rel="noopener noreferrer" class="social-btn ig"><i class="fa-brands fa-instagram"></i></a>
        <a href="https://youtube.com/iskakfatoni" target="_blank" rel="noopener noreferrer" class="social-btn yt"><i class="fa-brands fa-youtube"></i></a>
        <a href="https://tiktok.com/@iskakfatoni" target="_blank" rel="noopener noreferrer" class="social-btn tt"><i class="fa-brands fa-tiktok"></i></a>
      </div>

      <div class="supported-by">
        <img src="assets/img/nisnas_logo_colorful.webp" alt="Logo NisNas Computer" class="supporter-logo" loading="lazy" decoding="async">
        <p>Supported by <span>NisNas Computer</span></p>
      </div>
    </footer>

  </main>

  <!-- PARTICLE CANVAS -->
  <script src="assets/js/particle/particle-bg.js"></script>

  <!-- LOGIC FIREBASE & HARDWARE FINGERPRINTING -->
  <script type="module">
    import { db } from "./assets/js/config/firebase-config.js";
    import { getHardwareFingerprint } from "./assets/js/utils/device-fingerprint.js";
    import { 
      doc, 
      getDoc, 
      updateDoc,
      collection,
      query,
      where,
      getDocs 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const sectionLoading = document.getElementById('section-loading-absensi');
    const sectionLogin = document.getElementById('section-login-absensi');
    const sectionProfile = document.getElementById('section-profile-absensi');
    const nisInput = document.getElementById('nis-input');
    const btnVerifikasi = document.getElementById('btn-verifikasi');
    const btnText = document.getElementById('btn-text');
    const errorMsg = document.getElementById('error-msg');

    const profileNama = document.getElementById('profile-nama');
    const profileNis = document.getElementById('profile-nis');
    const profileKelas = document.getElementById('profile-kelas');
    const btnBukaScanner = document.getElementById('btn-buka-scanner');

    let currentDeviceId = '';

    // INISIALISASI APLIKASI
    document.addEventListener('DOMContentLoaded', async () => {
      // Hitung Hardware Fingerprint HP secara konsisten
      currentDeviceId = await getHardwareFingerprint();
      localStorage.setItem('portal_device_id', currentDeviceId);

      // 1. DULUAN CEK FIRESTORE BERDASARKAN DEVICE_ID PERANGKAT INI
      try {
        const qDevice = query(collection(db, "siswa"), where("device_id", "==", currentDeviceId));
        const deviceSnap = await getDocs(qDevice);

        if (!deviceSnap.empty) {
          // HP ini SUDAH TERIKAT di Firestore! Langsung tampilkan profilnya meski cache pernah di-clear!
          const docSnap = deviceSnap.docs[0];
          const dbData = docSnap.data();

          const updatedUser = {
            doc_id: docSnap.id,
            nis: dbData.nis,
            nama_siswa: dbData.nama_siswa,
            id_kelas: dbData.id_kelas,
            nama_kelas: dbData.nama_kelas || dbData.id_kelas,
            device_id: currentDeviceId
          };

          localStorage.setItem('portal_siswa_user', JSON.stringify(updatedUser));
          showProfile(updatedUser);
          return;
        }
      } catch (e) {
        console.error("Gagal auto-restore via hardware ID:", e);
      }

      // 2. JIKA CHIP DOKUMEN BELUM TERIKAT PADA FIRESTORE, TAMPILKAN FORM LOGIN
      localStorage.removeItem('portal_siswa_user');
      showLoginForm();
    });

    // VERIFIKASI SISWA & IKAT HP
    btnVerifikasi.addEventListener('click', async () => {
      const rawNis = nisInput.value.trim();
      hideError();

      if (!rawNis) {
        showError("Silakan masukkan NIS Anda terlebih dahulu.");
        return;
      }

      setLoading(true);

      try {
        const safeDocId = rawNis.replace(/\//g, '-');
        
        let docSnap = await getDoc(doc(db, "siswa", safeDocId));
        let dataSiswa = null;
        let actualDocId = safeDocId;

        if (docSnap.exists()) {
          dataSiswa = docSnap.data();
        } else {
          const qNis = query(collection(db, "siswa"), where("nis", "==", rawNis));
          const querySnap = await getDocs(qNis);

          if (!querySnap.empty) {
            docSnap = querySnap.docs[0];
            dataSiswa = docSnap.data();
            actualDocId = docSnap.id;
          }
        }

        if (!dataSiswa) {
          showError(`NIS "${rawNis}" tidak ditemukan! Pastikan terdaftar.`);
          setLoading(false);
          return;
        }

        // VALIDASI 1: Akun NIS ini sudah terikat di HP lain?
        if (dataSiswa.device_id && dataSiswa.device_id !== currentDeviceId) {
          showError("❌ Akun NIS ini sudah terikat di HP lain! Minta Guru/Admin untuk mereset perangkat.");
          setLoading(false);
          return;
        }

        // VALIDASI 2: HP ini terikat ke akun NIS siswa lain?
        const qDevice = query(collection(db, "siswa"), where("device_id", "==", currentDeviceId));
        const deviceSnap = await getDocs(qDevice);

        if (!deviceSnap.empty) {
          let activeOwner = null;
          deviceSnap.forEach(d => {
            if (d.id !== actualDocId && d.data().nis !== rawNis) {
              activeOwner = d.data();
            }
          });

          if (activeOwner) {
            showError(`❌ HP ini sudah terikat dengan siswa: ${activeOwner.nama_siswa} (${activeOwner.nis}). 1 HP hanya untuk 1 siswa!`);
            setLoading(false);
            return;
          }
        }

        // Ikat HP ke Firestore
        await updateDoc(doc(db, "siswa", actualDocId), { device_id: currentDeviceId });

        const userData = {
          doc_id: actualDocId,
          nis: dataSiswa.nis || rawNis,
          nama_siswa: dataSiswa.nama_siswa,
          id_kelas: dataSiswa.id_kelas,
          nama_kelas: dataSiswa.nama_kelas || dataSiswa.id_kelas,
          device_id: currentDeviceId
        };

        localStorage.setItem('portal_siswa_user', JSON.stringify(userData));
        showProfile(userData);

      } catch (err) {
        console.error(err);
        showError("Terjadi kesalahan: " + err.message);
      } finally {
        setLoading(false);
      }
    });

    function showProfile(user) {
      profileNama.innerText = user.nama_siswa;
      profileNis.innerText = user.nis;
      profileKelas.innerText = user.nama_kelas || user.id_kelas;

      sectionLoading.classList.add('hidden');
      sectionLogin.classList.add('hidden');
      sectionProfile.classList.remove('hidden');
    }

    function showLoginForm() {
      sectionLoading.classList.add('hidden');
      sectionProfile.classList.add('hidden');
      sectionLogin.classList.remove('hidden');
    }

    btnBukaScanner.addEventListener('click', () => {
      window.location.href = "siswa/index.html";
    });

    function showError(msg) {
      errorMsg.innerText = msg;
      errorMsg.classList.remove('hidden');
    }

    function hideError() {
      errorMsg.innerText = '';
      errorMsg.classList.add('hidden');
    }

    function setLoading(isLoading) {
      if (isLoading) {
        btnVerifikasi.disabled = true;
        btnText.innerText = "Mengecek NIS & Validasi HP...";
      } else {
        btnVerifikasi.disabled = false;
        btnText.innerText = "Verifikasi NIS & Ikat HP";
      }
    }
  </script>
</body>
</html>
