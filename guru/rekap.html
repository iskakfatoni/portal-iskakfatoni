<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PORTAL :: Rekapitulasi Absensi & Export Excel</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SheetJS / xlsx Library untuk Export Excel -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            darkSlate: '#0F172A',
            deepIndigo: '#1E1B4B',
            accentCyan: '#00F5D4'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gradient-to-b from-darkSlate to-deepIndigo text-slate-100 min-h-screen p-4 md:p-6">

  <div class="max-w-6xl mx-auto space-y-6">
    
    <!-- HEADER NAVBAR -->
    <header class="bg-slate-800/80 backdrop-blur-md rounded-2xl p-4 md:p-5 border border-slate-700/50 flex flex-col md:flex-row md:items-center justify-between gap-4 shadow-xl">
      <div class="flex items-center space-x-3">
        <div class="p-3 bg-cyan-500/10 border border-accentCyan/30 rounded-xl text-accentCyan">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
          </svg>
        </div>
        <div>
          <h1 class="text-lg font-bold text-white tracking-wide">REKAPITULASI ABSENSI</h1>
          <p class="text-xs text-slate-400">Filter data kehadiran & unduh dalam format Excel (.xlsx)</p>
        </div>
      </div>

      <div class="flex items-center space-x-3 self-end md:self-auto">
        <a href="index.html" class="px-3.5 py-2 bg-slate-700 hover:bg-slate-600 border border-slate-600 text-slate-200 rounded-xl text-xs font-semibold transition flex items-center gap-1.5">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
          </svg>
          Kembali ke Dashboard Sesi
        </a>
      </div>
    </header>

    <!-- PANEL FILTER & ACTION BUTTONS -->
    <div class="bg-slate-800/80 backdrop-blur-md rounded-2xl p-5 border border-slate-700/50 shadow-xl space-y-4">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Pilih Sesi Absensi</label>
          <select id="select-sesi" class="w-full px-3.5 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-white text-sm focus:outline-none focus:border-accentCyan">
            <option value="">-- Tampilkan Semua / Filter Sesi --</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Filter Kelas</label>
          <input type="text" id="filter-kelas" placeholder="Contoh: X IPA 1" class="w-full px-3.5 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-white text-sm focus:outline-none focus:border-accentCyan">
        </div>

        <div class="flex items-end gap-2">
          <button id="btn-tampilkan" class="flex-1 py-2.5 px-4 bg-slate-700 hover:bg-slate-600 text-white font-semibold text-sm rounded-xl transition border border-slate-600">
            🔍 Muat Data
          </button>
          <button id="btn-export-excel" class="flex-1 py-2.5 px-4 bg-gradient-to-r from-emerald-500 to-teal-400 text-slate-950 font-bold text-sm rounded-xl hover:opacity-90 active:scale-[0.99] transition shadow-lg shadow-emerald-500/20 flex items-center justify-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
            </svg>
            Export (.xlsx)
          </button>
        </div>

      </div>
    </div>

    <!-- TABEL REKAP ABSENSI -->
    <div class="bg-slate-800/80 backdrop-blur-md rounded-2xl border border-slate-700/50 shadow-xl overflow-hidden space-y-4 p-5">
      <div class="flex items-center justify-between border-b border-slate-700/50 pb-3">
        <h2 class="text-sm font-bold text-white uppercase tracking-wider">Preview Data Laporan Kehadiran</h2>
        <span id="total-record" class="text-xs bg-slate-900 px-3 py-1 rounded-lg text-accentCyan border border-slate-700 font-mono">
          Total: 0 Baris
        </span>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-slate-300">
          <thead class="bg-slate-900/90 text-xs font-semibold uppercase text-accentCyan border-b border-slate-700">
            <tr>
              <th class="px-4 py-3">No</th>
              <th class="px-4 py-3">Tanggal / Waktu</th>
              <th class="px-4 py-3">NIS</th>
              <th class="px-4 py-3">Nama Siswa</th>
              <th class="px-4 py-3">Kelas</th>
              <th class="px-4 py-3 text-center">Status</th>
            </tr>
          </thead>
          <tbody id="table-body" class="divide-y divide-slate-700/50">
            <tr>
              <td colspan="6" class="px-4 py-8 text-center text-xs text-slate-500">
                Klik tombol "Muat Data" untuk menampilkan rekapitulasi absensi.
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="pt-2 text-right">
        <p class="text-[11px] text-slate-500 font-mono">Developed by Iskak Fatoni</p>
      </div>
    </div>

  </div>

  <!-- SCRIPT LOGIC (FIRESTORE & SHEETJS) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      getDocs, 
      query, 
      orderBy,
      where 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { firebaseConfig } from "../assets/js/config/firebase-config.js";

    // Inisialisasi Firebase & Firestore
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // DOM Elements
    const selectSesi = document.getElementById('select-sesi');
    const filterKelas = document.getElementById('filter-kelas');
    const btnTampilkan = document.getElementById('btn-tampilkan');
    const btnExportExcel = document.getElementById('btn-export-excel');
    const tableBody = document.getElementById('table-body');
    const totalRecord = document.getElementById('total-record');

    let currentData = [];

    // 1. INSIALISASI DROPDOWN SESI ABSENSI
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const qSesi = query(collection(db, "sesi_absensi"), orderBy("created_at", "desc"));
        const snapSesi = await getDocs(qSesi);

        snapSesi.forEach(docSnap => {
          const d = docSnap.data();
          const opt = document.createElement('option');
          opt.value = docSnap.id;
          opt.innerText = `${d.tanggal || '-'} | ${d.id_kelas || '-'} (${d.nama_mapel || 'Mapel'})`;
          selectSesi.appendChild(opt);
        });
      } catch (err) {
        console.error("Gagal memuat daftar sesi:", err);
      }
    });

    // 2. MUAT DATA REKAP DARI FIRESTORE
    btnTampilkan.addEventListener('click', loadData);

    async function loadData() {
      btnTampilkan.disabled = true;
      btnTampilkan.innerText = "Memuat...";
      tableBody.innerHTML = `
        <tr>
          <td colspan="6" class="px-4 py-8 text-center text-xs text-slate-400">
            Mengambil data kehadiran dari server...
          </td>
        </tr>
      `;

      try {
        const selectedSesiId = selectSesi.value;
        const inputKelasVal = filterKelas.value.trim().toLowerCase();

        let q;
        if (selectedSesiId) {
          q = query(collection(db, "log_absensi"), where("id_sesi", "==", selectedSesiId));
        } else {
          q = query(collection(db, "log_absensi"), orderBy("created_at", "desc"));
        }

        const querySnap = await getDocs(q);
        currentData = [];

        querySnap.forEach(docSnap => {
          const d = docSnap.data();
          
          // Filter lokal berdasarkan kelas jika diisi
          if (inputKelasVal) {
            const k = (d.id_kelas || "").toLowerCase();
            if (!k.includes(inputKelasVal)) return;
          }

          currentData.push({
            id: docSnap.id,
            nis: d.nis || "-",
            nama: d.nama_siswa || "-",
            kelas: d.id_kelas || "-",
            waktu: d.waktu_scan ? new Date(d.waktu_scan).toLocaleString('id-ID') : "-",
            status: d.status || "Hadir"
          });
        });

        renderTable(currentData);

      } catch (err) {
        console.error("Error loading log absensi:", err);
        tableBody.innerHTML = `
          <tr>
            <td colspan="6" class="px-4 py-8 text-center text-xs text-red-400">
              Gagal mengambil data dari server.
            </td>
          </tr>
        `;
      } finally {
        btnTampilkan.disabled = false;
        btnTampilkan.innerText = "🔍 Muat Data";
      }
    }

    // 3. RENDER DATA KE TABEL HTML
    function renderTable(data) {
      totalRecord.innerText = `Total: ${data.length} Baris`;

      if (data.length === 0) {
        tableBody.innerHTML = `
          <tr>
            <td colspan="6" class="px-4 py-8 text-center text-xs text-slate-500">
              Tidak ada data absensi yang sesuai dengan filter.
            </td>
          </tr>
        `;
        return;
      }

      let html = '';
      data.forEach((item, idx) => {
        html += `
          <tr class="hover:bg-slate-700/30 transition">
            <td class="px-4 py-3 font-mono text-slate-400 text-xs">${idx + 1}</td>
            <td class="px-4 py-3 text-xs font-mono text-slate-300">${item.waktu}</td>
            <td class="px-4 py-3 font-mono text-xs text-slate-200">${item.nis}</td>
            <td class="px-4 py-3 font-semibold text-white">${item.nama}</td>
            <td class="px-4 py-3 text-xs text-slate-300">${item.kelas}</td>
            <td class="px-4 py-3 text-center">
              <span class="px-2.5 py-1 bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 rounded-lg text-[11px] font-bold">
                ${item.status}
              </span>
            </td>
          </tr>
        `;
      });

      tableBody.innerHTML = html;
    }

    // 4. EXPORT DATA DARI TABEL KE FILE EXCEL (.XLSX) VIA SHEETJS
    btnExportExcel.addEventListener('click', () => {
      if (currentData.length === 0) {
        alert("Tidak ada data untuk di-export. Silakan muat data terlebih dahulu.");
        return;
      }

      // Format susunan kolom untuk SheetJS Excel
      const excelRows = currentData.map((item, index) => ({
        "No": index + 1,
        "Waktu Scan": item.waktu,
        "NIS": item.nis,
        "Nama Siswa": item.nama,
        "Kelas": item.kelas,
        "Status Kehadiran": item.status
      }));

      // Inisialisasi Worksheet & Workbook SheetJS
      const worksheet = XLSX.utils.json_to_sheet(excelRows);
      const workbook = XLSX.utils.book_new();

      // Atur Lebar Kolom Otomatis di Excel
      worksheet['!cols'] = [
        { wch: 5 },  // No
        { wch: 22 }, // Waktu Scan
        { wch: 15 }, // NIS
        { wch: 30 }, // Nama Siswa
        { wch: 15 }, // Kelas
        { wch: 15 }  // Status Kehadiran
      ];

      XLSX.utils.book_append_sheet(workbook, worksheet, "Rekap Absensi");

      // Generate Nama File dengan Timestamp Tanggal
      const filename = `Rekap_Absensi_${new Date().toISOString().split('T')[0]}.xlsx`;

      // Trigger Download File Excel di Browser
      XLSX.writeFile(workbook, filename);
    });
  </script>
</body>
</html>
