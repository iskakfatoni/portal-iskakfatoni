<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal Guru SMK Jetis - Dashboard Links</title>
    
    <!-- 1. Firebase SDK CDN (Compat Version) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <!-- 2. Terintegrasi dengan Konfigurasi Terpusat auth.js -->
    <script src="auth.js"></script>

    <style>
        :root {
            --bg-color: #0d0e15;
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.15);
            --neon-cyan: #00f2fe;
            --neon-pink: #ff0844;
            --neon-purple: #7f00ff;
            --neon-green: #00ff87;
            --text-main: #ffffff;
            --text-sub: #b0b3c6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 24px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--card-border);
        }

        h1 {
            margin: 0;
            font-size: 24px;
            background: linear-gradient(45deg, var(--neon-cyan), var(--neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links a {
            color: var(--text-sub);
            text-decoration: none;
            margin-left: 16px;
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid transparent;
            transition: all 0.3s;
        }

        .nav-links a.active, .nav-links a:hover {
            color: var(--neon-cyan);
            border-color: var(--neon-cyan);
            background: var(--card-bg);
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 24px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }

        input {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--card-border);
            color: #fff;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            width: 100%;
            box-sizing: border-box;
        }

        input:focus {
            border-color: var(--neon-cyan);
        }

        .btn-group {
            display: flex;
            gap: 8px;
        }

        button {
            background: linear-gradient(45deg, var(--neon-purple), var(--neon-cyan));
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        button.btn-danger {
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
        }

        button.btn-warning {
            background: linear-gradient(45deg, #f7971e, #ffd200);
            color: #000;
        }

        button.btn-secondary {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
        }

        th, td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 14px;
            vertical-align: middle;
        }

        th {
            color: var(--text-sub);
            font-weight: 600;
        }

        .icon-preview {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            object-fit: cover;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--neon-cyan);
        }

        .status-badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-active {
            background: rgba(0, 255, 135, 0.15);
            color: var(--neon-green);
            border: 1px solid var(--neon-green);
        }

        .status-inactive {
            background: rgba(255, 8, 68, 0.15);
            color: var(--neon-pink);
            border: 1px solid var(--neon-pink);
        }

        .url-text {
            font-family: monospace;
            font-size: 12px;
            color: var(--neon-cyan);
            max-width: 220px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
            text-decoration: none;
        }

        .url-text:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Portal Guru - Dashboard Links</h1>
            <nav class="nav-links">
                <a href="admin.html">Data Guru & Device</a>
                <a href="link.html" class="active">Dashboard Links</a>
                <a href="database.html">Database Direct</a>
            </nav>
        </header>

        <!-- Form Tambah / Edit Link -->
        <div class="glass-card">
            <h3 id="formTitle">Tambah Link Layanan Baru</h3>
            <form id="linkForm">
                <input type="hidden" id="linkIdInput">
                <div class="form-grid">
                    <input type="text" id="titleInput" placeholder="Judul Link (misal: E-Rapor / Presensi)" required>
                    <input type="text" id="descInput" placeholder="Deskripsi Singkat (opsional)">
                    <input type="url" id="iconUrlInput" placeholder="URL Ikon Gambar (PNG/SVG/WebP)" required>
                    <input type="url" id="targetUrlInput" placeholder="Target URL (misal: https://erapor.smkjetis.sch.id)" required>
                    <input type="number" id="orderInput" placeholder="Urutan Tampil (1, 2, 3...)" value="1" required>
                </div>
                <div class="btn-group">
                    <button type="submit" id="submitBtn">Simpan Link</button>
                    <button type="button" id="cancelBtn" class="btn-secondary" style="display: none;" onclick="resetForm()">Batal Edit</button>
                </div>
            </form>
        </div>

        <!-- Tabel Daftar Link -->
        <div class="glass-card">
            <h3>Daftar Link Layanan Dashboard</h3>
            <table>
                <thead>
                    <tr>
                        <th style="width: 60px;">Urutan</th>
                        <th style="width: 60px;">Ikon</th>
                        <th>Judul & Deskripsi</th>
                        <th>Target URL</th>
                        <th>Status</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="linkTableBody">
                    <tr>
                        <td colspan="6" style="text-align: center; color: var(--text-sub);">Memuat data link dari Firestore...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Menggunakan instance 'db' dari auth.js
        const linkForm = document.getElementById('linkForm');
        const linkTableBody = document.getElementById('linkTableBody');
        const formTitle = document.getElementById('formTitle');
        const submitBtn = document.getElementById('submitBtn');
        const cancelBtn = document.getElementById('cancelBtn');

        // 1. Realtime Listener Koleksi dashboard_links (Diurutkan berdasarkan field 'order')
        db.collection('dashboard_links').orderBy('order', 'asc').onSnapshot(snapshot => {
            linkTableBody.innerHTML = '';
            if (snapshot.empty) {
                linkTableBody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: var(--text-sub);">Belum ada link layanan yang ditambahkan.</td></tr>`;
                return;
            }

            snapshot.forEach(doc => {
                const link = { id: doc.id, ...doc.data() };
                const tr = document.createElement('tr');

                tr.innerHTML = `
                    <td style="text-align: center;"><strong>#${link.order || 0}</strong></td>
                    <td>
                        <img src="${link.icon_url}" class="icon-preview" onerror="this.src='https://via.placeholder.com/38?text=ICON'" alt="icon">
                    </td>
                    <td>
                        <strong>${link.title}</strong><br>
                        <small style="color: var(--text-sub);">${link.description || '-'}</small>
                    </td>
                    <td>
                        <a href="${link.target_url}" target="_blank" class="url-text">${link.target_url}</a>
                    </td>
                    <td>
                        <span class="status-badge ${link.is_active ? 'status-active' : 'status-inactive'}">
                            ${link.is_active ? 'Aktif' : 'Sembunyi'}
                        </span>
                    </td>
                    <td>
                        <div class="btn-group">
                            <button class="btn-warning" onclick='editLink(${JSON.stringify(link)})'>Edit</button>
                            <button class="${link.is_active ? 'btn-secondary' : ''}" onclick="toggleLinkStatus('${link.id}', ${link.is_active})">
                                ${link.is_active ? 'Sembunyikan' : 'Tampilkan'}
                            </button>
                            <button class="btn-danger" onclick="deleteLink('${link.id}', '${link.title}')">Hapus</button>
                        </div>
                    </td>
                `;
                linkTableBody.appendChild(tr);
            });
        }, err => {
            console.error("Error fetching dashboard_links:", err);
            linkTableBody.innerHTML = `<tr><td colspan="6" style="color: #ff0844; text-align: center;">Gagal memuat data link: ${err.message}</td></tr>`;
        });

        // 2. Simpan Data (Tambah Baru / Update)
        linkForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const id = document.getElementById('linkIdInput').value || db.collection('dashboard_links').doc().id;
            const title = document.getElementById('titleInput').value.trim();
            const description = document.getElementById('descInput').value.trim();
            const icon_url = document.getElementById('iconUrlInput').value.trim();
            const target_url = document.getElementById('targetUrlInput').value.trim();
            const order = parseInt(document.getElementById('orderInput').value) || 1;

            try {
                await db.collection('dashboard_links').doc(id).set({
                    id: id,
                    title: title,
                    description: description,
                    icon_url: icon_url,
                    target_url: target_url,
                    order: order,
                    is_active: true
                }, { merge: true });

                alert(`Link "${title}" berhasil disimpan!`);
                resetForm();
            } catch (err) {
                alert("Gagal menyimpan link: " + err.message);
            }
        });

        // 3. Mode Edit
        function editLink(link) {
            formTitle.innerText = "Edit Link Layanan";
            submitBtn.innerText = "Update Link";
            cancelBtn.style.display = "inline-block";

            document.getElementById('linkIdInput').value = link.id;
            document.getElementById('titleInput').value = link.title;
            document.getElementById('descInput').value = link.description || '';
            document.getElementById('iconUrlInput').value = link.icon_url;
            document.getElementById('targetUrlInput').value = link.target_url;
            document.getElementById('orderInput').value = link.order || 1;
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 4. Reset Form
        function resetForm() {
            formTitle.innerText = "Tambah Link Layanan Baru";
            submitBtn.innerText = "Simpan Link";
            cancelBtn.style.display = "none";
            linkForm.reset();
            document.getElementById('linkIdInput').value = '';
        }

        // 5. Toggle Status Aktif/Sembunyi
        async function toggleLinkStatus(id, currentStatus) {
            try {
                await db.collection('dashboard_links').doc(id).update({
                    is_active: !currentStatus
                });
            } catch (err) {
                alert("Gagal mengubah status link: " + err.message);
            }
        }

        // 6. Hapus Link
        async function deleteLink(id, title) {
            if (!confirm(`Apakah Anda yakin ingin menghapus permanent link "${title}"?`)) return;
            try {
                await db.collection('dashboard_links').doc(id).delete();
            } catch (err) {
                alert("Gagal menghapus link: " + err.message);
            }
        }
    </script>
</body>
</html>
