<!-- Container tempat link akan dimuat secara dinamis -->
<section id="links-container" class="links">
  <!-- Spinner / Loading state -->
  <p>Loading links...</p>
</section>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = { /* Konfigurasi Firebase Kamu */ };
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  async function loadLinks() {
    const container = document.getElementById('links-container');
    const q = query(collection(db, "links"), orderBy("order", "asc"));
    const querySnapshot = await getDocs(q);
    
    container.innerHTML = ''; // Clear loading
    querySnapshot.forEach((doc) => {
      const data = doc.data();
      container.innerHTML += `
        <a href="${data.url}" target="_blank" class="link-card">
          <i class="${data.icon} icon"></i>
          <span>${data.title}</span>
        </a>
      `;
    });
  }

  loadLinks();
</script>
