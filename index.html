<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iskak Fatoni - Bio Links</title>
  <link rel="stylesheet" href="style.css">
  <!-- Google Fonts & FontAwesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <main class="container">
    <!-- Profil Header -->
    <header class="profile">
      <img src="https://via.placeholder.com/110" alt="Foto Profil" class="avatar">
      <h1 class="name">Iskak Fatoni, S.Pd., Gr.</h1>
      <p class="bio">Developer & IoT Maker | Open Source Enthusiast</p>
    </header>

    <!-- Daftar Link Dinamis dari Firestore -->
    <section id="links-container" class="links">
      <p style="color: #94a3b8;">Memuat link...</p>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <p>© 2026 • Developed by Iskak Fatoni</p>
    </footer>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Konfigurasi resmi proyek portal-iskakfatoni
    const firebaseConfig = {
      apiKey: "AIzaSyDhq4QoCn00GkfpKXSP8PnvSvEKa2yn0ic",
      authDomain: "portal-iskakfatoni.firebaseapp.com",
      projectId: "portal-iskakfatoni",
      storageBucket: "portal-iskakfatoni.firebasestorage.app",
      messagingSenderId: "367350728822",
      appId: "1:367350728822:web:6b0c6fd4824102d8acf757",
      measurementId: "G-0BNNKQQ24V"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const container = document.getElementById('links-container');

    // Realtime Listener
    const q = query(collection(db, "links"), orderBy("order", "asc"));
    onSnapshot(q, (snapshot) => {
      container.innerHTML = '';
      
      if (snapshot.empty) {
        container.innerHTML = '<p style="color:#94a3b8;">Belum ada link yang ditambahkan.</p>';
        return;
      }

      snapshot.forEach((doc) => {
        const data = doc.data();
        container.innerHTML += `
          <a href="${data.url}" target="_blank" rel="noopener noreferrer" class="link-card">
            <i class="${data.icon || 'fa-solid fa-link'} icon"></i>
            <span>${data.title}</span>
          </a>
        `;
      });
    }, (error) => {
      console.error("Firestore Error:", error);
      container.innerHTML = `<p style="color:#ef4444; font-size:0.9rem;">Gagal memuat link: ${error.message}</p>`;
    });
  </script>

</body>
</html>
