<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>PORTAL :: Iskak Fatoni</title>
  
  <!-- Font & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0b0f19;
      color: #ffffff;
    }

    #particle-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .main-container {
      position: relative;
      z-index: 10;
    }

    .glass-card {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 selection:bg-cyan-500 selection:text-slate-950">

  <!-- PARTICLE CANVAS BACKGROUND -->
  <canvas id="particle-canvas"></canvas>

  <main class="main-container w-full max-w-sm my-auto space-y-8 text-center">
    
    <!-- FOTO PROFIL & TULISAN PORTAL -->
    <header class="space-y-4">
      <div class="relative inline-block">
        <div class="w-32 h-32 rounded-full p-1 bg-gradient-to-tr from-cyan-400 via-indigo-500 to-emerald-400 shadow-2xl shadow-cyan-500/20">
          <img 
            src="foto_asn_profile.png" 
            alt="Muchamad Iskak Fatoni" 
            class="w-full h-full object-cover rounded-full border-4 border-slate-900"
            onerror="this.src='https://ui-avatars.com/api/?name=Iskak+Fatoni&background=0284c7&color=fff'"
          >
        </div>
      </div>
      
      <div>
        <h1 class="text-3xl font-extrabold tracking-widest text-white uppercase">PORTAL</h1>
        <p class="text-xs text-cyan-400 font-semibold tracking-wider mt-1">ISKAK FATONI, S.Pd., Gr.</p>
      </div>
    </header>

    <!-- MENU NAVIGASI DUA MODUL -->
    <div class="space-y-3 pt-2">
      
      <!-- TOMBOL MODUL 1: PORTAL LINK -->
      <a 
        href="link.html" 
        class="group glass-card py-4 px-6 rounded-2xl flex items-center justify-between border border-cyan-500/30 hover:border-cyan-400 transition-all duration-300 hover:scale-[1.02] shadow-lg shadow-cyan-500/10 block"
      >
        <div class="flex items-center gap-3">
          <i class="fa-solid fa-link text-cyan-400 text-lg group-hover:scale-110 transition-transform"></i>
          <span class="text-sm font-bold text-white group-hover:text-cyan-400 transition-colors">Portal Link & Info</span>
        </div>
        <i class="fa-solid fa-arrow-right text-xs text-slate-500 group-hover:text-cyan-400 group-hover:translate-x-1 transition-all"></i>
      </a>

      <!-- TOMBOL MODUL 2: ABSENSI SISWA -->
      <a 
        href="absensi.html" 
        class="group glass-card py-4 px-6 rounded-2xl flex items-center justify-between border border-emerald-500/30 hover:border-emerald-400 transition-all duration-300 hover:scale-[1.02] shadow-lg shadow-emerald-500/10 block"
      >
        <div class="flex items-center gap-3">
          <i class="fa-solid fa-qrcode text-emerald-400 text-lg group-hover:scale-110 transition-transform"></i>
          <span class="text-sm font-bold text-white group-hover:text-emerald-400 transition-colors">Absensi Siswa TEI</span>
        </div>
        <i class="fa-solid fa-arrow-right text-xs text-slate-500 group-hover:text-emerald-400 group-hover:translate-x-1 transition-all"></i>
      </a>

    </div>

    <!-- FOOTER SIMPLE -->
    <footer class="pt-4 text-center">
      <p class="text-[11px] text-slate-500 font-mono">Developed by Iskak Fatoni, S.Pd., Gr.</p>
    </footer>

  </main>

  <!-- PARTICLE ANIMATION SCRIPT -->
  <script>
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function initCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      particles = [];
      for (let i = 0; i < 25; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          radius: Math.random() * 2 + 1,
          speedY: Math.random() * -0.5 - 0.2,
          speedX: (Math.random() - 0.5) * 0.3,
          opacity: Math.random() * 0.5 + 0.2
        });
      }
    }

    function drawParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(56, 189, 248, ${p.opacity})`;
        ctx.fill();

        p.y += p.speedY;
        p.x += p.speedX;
        if (p.y < 0) {
          p.y = canvas.height;
          p.x = Math.random() * canvas.width;
        }
      });
      requestAnimationFrame(drawParticles);
    }

    window.addEventListener('resize', initCanvas);
    initCanvas();
    drawParticles();
  </script>
</body>
</html>
