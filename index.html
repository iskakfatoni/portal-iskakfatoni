<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDhq4QoCn00GkfpKXSP8PnvSvEKa2yn0ic",
    authDomain: "portal-iskakfatoni.firebaseapp.com",
    projectId: "portal-iskakfatoni",
    storageBucket: "portal-iskakfatoni.firebasestorage.app",
    messagingSenderId: "367350728822",
    appId: "1:367350728822:web:6b0c6fd4824102d8acf757",
    measurementId: "G-0BNNKQQ24V"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const container = document.getElementById('links-container');

  const q = query(collection(db, "links"), orderBy("order", "asc"));
  onSnapshot(q, (snapshot) => {
    container.innerHTML = '';
    
    if (snapshot.empty) {
      container.innerHTML = '<p style="color:#94a3b8; font-size: 0.85rem;">Belum ada link yang aktif.</p>';
      return;
    }

    let index = 0;
    snapshot.forEach((doc) => {
      const data = doc.data();
      
      // Menggilir variasi warna (0, 1, 2, 3) secara otomatis
      const colorClass = `card-color-${index % 4}`;
      index++;

      container.innerHTML += `
        <a href="${data.url}" target="_blank" rel="noopener noreferrer" class="link-card ${colorClass}">
          <i class="${data.icon || 'fa-solid fa-link'} icon"></i>
          <span>${data.title}</span>
        </a>
      `;
    });
  }, (error) => {
    console.error("Firestore Error:", error);
    container.innerHTML = `<p style="color:#ef4444; font-size:0.8rem;">Gagal memuat link.</p>`;
  });
</script>
