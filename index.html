<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UPDATE APLIKASI - PORTAL::IskakFatoni</title>
  <link rel="stylesheet" href="style/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #0b0f19;
      color: white;
      text-align: center;
    }
    .update-box {
      padding: 40px 20px;
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      max-width: 90%;
      width: 400px;
    }
    .warning-icon {
      font-size: 60px;
      color: #00F5D4;
      margin-bottom: 20px;
      animation: pulse 2s infinite;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 10px;
      letter-spacing: 2px;
      font-weight: 800;
    }
    p {
      color: #94a3b8;
      font-size: 16px;
      line-height: 1.6;
    }
    .contact-info {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
    .name {
      font-weight: 700;
      color: white;
      display: block;
      margin-bottom: 5px;
    }
    .phone {
      font-family: monospace;
      color: #38bdf8;
      font-size: 18px;
      font-weight: 700;
      text-decoration: none;
    }
    @keyframes pulse {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.1); opacity: 0.7; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="update-box">
    <i class="fa-solid fa-cloud-arrow-down warning-icon"></i>
    <h1>UPDATE APLIKASI SEKARANG</h1>
    <p>Aplikasi Anda sudah tidak didukung. Silakan gunakan versi terbaru untuk tetap dapat mengakses portal.</p>
    
    <div class="contact-info">
      <span class="name">Hubungi : Iskak Fatoni</span>
      <a href="tel:085645453111" class="phone">085645453111</a>
    </div>
  </div>
</body>
</html>
