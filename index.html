<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PORTAL::IskakFatoni</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- PARTICLE CANVAS -->
  <canvas id="particle-canvas"></canvas>

  <main class="container">
    <!-- Profil Header -->
    <header class="profile">
      <div class="avatar-ring">
        <img 
          src="foto_asn_profile.png" 
          alt="Muchamad Iskak Fatoni" 
          class="avatar">
      </div>
      <h1 class="name">PORTAL::Iskak Fatoni</h1>
      <p class="bio">I'am certified electronical and computer teacher, also a former Kamen Rider</p>
    </header>

    <!-- Progress Bar Cyan -->
    <div id="loading-bar-wrapper" class="progress-bar-container">
      <div class="progress-bar-fill"></div>
    </div>

    <!-- Daftar Link Dinamis dari Firebase / Off Mode Notice -->
    <section id="links-container" class="links">
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <!-- Deretan Logo Sosial Media Kecil -->
      <div class="social-icons">
        <a href="https://wa.me/085645453111" target="_blank" rel="noopener noreferrer" class="social-btn wa" title="WhatsApp Iskak">
          <i class="fa-brands fa-whatsapp"></i>
        </a>
        <a href="https://facebook.com/iskakfatoni" target="_blank" rel="noopener noreferrer" class="social-btn fb" title="Facebook Iskak">
          <i class="fa-brands fa-facebook-f"></i>
        </a>
        <a href="https://instagram.com/iskakfatoni" target="_blank" rel="noopener noreferrer" class="social-btn ig" title="Instagram Iskak">
          <i class="fa-brands fa-instagram"></i>
        </a>
        <a href="https://youtube.com/iskakfatoni" target="_blank" rel="noopener noreferrer" class="social-btn yt" title="YouTube Iskak">
          <i class="fa-brands fa-youtube"></i>
        </a>
        <a href="https://tiktok.com/@iskakfatoni" target="_blank" rel="noopener noreferrer" class="social-btn tt" title="TikTok">
          <i class="fa-brands fa-tiktok"></i>
        </a>
      </div>

      <!-- Supported By dengan Logo NisNas Computer -->
      <div class="supported-by">
        <img src="nisnas_logo_colorful.png" alt="Logo NisNas Computer" class="supporter-logo">
        <p>Supported by <span>NisNas Computer</span></p>
      </div>
    </footer>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, query, orderBy, onSnapshot, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // --- SCRIPT PARTIKEL SECURE CANVAS (KUNCI AGAR TIDAK MELER KE KANAN) ---
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function initCanvas() {
      // Ambil ukuran riil viewport
      canvas.width = document.documentElement.clientWidth || window.innerWidth;
      canvas.height = window.innerHeight;
      particles = [];
      for (let i = 0; i < 35; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          radius: Math.random() * 2 + 1,
          speedY: Math.random() * -0.5 - 0.2,
          speedX: (Math.random() - 0.5) * 0.3,
          opacity: Math.random() * 0.6 + 0.3
        });
      }
    }

    function drawParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(0, 245, 212, ${p.opacity})`;
        ctx.shadowBlur = 6;
        ctx.shadowColor = "#00F5D4";
        ctx.fill();

        p.y += p.speedY;
        p.x += p.speedX;

        if (p.y < 0) {
          p.y = canvas.height;
          p.x = Math.random() * canvas.width;
        }
      });
      requestAnimationFrame(drawParticles);
    }

    window.addEventListener('resize', initCanvas);
    initCanvas();
    drawParticles();

    // --- FIREBASE REALTIME SETUP ---
    const firebaseConfig = {
      apiKey: "AIzaSyDhq4QoCn00GkfpKXSP8PnvSvEKa2yn0ic",
      authDomain: "portal-iskakfatoni.firebaseapp.com",
      projectId: "portal-iskakfatoni",
      storageBucket: "portal-iskakfatoni.firebasestorage.app",
      messagingSenderId: "367350728822",
      appId: "1:367350728822:web:6b0c6fd4824102d8acf757",
      measurementId: "G-0BNNKQQ24V"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const container = document.getElementById('links-container');
    const progressBar = document.getElementById('loading-bar-wrapper');

    onSnapshot(doc(db, "settings", "portal"), (docSnap) => {
      let isOnline = true;
      if (docSnap.exists() && docSnap.data().isOnline !== undefined) {
        isOnline = docSnap.data().isOnline;
      }

      if (!isOnline) {
        if (progressBar) progressBar.style.display = 'none';
        container.innerHTML = `
          <div class="off-card">
            <i class="fa-solid fa-store-slash"></i>
            <h2>PORTAL TUTUP</h2>
            <p>BELUM ADA TUGAS ATAU INFO TERBARU</p>
          </div>
        `;
      } else {
        loadPublicLinks();
      }
    }, (error) => {
      console.warn("Fallback to ON Mode:", error);
      loadPublicLinks();
    });

    function loadPublicLinks() {
      const q = query(collection(db, "links"), orderBy("order", "asc"));
      onSnapshot(q, (snapshot) => {
        if (progressBar) progressBar.style.display = 'none';
        container.innerHTML = '';
        
        if (snapshot.empty) {
          container.innerHTML = '<p style="color:#64748b; font-size: 0.85rem;">Belum ada link yang aktif.</p>';
          return;
        }

        let index = 0;
        snapshot.forEach((docSnap) => {
          const data = docSnap.data();
          const colorClass = `card-color-${index % 4}`;
          index++;

          container.innerHTML += `
            <a href="${data.url}" target="_blank" rel="noopener noreferrer" class="link-card ${colorClass}">
              <i class="${data.icon || 'fa-solid fa-link'} icon"></i>
              <span>${data.title}</span>
            </a>
          `;
        });
      }, (error) => {
        if (progressBar) progressBar.style.display = 'none';
        console.error("Firestore Error:", error);
        container.innerHTML = `<p style="color:#ef4444; font-size:0.8rem;">Gagal memuat link.</p>`;
      });
    }
  </script>

</body>
</html>
