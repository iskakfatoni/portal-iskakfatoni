<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PORTAL :: Kelola Link & Running Text</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0b0f19;
      color: #ffffff;
    }
    .glass-card {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-start items-center p-4 md:p-8">

  <main class="max-w-5xl w-full space-y-6 my-auto">
    
    <!-- TOP BAR HEADER -->
    <header class="flex items-center justify-between glass-card p-4 md:p-5 rounded-2xl shadow-xl">
      <div class="flex items-center gap-3.5">
        <div class="w-11 h-11 rounded-xl bg-cyan-500/10 border border-cyan-500/30 flex items-center justify-center text-cyan-400 font-bold">
          <i class="fa-solid fa-link text-xl"></i>
        </div>
        <div>
          <h2 class="text-base font-bold text-white tracking-wide">Kelola Link Portal &amp; Running Text</h2>
          <p id="user-email-display" class="text-xs text-slate-400 font-mono">admin@domain.com</p>
        </div>
      </div>

      <button id="btn-logout" title="Keluar ke Master Admin" class="py-2.5 px-4 bg-red-500/15 hover:bg-red-500/30 text-red-400 border border-red-500/40 font-bold text-xs rounded-xl transition flex items-center gap-2 cursor-pointer">
        <i class="fa-solid fa-arrow-left"></i> <span>Kembali ke Hub Admin</span>
      </button>
    </header>

    <!-- GRID DUA KOLOM: FORM (KIRI) & DAFTAR LINK (KANAN) -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      
      <!-- FORM RUNNING TEXT & TAMBAH LINK -->
      <div class="lg:col-span-5 space-y-6">
        
        <!-- FORM RUNNING TEXT -->
        <div class="glass-card p-6 rounded-2xl space-y-3 shadow-xl">
          <h3 class="text-xs font-bold text-cyan-400 border-b border-slate-800 pb-2 flex items-center gap-2 uppercase tracking-wider">
            <i class="fa-solid fa-bullhorn"></i> Running Text Pengumuman
          </h3>
          <div class="space-y-1">
            <textarea id="input-running-text" rows="3" placeholder="Tuliskan pengumuman running text di sini..." class="w-full p-3 bg-slate-950 border border-slate-800 rounded-xl text-slate-100 text-xs focus:outline-none focus:border-cyan-500 resize-none"></textarea>
          </div>
          <button id="btn-save-announcement" class="w-full py-2.5 px-4 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-xs rounded-xl transition flex items-center justify-center gap-2 cursor-pointer shadow-lg shadow-cyan-500/20">
            <i class="fa-solid fa-floppy-disk"></i> Simpan Running Text
          </button>
        </div>

        <!-- FORM TAMBAH LINK BARU -->
        <div class="glass-card p-6 rounded-2xl space-y-4 shadow-xl">
          <h3 class="text-xs font-bold text-cyan-400 border-b border-slate-800 pb-2 flex items-center gap-2 uppercase tracking-wider">
            <i class="fa-solid fa-plus-circle"></i> Tambah Link Baru
          </h3>
          <form id="form-add-link" class="space-y-3" onsubmit="return false;">
            <div class="space-y-1">
              <label class="block text-[11px] font-semibold text-slate-300">Judul Link / Materi</label>
              <input type="text" id="input-link-title" placeholder="Contoh: Modul Pembelajaran TEI" required class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-slate-100 text-xs focus:outline-none focus:border-cyan-500">
            </div>

            <div class="space-y-1">
              <label class="block text-[11px] font-semibold text-slate-300">URL Destination Link</label>
              <input type="url" id="input-link-url" placeholder="https://drive.google.com/..." required class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-slate-100 text-xs focus:outline-none focus:border-cyan-500">
            </div>

            <button type="submit" id="btn-add-link" class="w-full py-3 px-4 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-xs rounded-xl transition flex items-center justify-center gap-2 cursor-pointer shadow-lg shadow-emerald-500/20">
              <i class="fa-solid fa-plus"></i> Tambahkan Link ke Portal
            </button>
          </form>
        </div>

      </div>

      <!-- DAFTAR LINK TAMPIL -->
      <div class="lg:col-span-7 glass-card p-6 rounded-2xl space-y-4 shadow-xl">
        <div class="flex items-center justify-between border-b border-slate-800 pb-3">
          <h3 class="text-xs font-bold text-cyan-400 flex items-center gap-2 uppercase tracking-wider">
            <i class="fa-solid fa-list-ul"></i> Daftar Tautan Portal Aktif
          </h3>
          <span id="link-count" class="text-xs text-slate-400 font-mono font-bold bg-slate-950 px-3 py-1 rounded-full border border-slate-800">0 Link</span>
        </div>

        <div id="link-list-container" class="space-y-2.5 max-h-[480px] overflow-y-auto pr-2">
          <p class="text-xs text-slate-500 text-center py-10">// Memuat daftar link dari Firestore...</p>
        </div>
      </div>

    </div>

    <!-- FOOTER -->
    <div class="text-center pt-2">
      <p class="text-xs text-slate-500 font-mono">Developed by Iskak Fatoni, S.Pd., Gr.</p>
    </div>

  </main>

  <!-- FIREBASE AUTH & FIRESTORE LOGIC -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, collection, doc, setDoc, addDoc, deleteDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDhq4QoCn00GkfpKXSP8PnvSvEKa2yn0ic",
      authDomain: "portal-iskakfatoni.firebaseapp.com",
      projectId: "portal-iskakfatoni",
      storageBucket: "portal-iskakfatoni.firebasestorage.app",
      messagingSenderId: "367350728822",
      appId: "1:367350728822:web:6b0c6fd4824102d8acf757",
      measurementId: "G-0BNNKQQ24V"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const userEmailDisplay = document.getElementById('user-email-display');
    const btnLogout = document.getElementById('btn-logout');
    const inputRunningText = document.getElementById('input-running-text');
    const btnSaveAnnouncement = document.getElementById('btn-save-announcement');
    const formAddLink = document.getElementById('form-add-link');
    const inputLinkTitle = document.getElementById('input-link-title');
    const inputLinkUrl = document.getElementById('input-link-url');
    const linkListContainer = document.getElementById('link-list-container');
    const linkCount = document.getElementById('link-count');

    // 🔒 PROTEKSI ROUTE
    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = "../admin.html";
      } else {
        userEmailDisplay.innerText = user.email;
        loadRunningText();
        loadLinksList();
      }
    });

    // 🚪 LOGOUT KEMBALI KE ADMIN.HTML
    btnLogout.addEventListener('click', () => {
      if (confirm("Kembali ke Master Admin Hub Pusat?")) {
        signOut(auth).then(() => {
          window.location.href = "../admin.html";
        });
      }
    });

    function loadRunningText() {
      onSnapshot(doc(db, "settings", "announcement"), (docSnap) => {
        if (docSnap.exists()) {
          inputRunningText.value = docSnap.data().text || '';
        }
      });
    }

    btnSaveAnnouncement.addEventListener('click', async () => {
      const text = inputRunningText.value.trim();
      try {
        await setDoc(doc(db, "settings", "announcement"), { text, updated_at: serverTimestamp() });
        alert("Running text pengumuman berhasil disimpan!");
      } catch (err) {
        alert("Gagal menyimpan pengumuman: " + err.message);
      }
    });

    function loadLinksList() {
      onSnapshot(collection(db, "links"), (snapshot) => {
        linkListContainer.innerHTML = '';
        linkCount.innerText = `${snapshot.size} Link`;

        if (snapshot.empty) {
          linkListContainer.innerHTML = '<p class="text-xs text-slate-500 text-center py-10">// Belum ada link portal yang ditambahkan...</p>';
          return;
        }

        snapshot.forEach((docSnap) => {
          const data = docSnap.data();
          const docId = docSnap.id;

          const item = document.createElement('div');
          item.className = 'flex items-center justify-between p-3.5 bg-slate-950/90 rounded-xl border border-slate-800 text-xs hover:border-cyan-500/30 transition';
          item.innerHTML = `
            <div class="space-y-0.5">
              <p class="font-bold text-white text-sm">${data.title}</p>
              <a href="${data.url}" target="_blank" class="text-cyan-400 font-mono text-[11px] hover:underline">${data.url}</a>
            </div>
            <button class="btn-del p-2 bg-red-500/15 hover:bg-red-500/30 text-red-400 border border-red-500/30 rounded-lg text-xs font-semibold cursor-pointer" title="Hapus Link">
              <i class="fa-solid fa-trash"></i>
            </button>
          `;

          item.querySelector('.btn-del').onclick = async () => {
            if (confirm(`Hapus link "${data.title}"?`)) {
              await deleteDoc(doc(db, "links", docId));
            }
          };

          linkListContainer.appendChild(item);
        });
      });
    }

    formAddLink.addEventListener('submit', async () => {
      const title = inputLinkTitle.value.trim();
      const url = inputLinkUrl.value.trim();

      if (!title || !url) return;

      try {
        await addDoc(collection(db, "links"), { title, url, created_at: serverTimestamp() });
        inputLinkTitle.value = '';
        inputLinkUrl.value = '';
      } catch (err) {
        alert("Gagal menambah link: " + err.message);
      }
    });
  </script>
</body>
</html>
