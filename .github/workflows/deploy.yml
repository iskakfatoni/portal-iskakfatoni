name: Deploy Absensi Portal to GitHub Pages

on:
  push:
    branches:
      - main # Workflow berjalan otomatis setiap kali ada git push ke branch main

  # Mengizinkan eksekusi workflow secara manual dari tab Actions di GitHub
  workflow_dispatch:

# Memberikan izin yang diperlukan untuk menerbitkan ke GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Mencegah konflik deployment dengan membatalkan run yang sedang berjalan jika ada push baru
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          # Mengunggah seluruh folder akar proyek (root)
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
