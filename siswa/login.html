<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PORTAL :: Login Siswa</title>
  
  <!-- Master Stylesheet Terpusat & FontAwesome -->
  <link rel="stylesheet" href="../styles/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 relative">

  <!-- BACKGROUND PARTICLE CANVAS -->
  <canvas id="particle-canvas"></canvas>

  <!-- CONTAINER FORM LOGIN -->
  <div class="max-w-md w-full glass-card p-6 sm:p-8 rounded-2xl shadow-2xl relative z-10 my-auto">
    
    <!-- HEADER BRANDING -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-cyan-500/10 border border-cyan-500/30 mb-3 text-cyan-400 shadow-lg shadow-cyan-500/10">
        <i class="fa-solid fa-user-graduate text-3xl"></i>
      </div>
      <h1 class="text-2xl font-bold tracking-wide text-white">MASUK SISWA</h1>
      <p class="text-xs text-slate-400 mt-1">Masukkan Nomor Induk Siswa (NIS) Anda</p>
    </div>

    <!-- ALERT NOTIFIKASI ERROR -->
    <div id="alert-error" class="hidden mb-5 p-3.5 bg-red-500/10 border border-red-500/40 rounded-xl text-red-400 text-xs flex items-center space-x-2.5">
      <i class="fa-solid fa-circle-exclamation text-base flex-shrink-0"></i>
      <span id="error-message">NIS tidak ditemukan. Periksa kembali NIS Anda.</span>
    </div>

    <!-- FORM INPUT LOGIN -->
    <form id="form-login" class="space-y-5">
      <div>
        <label for="nis" class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2">NIS (Nomor Induk Siswa)</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <i class="fa-solid fa-id-card text-base"></i>
          </div>
          <input 
            type="text" 
            id="nis" 
            name="nis" 
            placeholder="Contoh: 9177/413 atau 2026001" 
            required
            autocomplete="off"
            class="w-full pl-11 pr-4 py-3 bg-slate-950/80 border border-slate-700 rounded-xl text-white placeholder-slate-500 text-sm focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition duration-200"
          >
        </div>
      </div>

      <!-- TOMBOL SUBMIT -->
      <button 
        type="submit" 
        id="btn-submit"
        class="w-full py-3.5 px-4 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-sm rounded-xl transition duration-200 shadow-lg shadow-cyan-500/20 flex items-center justify-center space-x-2 cursor-pointer"
      >
        <span id="btn-text">Masuk ke Portal</span>
        <div id="btn-spinner" class="hidden w-5 h-5 border-2 border-slate-950 border-t-transparent rounded-full animate-spin"></div>
      </button>
    </form>

    <!-- FOOTER BRANDING -->
    <div class="mt-8 text-center border-t border-slate-800/80 pt-4">
      <p class="text-[11px] text-slate-500 font-mono">Developed by Iskak Fatoni, S.Pd., Gr.</p>
    </div>

  </div>

  <!-- CANVAS ANIMATION -->
  <script>
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function initCanvas() {
      canvas.width = document.documentElement.clientWidth || window.innerWidth;
      canvas.height = window.innerHeight;
      particles = [];
      for (let i = 0; i < 35; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          radius: Math.random() * 2 + 1,
          speedY: Math.random() * -0.5 - 0.2,
          speedX: (Math.random() - 0.5) * 0.3,
          opacity: Math.random() * 0.6 + 0.3
        });
      }
    }

    function drawParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const isDarkMode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const particleColor = isDarkMode ? "0, 245, 212" : "139, 92, 246";

      particles.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${particleColor}, ${p.opacity})`;
        ctx.shadowBlur = 6;
        ctx.shadowColor = `rgb(${particleColor})`;
        ctx.fill();

        p.y += p.speedY; p.x += p.speedX;
        if (p.y < 0) { p.y = canvas.height; p.x = Math.random() * canvas.width; }
      });
      requestAnimationFrame(drawParticles);
    }

    window.addEventListener('resize', initCanvas);
    initCanvas();
    drawParticles();
  </script>

  <!-- SCRIPT LOGIN LOGIC -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { 
      getFirestore, 
      doc, 
      getDoc, 
      collection, 
      query, 
      where, 
      getDocs 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { firebaseConfig } from "../assets/js/config/firebase-config.js";

    // Inisialisasi Firebase & Firestore
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const formLogin = document.getElementById('form-login');
    const inputNis = document.getElementById('nis');
    const alertError = document.getElementById('alert-error');
    const errorMessage = document.getElementById('error-message');
    const btnSubmit = document.getElementById('btn-submit');
    const btnText = document.getElementById('btn-text');
    const btnSpinner = document.getElementById('btn-spinner');

    // 1. CEK SESI LOKAL SEBELUM FORM DIMUAT
    document.addEventListener('DOMContentLoaded', () => {
      const existingSession = localStorage.getItem('siswa_session');
      if (existingSession) {
        try {
          const dataSiswa = JSON.parse(existingSession);
          if (dataSiswa && dataSiswa.nis) {
            window.location.href = 'index.html';
          }
        } catch (e) {
          localStorage.removeItem('siswa_session');
        }
      }
    });

    // 2. HELPER UI CONTROLLER
    function setLoading(isLoading) {
      if (isLoading) {
        btnSubmit.disabled = true;
        btnText.innerText = "Memverifikasi...";
        btnSpinner.classList.remove('hidden');
        alertError.classList.add('hidden');
      } else {
        btnSubmit.disabled = false;
        btnText.innerText = "Masuk ke Portal";
        btnSpinner.classList.add('hidden');
      }
    }

    function showError(msg) {
      errorMessage.innerText = msg;
      alertError.classList.remove('hidden');
    }

    // 3. PROSES VERIFIKASI NIS SAAT SUBMIT
    formLogin.addEventListener('submit', async (e) => {
      e.preventDefault();
      const rawNisInput = inputNis.value.trim();

      if (!rawNisInput) {
        showError("Silakan masukkan NIS Anda.");
        return;
      }

      setLoading(true);

      try {
        // Sanitasi ID Dokumen Firestore (Ganti '/' menjadi '-')
        const docIdSanitized = rawNisInput.replace(/\//g, '-');
        
        // Metode A: Cek Firestore berdasarkan Document ID
        const docRef = doc(db, "siswa", docIdSanitized);
        let docSnap = await getDoc(docRef);
        
        let dataSiswa = null;

        if (docSnap.exists()) {
          dataSiswa = docSnap.data();
          dataSiswa.nis = docSnap.data().nis || rawNisInput;
        } else {
          // Metode B: Fallback Query berdasarkan field `nis` asli
          const q = query(collection(db, "siswa"), where("nis", "==", rawNisInput));
          const querySnapshot = await getDocs(q);

          if (!querySnapshot.empty) {
            const firstDoc = querySnapshot.docs[0];
            dataSiswa = firstDoc.data();
            dataSiswa.nis = firstDoc.data().nis || firstDoc.id;
          }
        }

        if (dataSiswa) {
          // NIS DITEMUKAN: Simpan profil ke LocalStorage (Persistent Session)
          const sessionPayload = {
            id_siswa: dataSiswa.id_siswa || dataSiswa.nis,
            nis: dataSiswa.nis,
            nama: dataSiswa.nama_siswa || dataSiswa.nama || "Siswa",
            id_kelas: dataSiswa.id_kelas || "-",
            nama_kelas: dataSiswa.nama_kelas || "-",
            logged_at: new Date().toISOString()
          };

          localStorage.setItem('siswa_session', JSON.stringify(sessionPayload));

          // Transisi Pindah Halaman ke Scanner Siswa (index.html)
          btnText.innerText = "Login Berhasil!";
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 500);

        } else {
          // NIS TIDAK DITEMUKAN
          setLoading(false);
          showError(`NIS '${rawNisInput}' tidak terdaftar di sistem. Hubungi guru pengajar.`);
        }

      } catch (error) {
        console.error("Firestore Auth Error:", error);
        setLoading(false);
        showError("Gagal terhubung ke server. Periksa koneksi internet Anda.");
      }
    });
  </script>
</body>
</html>
