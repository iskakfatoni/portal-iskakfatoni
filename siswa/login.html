<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PORTAL :: Login Siswa</title>
  <link rel="preload" href="../style/style.css" as="style">
  <link rel="stylesheet" href="../style/style.css">
  <!-- Tailwind CSS via CDN -->
  <script defer src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            darkSlate: '#0F172A',
            deepIndigo: '#1E1B4B',
            accentCyan: '#00F5D4'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gradient-to-b from-darkSlate to-deepIndigo text-slate-100 min-h-screen flex items-center justify-center p-4">

  <!-- CONTAINER FORM LOGIN -->
  <div class="max-w-md w-full bg-slate-800/80 backdrop-blur-md rounded-2xl p-6 sm:p-8 border border-slate-700/50 shadow-2xl">
    
    <!-- HEADER BRANDING -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-cyan-500/10 border border-accentCyan/30 mb-3 text-accentCyan shadow-lg shadow-cyan-500/10">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 008 4.07M3 15.364c.64-1.319 1-2.8 1-4.364 0-1.457-.39-2.823-1.07-4" />
        </svg>
      </div>
      <h1 class="text-2xl font-bold tracking-wide text-white">MASUK SISWA</h1>
      <p class="text-xs text-slate-400 mt-1">Masukkan Nomor Induk Siswa (NIS) Anda</p>
    </div>

    <!-- ALERT NOTIFIKASI ERROR -->
    <div id="alert-error" class="hidden mb-5 p-3.5 bg-red-500/10 border border-red-500/40 rounded-xl text-red-400 text-xs flex items-center space-x-2.5">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <span id="error-message">NIS tidak ditemukan. Periksa kembali NIS Anda.</span>
    </div>

    <!-- FORM INPUT LOGIN -->
    <form id="form-login" class="space-y-5">
      <div>
        <label for="nis" class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2">NIS (Nomor Induk Siswa)</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V8a2 2 0 00-2-2h-5m-4 0V5a2 2 0 012-2h2a2 2 0 012 2v1m-6 0h6" />
            </svg>
          </div>
          <input 
            type="number" 
            id="nis" 
            name="nis" 
            placeholder="Contoh: 2026001" 
            required
            autocomplete="off"
            class="w-full pl-11 pr-4 py-3 bg-slate-900/80 border border-slate-700 rounded-xl text-white placeholder-slate-500 text-sm focus:outline-none focus:border-accentCyan focus:ring-1 focus:ring-accentCyan transition duration-200"
          >
        </div>
      </div>

      <!-- TOMBOL SUBMIT -->
      <button 
        type="submit" 
        id="btn-submit"
        class="w-full py-3.5 px-4 bg-gradient-to-r from-teal-400 to-accentCyan text-slate-950 font-bold text-sm rounded-xl hover:opacity-90 active:scale-[0.99] transition duration-200 shadow-lg shadow-cyan-500/20 flex items-center justify-center space-x-2 cursor-pointer"
      >
        <span id="btn-text">Masuk ke Portal</span>
        <div id="btn-spinner" class="hidden w-5 h-5 border-2 border-slate-950 border-t-transparent rounded-full animate-spin"></div>
      </button>
    </form>

    <!-- FOOTER BRANDING -->
    <div class="mt-8 text-center border-t border-slate-700/30 pt-4">
      <p class="text-[11px] text-slate-500 font-mono">Developed by Iskak Fatoni, S.Pd., Gr.</p>
    </div>

  </div>

  <!-- SCRIPT LOGIN LOGIC -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { 
      getFirestore, 
      doc, 
      getDoc, 
      collection, 
      query, 
      where, 
      getDocs 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { firebaseConfig } from "../assets/js/config/firebase-config.js";

    // Inisialisasi Firebase & Firestore
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const formLogin = document.getElementById('form-login');
    const inputNis = document.getElementById('nis');
    const alertError = document.getElementById('alert-error');
    const errorMessage = document.getElementById('error-message');
    const btnSubmit = document.getElementById('btn-submit');
    const btnText = document.getElementById('btn-text');
    const btnSpinner = document.getElementById('btn-spinner');

    // 1. CEK SESI LOKAL SEBELUM FORM DIMUAT
    document.addEventListener('DOMContentLoaded', () => {
      const existingSession = localStorage.getItem('siswa_session');
      if (existingSession) {
        try {
          const dataSiswa = JSON.parse(existingSession);
          if (dataSiswa && dataSiswa.nis) {
            // Jika sesi sudah ada, langsung redirect ke Scanner Siswa
            window.location.href = 'index.html';
          }
        } catch (e) {
          localStorage.removeItem('siswa_session');
        }
      }
    });

    // 2. HELPER UI CONTROLLER
    function setLoading(isLoading) {
      if (isLoading) {
        btnSubmit.disabled = true;
        btnText.innerText = "Memverifikasi...";
        btnSpinner.classList.remove('hidden');
        alertError.classList.add('hidden');
      } else {
        btnSubmit.disabled = false;
        btnText.innerText = "Masuk ke Portal";
        btnSpinner.classList.add('hidden');
      }
    }

    function showError(msg) {
      errorMessage.innerText = msg;
      alertError.classList.remove('hidden');
    }

    // 3. PROSES VERIFIKASI NIS SAAT SUBMIT
    formLogin.addEventListener('submit', async (e) => {
      e.preventDefault();
      const nisInput = inputNis.value.trim();

      if (!nisInput) {
        showError("Silakan masukkan NIS Anda.");
        return;
      }

      setLoading(true);

      try {
        // Metode A: Cek Firestore berdasarkan Document ID (jika ID dokumen adalah NIS)
        const docRef = doc(db, "siswa", nisInput);
        let docSnap = await getDoc(docRef);
        
        let dataSiswa = null;

        if (docSnap.exists()) {
          dataSiswa = docSnap.data();
          dataSiswa.nis = docSnap.id; // Memastikan field NIS terisi
        } else {
          // Metode B: Fallback Query berdasarkan field `nis`
          const q = query(collection(db, "siswa"), where("nis", "==", nisInput));
          const querySnapshot = await getDocs(q);

          if (!querySnapshot.empty) {
            const firstDoc = querySnapshot.docs[0];
            dataSiswa = firstDoc.data();
            dataSiswa.nis = firstDoc.data().nis || firstDoc.id;
          }
        }

        if (dataSiswa) {
          // NIS DITEMUKAN: Simpan profil ke LocalStorage (Persistent Session)
          const sessionPayload = {
            id_siswa: dataSiswa.id_siswa || dataSiswa.nis,
            nis: dataSiswa.nis,
            nama: dataSiswa.nama_siswa || dataSiswa.nama || "Siswa",
            id_kelas: dataSiswa.id_kelas || "-",
            nama_kelas: dataSiswa.nama_kelas || "-",
            logged_at: new Date().toISOString()
          };

          localStorage.setItem('siswa_session', JSON.stringify(sessionPayload));

          // Transisi Pindah Halaman ke Scanner Siswa (index.html)
          btnText.innerText = "Login Berhasil!";
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 500);

        } else {
          // NIS TIDAK DITEMUKAN
          setLoading(false);
          showError(`NIS '${nisInput}' tidak terdaftar di sistem. Hubungi guru pengajar.`);
        }

      } catch (error) {
        console.error("Firestore Auth Error:", error);
        setLoading(false);
        showError("Gagal terhubung ke server. Periksa koneksi internet Anda.");
      }
    });
  </script>
</body>
</html>
