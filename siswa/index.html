<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PORTAL :: Scanner QR Absensi Siswa</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0b0f19;
      color: #ffffff;
      overflow-x: hidden;
    }

    #particle-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
    }

    .glass-card {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Pastikan elemen video tidak meluap & wajib playsinline */
    #reader {
      width: 100% !important;
      height: 100% !important;
      overflow: hidden;
    }
    #reader video {
      object-fit: cover !important;
      border-radius: 1rem;
      width: 100% !important;
      height: 100% !important;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center p-4 relative">

  <!-- BACKGROUND PARTICLE CANVAS -->
  <canvas id="particle-canvas"></canvas>

  <main class="max-w-md w-full my-auto space-y-4 relative z-10">
    
    <!-- HEADER PROFIL SISWA -->
    <header class="glass-card p-4 rounded-2xl flex items-center justify-between shadow-xl">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-cyan-500/15 border border-cyan-500/30 flex items-center justify-center text-cyan-400 font-bold">
          <i class="fa-solid fa-user-check"></i>
        </div>
        <div>
          <h2 id="siswa-nama" class="text-sm font-bold text-white leading-tight">Memuat Siswa...</h2>
          <p id="siswa-nis-kelas" class="text-[11px] text-slate-400 font-mono">-</p>
        </div>
      </div>

      <button id="btn-kembali" class="py-2 px-3 bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold text-xs rounded-xl transition border border-slate-700 flex items-center gap-1.5 cursor-pointer">
        <i class="fa-solid fa-arrow-left"></i> <span>Kembali</span>
      </button>
    </header>

    <!-- CONTAINER SCANNER KAMERA -->
    <div class="glass-card p-5 rounded-2xl shadow-xl space-y-4 text-center">
      
      <div class="flex items-center justify-between border-b border-slate-800 pb-2.5">
        <span class="text-xs font-bold text-cyan-400 flex items-center gap-2 uppercase tracking-wider">
          <i class="fa-solid fa-camera"></i> Scan QR Absensi Guru
        </span>
        <span id="scan-status-badge" class="px-2.5 py-0.5 rounded-full text-[10px] font-bold font-mono bg-cyan-500/15 text-cyan-400 border border-cyan-500/30">
          Mengarahkan Kamera...
        </span>
      </div>

      <!-- VIEWPORT KAMERA MAKSIMAL -->
      <div class="relative w-full aspect-square bg-slate-950 rounded-2xl overflow-hidden border-2 border-dashed border-cyan-500/40 flex items-center justify-center shadow-inner">
        
        <div id="reader"></div>

        <!-- OVERLAY TARGET CORNER -->
        <div class="absolute inset-0 pointer-events-none border-[30px] border-slate-950/60 flex items-center justify-center">
          <div class="w-full h-full border-2 border-cyan-400/80 rounded-xl relative animate-pulse"></div>
        </div>

        <div id="camera-loading" class="absolute inset-0 bg-slate-950 flex flex-col items-center justify-center gap-2 z-20">
          <i class="fa-solid fa-circle-notch fa-spin text-3xl text-cyan-400"></i>
          <p class="text-xs text-slate-400 font-mono">Menyiapkan Lensa Kamera HP...</p>
        </div>
      </div>

      <!-- TOMBOL MANUAL RESTART KAMERA JIKA DIBUTUHKAN -->
      <button id="btn-restart-cam" class="w-full py-2.5 bg-slate-800 hover:bg-slate-700 text-cyan-400 font-bold text-xs rounded-xl transition border border-slate-700 hidden flex items-center justify-center gap-2 cursor-pointer">
        <i class="fa-solid fa-arrows-rotate"></i> Muat Ulang Kamera HP
      </button>

      <p class="text-xs text-slate-400 font-mono">Arahkan kamera ke QR Code di layar Ponsel/Laptop Guru</p>

      <!-- PESAN NOTIFIKASI HASIL SCAN -->
      <div id="notif-box" class="hidden p-3.5 rounded-xl text-xs font-semibold text-center font-mono"></div>

    </div>

    <!-- FOOTER -->
    <div class="text-center pt-2">
      <p class="text-[11px] text-slate-500 font-mono">Developed by Iskak Fatoni, S.Pd., Gr.</p>
    </div>

  </main>

  <!-- PARTICLE CANVAS ANIMATION -->
  <script>
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function initCanvas() {
      canvas.width = document.documentElement.clientWidth || window.innerWidth;
      canvas.height = window.innerHeight;
      particles = [];
      for (let i = 0; i < 35; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          radius: Math.random() * 2 + 1,
          speedY: Math.random() * -0.5 - 0.2,
          speedX: (Math.random() - 0.5) * 0.3,
          opacity: Math.random() * 0.6 + 0.3
        });
      }
    }

    function drawParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const isDarkMode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const particleColor = isDarkMode ? "0, 245, 212" : "139, 92, 246";

      particles.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${particleColor}, ${p.opacity})`;
        ctx.shadowBlur = 6;
        ctx.shadowColor = `rgb(${particleColor})`;
        ctx.fill();

        p.y += p.speedY; p.x += p.speedX;
        if (p.y < 0) { p.y = canvas.height; p.x = Math.random() * canvas.width; }
      });
      requestAnimationFrame(drawParticles);
    }

    window.addEventListener('resize', initCanvas);
    initCanvas();
    drawParticles();
  </script>

  <!-- FIREBASE SCRIPT & STABLE CAMERA CONTROLLER -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, addDoc, query, where, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDhq4QoCn00GkfpKXSP8PnvSvEKa2yn0ic",
      authDomain: "portal-iskakfatoni.firebaseapp.com",
      projectId: "portal-iskakfatoni",
      storageBucket: "portal-iskakfatoni.firebasestorage.app",
      messagingSenderId: "367350728822",
      appId: "1:367350728822:web:6b0c6fd4824102d8acf757",
      measurementId: "G-0BNNKQQ24V"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const siswaNama = document.getElementById('siswa-nama');
    const siswaNisKelas = document.getElementById('siswa-nis-kelas');
    const btnKembali = document.getElementById('btn-kembali');
    const btnRestartCam = document.getElementById('btn-restart-cam');
    const cameraLoading = document.getElementById('camera-loading');
    const notifBox = document.getElementById('notif-box');
    const scanStatusBadge = document.getElementById('scan-status-badge');

    let html5QrCode = null;
    let isProcessingScan = false;
    let currentSiswaUser = null;

    // CEK SESI USER SISWA
    const savedUserJson = localStorage.getItem('portal_siswa_user');
    if (!savedUserJson) {
      window.location.href = "../absensi.html";
    } else {
      currentSiswaUser = JSON.parse(savedUserJson);
      siswaNama.innerText = currentSiswaUser.nama_siswa || "Siswa";
      siswaNisKelas.innerText = `NIS: ${currentSiswaUser.nis} | ${currentSiswaUser.nama_kelas || currentSiswaUser.id_kelas}`;
      
      // Berikan jeda 600ms agar DOM elemen selesaikan rendering sepenuhnya
      setTimeout(() => {
        initCameraStable();
      }, 600);
    }

    btnKembali.addEventListener('click', async () => {
      await stopCameraSafely();
      window.location.href = "../absensi.html";
    });

    btnRestartCam.addEventListener('click', () => {
      btnRestartCam.classList.add('hidden');
      cameraLoading.classList.remove('hidden');
      initCameraStable();
    });

    // METODE PERBAIKAN: INISIALISASI SPESIFIK DEVICE KAMERA
    async function initCameraStable() {
      try {
        await stopCameraSafely();

        html5QrCode = new Html5Qrcode("reader");

        // Dapatkan daftar kamera fisik yang tersedia di HP
        const devices = await Html5Qrcode.getCameras();

        if (!devices || devices.length === 0) {
          throw new Error("Kamera tidak ditemukan pada perangkat ini.");
        }

        // Cari kamera belakang (back / environment / rear)
        let backCamera = devices.find(d => 
          d.label.toLowerCase().includes('back') || 
          d.label.toLowerCase().includes('rear') || 
          d.label.toLowerCase().includes('environment') ||
          d.label.toLowerCase().includes('belakang')
        );

        // Jika tidak ketemu kata kunci 'back', gunakan kamera terakhir di array
        let targetCameraId = backCamera ? backCamera.id : devices[devices.length - 1].id;

        const config = {
          fps: 10,
          qrbox: { width: 220, height: 220 }
        };

        // Jalankan kamera dengan Device ID yang pasti
        await html5QrCode.start(
          targetCameraId,
          config,
          onScanSuccess,
          onScanError
        );

        // Paksa Atribut playsinline pada video tag agar iOS/Android Chrome tidak auto-close
        const videoElement = document.querySelector("#reader video");
        if (videoElement) {
          videoElement.setAttribute("playsinline", "true");
          videoElement.setAttribute("webkit-playsinline", "true");
        }

        cameraLoading.classList.add('hidden');
        scanStatusBadge.innerText = "Siap Scan";
        scanStatusBadge.className = "px-2.5 py-0.5 rounded-full text-[10px] font-bold font-mono bg-emerald-500/15 text-emerald-400 border border-emerald-500/30";

      } catch (err) {
        console.error("Gagal kamera direct ID, mencoba mode fallback:", err);
        try {
          // Fallback kedua menggunakan facingMode string murni
          await html5QrCode.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: { width: 220, height: 220 } },
            onScanSuccess,
            onScanError
          );

          const videoElement = document.querySelector("#reader video");
          if (videoElement) videoElement.setAttribute("playsinline", "true");

          cameraLoading.classList.add('hidden');
          scanStatusBadge.innerText = "Siap Scan";
          scanStatusBadge.className = "px-2.5 py-0.5 rounded-full text-[10px] font-bold font-mono bg-emerald-500/15 text-emerald-400 border border-emerald-500/30";
        } catch (fallbackErr) {
          cameraLoading.classList.add('hidden');
          btnRestartCam.classList.remove('hidden');
          showNotif("❌ Akses Kamera Ditolak / Bermasalah. Pastikan izin kamera pada browser sudah 'Izinkan' (Allow).", "error");
        }
      }
    }

    async function stopCameraSafely() {
      if (html5QrCode) {
        try {
          if (html5QrCode.isScanning) {
            await html5QrCode.stop();
          }
          await html5QrCode.clear();
        } catch (e) {
          console.log("Status stop camera:", e);
        }
      }
    }

    function onScanError(error) {
      // Abaikan error per-frame
    }

    async function onScanSuccess(decodedText) {
      if (isProcessingScan) return;
      isProcessingScan = true;

      scanStatusBadge.innerText = "Memproses...";
      scanStatusBadge.className = "px-2.5 py-0.5 rounded-full text-[10px] font-bold font-mono bg-amber-500/15 text-amber-400 border border-amber-500/30";

      const scannedToken = decodedText.trim();

      try {
        // 1. CARI SESI ABSENSI AKTIF BERDASARKAN TOKEN QR
        const qSesi = query(
          collection(db, "sesi_absensi"),
          where("current_qr_token", "==", scannedToken),
          where("is_active", "==", true)
        );

        const sesiSnap = await getDocs(qSesi);

        if (sesiSnap.empty) {
          showNotif("❌ QR Code tidak valid / Sesi absensi telah dikadaluarsakan!", "error");
          resetProcessingLock(3000);
          return;
        }

        const activeSesiDoc = sesiSnap.docs[0];
        const sesiData = activeSesiDoc.data();
        const idSesi = activeSesiDoc.id;

        // 2. CEK APABILA SISWA SUDAH PRESENSI
        const qLog = query(
          collection(db, "log_absensi"),
          where("id_sesi", "==", idSesi),
          where("nis", "==", currentSiswaUser.nis)
        );

        const logSnap = await getDocs(qLog);

        if (!logSnap.empty) {
          showNotif(`⚠️ ${currentSiswaUser.nama_siswa}, Anda sudah presensi sebelumnya!`, "warn");
          resetProcessingLock(3000);
          return;
        }

        // 3. SIMPAN PRESENSI KE FIRESTORE LOG_ABSENSI
        const now = new Date();
        const waktuScanStr = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

        await addDoc(collection(db, "log_absensi"), {
          id_sesi: idSesi,
          id_kelas: sesiData.id_kelas,
          nama_mapel: sesiData.nama_mapel,
          nis: currentSiswaUser.nis,
          nama_siswa: currentSiswaUser.nama_siswa,
          device_id: currentSiswaUser.device_id || 'UNKNOWN',
          status: 'Hadir',
          waktu_scan: waktuScanStr,
          created_at: serverTimestamp()
        });

        // Hentikan kamera setelah presensi berhasil
        await stopCameraSafely();

        showNotif(`🎉 ABSENSI BERHASIL!\n${currentSiswaUser.nama_siswa}\n[${sesiData.id_kelas} - ${sesiData.nama_mapel}]`, "success");

        scanStatusBadge.innerText = "Sukses";
        scanStatusBadge.className = "px-2.5 py-0.5 rounded-full text-[10px] font-bold font-mono bg-emerald-500/15 text-emerald-400 border border-emerald-500/30";

        setTimeout(() => {
          window.location.href = "../absensi.html";
        }, 3000);

      } catch (err) {
        console.error(err);
        showNotif("❌ Gagal menyimpan presensi: " + err.message, "error");
        resetProcessingLock(3000);
      }
    }

    function resetProcessingLock(delayMs) {
      setTimeout(() => {
        isProcessingScan = false;
        scanStatusBadge.innerText = "Siap Scan";
        scanStatusBadge.className = "px-2.5 py-0.5 rounded-full text-[10px] font-bold font-mono bg-cyan-500/15 text-cyan-400 border border-cyan-500/30";
      }, delayMs);
    }

    function showNotif(msg, type) {
      notifBox.innerText = msg;
      notifBox.classList.remove('hidden');

      if (type === 'success') {
        notifBox.className = "p-3.5 rounded-xl text-xs font-semibold text-center font-mono bg-emerald-500/15 text-emerald-300 border border-emerald-500/30 whitespace-pre-line";
      } else if (type === 'warn') {
        notifBox.className = "p-3.5 rounded-xl text-xs font-semibold text-center font-mono bg-amber-500/15 text-amber-300 border border-amber-500/30 whitespace-pre-line";
      } else {
        notifBox.className = "p-3.5 rounded-xl text-xs font-semibold text-center font-mono bg-red-500/15 text-red-300 border border-red-500/30 whitespace-pre-line";
      }
    }
  </script>
</body>
</html>
