<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PORTAL :: Scanner QR Absensi Siswa</title>
  <link rel="preload" href="../style/style.css" as="style">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="../style/style.css">
  <script defer src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script defer src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="theme-dashboard min-h-screen flex flex-col justify-between items-center p-4 relative">

  <canvas id="particle-canvas"></canvas>

  <main class="max-w-md w-full my-auto space-y-4 relative z-10">
    
    <header class="glass-card p-4 rounded-2xl flex items-center justify-between shadow-xl">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-cyan-500/15 border border-cyan-500/30 flex items-center justify-center text-cyan-400 font-bold">
          <i class="fa-solid fa-user-check"></i>
        </div>
        <div>
          <h2 id="siswa-nama" class="text-sm font-bold text-white leading-tight">Memuat Siswa...</h2>
          <p id="siswa-nis-kelas" class="text-[11px] text-slate-400 font-mono">-</p>
        </div>
      </div>

      <button id="btn-kembali" class="py-2 px-3 bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold text-xs rounded-xl transition border border-slate-700 flex items-center gap-1.5 cursor-pointer">
        <i class="fa-solid fa-right-from-bracket"></i> <span>Keluar</span>
      </button>
    </header>

    <div class="glass-card p-5 rounded-2xl shadow-xl space-y-4 text-center">
      
      <div class="flex items-center justify-between border-b border-slate-800 pb-2.5">
        <span class="text-xs font-bold text-cyan-400 flex items-center gap-2 uppercase tracking-wider">
          <i class="fa-solid fa-camera"></i> Scan QR Absensi Guru
        </span>
        <span id="scan-status-badge" class="px-2.5 py-0.5 rounded-full text-[10px] font-bold font-mono bg-cyan-500/15 text-cyan-400 border border-cyan-500/30">
          Siap
        </span>
      </div>

      <div class="relative w-full aspect-square bg-slate-950 rounded-2xl overflow-hidden border-2 border-dashed border-cyan-500/40 flex items-center justify-center shadow-inner">
        
        <div id="reader"></div>

        <div class="absolute inset-0 pointer-events-none border-[30px] border-slate-950/60 flex items-center justify-center">
          <div class="w-full h-full border-2 border-cyan-400/80 rounded-xl relative animate-pulse"></div>
        </div>

        <div id="camera-loading" class="absolute inset-0 bg-slate-950 flex flex-col items-center justify-center gap-2 z-20">
          <i class="fa-solid fa-circle-notch fa-spin text-3xl text-cyan-400"></i>
          <p class="text-xs text-slate-400 font-mono">Membuka Kamera HP...</p>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-2 pt-1">
        <button id="btn-switch-camera" class="py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-xs rounded-xl transition border border-slate-700 flex items-center justify-center gap-2 cursor-pointer">
          <i class="fa-solid fa-camera-rotate"></i> Putar Kamera
        </button>
        <button id="btn-restart-cam" class="py-2.5 bg-slate-800 hover:bg-slate-700 text-cyan-400 font-bold text-xs rounded-xl transition border border-slate-700 flex items-center justify-center gap-2 cursor-pointer">
          <i class="fa-solid fa-arrows-rotate"></i> Reset Kamera
        </button>
      </div>

      <p class="text-xs text-slate-400 font-mono">Arahkan kamera ke QR Code di layar Ponsel/Laptop Guru</p>

      <div id="notif-box" class="hidden p-3.5 rounded-xl text-xs font-semibold text-center font-mono"></div>

    </div>

    <div class="text-center pt-2">
      <p class="text-[11px] text-slate-500 font-mono">Developed by Iskak Fatoni, S.Pd., Gr.</p>
    </div>

  </main>

  <script src="../assets/js/particle/particle-bg.js"></script>

  <script type="module">
    import { firebaseConfig } from "../assets/js/config/firebase-config.js";
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, addDoc, query, where, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const siswaNama = document.getElementById('siswa-nama');
    const siswaNisKelas = document.getElementById('siswa-nis-kelas');
    const btnKembali = document.getElementById('btn-kembali');
    const btnSwitchCamera = document.getElementById('btn-switch-camera');
    const btnRestartCam = document.getElementById('btn-restart-cam');
    const cameraLoading = document.getElementById('camera-loading');
    const notifBox = document.getElementById('notif-box');
    const scanStatusBadge = document.getElementById('scan-status-badge');

    let html5QrCode = null;
    let isProcessingScan = false;
    let currentSiswaUser = null;
    let currentFacingMode = "environment";
    let isSessionInitialized = false;
    let isStartingCamera = false;

    // AMBIL DARI LOCAL STORAGE PERSISTEN LOKAL
    function initSiswaSession() {
      if (isSessionInitialized) return;
      isSessionInitialized = true;
      const savedUserJson = localStorage.getItem('siswa_session') || localStorage.getItem('portal_siswa_user');
      
      if (!savedUserJson) {
        window.location.href = "login.html";
        return;
      }

      try {
        currentSiswaUser = JSON.parse(savedUserJson);
        if (!currentSiswaUser || !currentSiswaUser.nis) {
          throw new Error("Invalid session payload");
        }

        const namaSiswa = currentSiswaUser.nama_siswa || currentSiswaUser.nama || "Siswa";
        const kelasSiswa = currentSiswaUser.nama_kelas || currentSiswaUser.id_kelas || "-";
        
        siswaNama.innerText = namaSiswa;
        siswaNisKelas.innerText = `NIS: ${currentSiswaUser.nis} | ${kelasSiswa}`;
        
        // PEMBERIAN TIMEOUT UNTUK MENCEGAH CAM LOCK / STUCK DI WEBVIEW
        setTimeout(() => {
          startCameraEngine();
        }, 300);

      } catch (e) {
        console.error("Session Error:", e);
        localStorage.removeItem('siswa_session');
        localStorage.removeItem('portal_siswa_user');
        window.location.href = "login.html";
      }
    }

    btnKembali.addEventListener('click', async () => {
      if (confirm("Apakah Anda yakin ingin keluar dari sesi siswa ini?")) {
        await hardReleaseCamera();
        localStorage.removeItem('siswa_session');
        localStorage.removeItem('portal_siswa_user');
        window.location.href = "login.html";
      }
    });

    btnRestartCam.addEventListener('click', () => {
      cameraLoading.classList.remove('hidden');
      startCameraEngine();
    });

    btnSwitchCamera.addEventListener('click', () => {
      currentFacingMode = currentFacingMode === "environment" ? "user" : "environment";
      cameraLoading.classList.remove('hidden');
      startCameraEngine();
    });

    async function hardReleaseCamera() {
      if (html5QrCode) {
        try {
          if (html5QrCode.isScanning) {
            await html5QrCode.stop();
          }
          await html5QrCode.clear();
        } catch (e) {
          console.log("Cleanup scanner:", e);
        }
      }

      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ video: true });
          if (stream) {
            stream.getTracks().forEach(track => track.stop());
          }
        } catch (e) {}
      }
    }

    async function startCameraEngine() {
      if (isStartingCamera) return;
      isStartingCamera = true;
      try {
        await hardReleaseCamera();

        html5QrCode = new Html5Qrcode("reader");

        const config = {
          fps: 10,
          qrbox: { width: 220, height: 220 }
        };

        await html5QrCode.start(
          { facingMode: currentFacingMode },
          config,
          onScanSuccess,
          onScanError
        );

        const videoElement = document.querySelector("#reader video");
        if (videoElement) {
          videoElement.setAttribute("playsinline", "true");
          videoElement.setAttribute("webkit-playsinline", "true");
        }

        cameraLoading.classList.add('hidden');
        scanStatusBadge.innerText = "Siap Scan";
        scanStatusBadge.className = "px-2.5 py-0.5 rounded-full text-[10px] font-bold font-mono bg-emerald-500/15 text-emerald-400 border border-emerald-500/30";

      } catch (err) {
        console.error("Gagal membuka kamera:", err);
        cameraLoading.classList.add('hidden');
        showNotif("❌ Gagal Membuka Kamera! Pastikan Izin Kamera Diberikan di Browser HP.", "error");
      } finally {
        isStartingCamera = false;
      }
    }

    function onScanError(error) {}

    async function onScanSuccess(decodedText) {
      if (isProcessingScan) return;
      isProcessingScan = true;

      scanStatusBadge.innerText = "Memproses...";
      scanStatusBadge.className = "px-2.5 py-0.5 rounded-full text-[10px] font-bold font-mono bg-amber-500/15 text-amber-400 border border-amber-500/30";

      const scannedToken = decodedText.trim();

      try {
        const qSesi = query(
          collection(db, "sesi_absensi"),
          where("current_qr_token", "==", scannedToken),
          where("is_active", "==", true)
        );

        const sesiSnap = await getDocs(qSesi);

        if (sesiSnap.empty) {
          showNotif("❌ QR Code tidak valid / Sesi absensi telah dikadaluarsakan!", "error");
          resetProcessingLock(3000);
          return;
        }

        const activeSesiDoc = sesiSnap.docs[0];
        const sesiData = activeSesiDoc.data();
        const idSesi = activeSesiDoc.id;

        const namaSiswaVal = currentSiswaUser.nama_siswa || currentSiswaUser.nama || "Siswa";

        const qLog = query(
          collection(db, "log_absensi"),
          where("id_sesi", "==", idSesi),
          where("nis", "==", currentSiswaUser.nis)
        );

        const logSnap = await getDocs(qLog);

        if (!logSnap.empty) {
          showNotif(`⚠️ ${namaSiswaVal}, Anda sudah presensi sebelumnya!`, "warn");
          resetProcessingLock(3000);
          return;
        }

        const now = new Date();
        const hariStr = now.toLocaleDateString('id-ID', { weekday: 'long' });
        const tanggalStr = now.toLocaleDateString('id-ID', { year: 'numeric', month: '2-digit', day: '2-digit' }).split('/').reverse().join('-');
        const waktuScanStr = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' }) + ' WIB';

        const currentDeviceId = currentSiswaUser.device_id || localStorage.getItem('portal_device_id') || '';

        await addDoc(collection(db, "log_absensi"), {
          id_sesi: idSesi,
          id_kelas: sesiData.id_kelas,
          nama_mapel: sesiData.nama_mapel,
          nis: currentSiswaUser.nis,
          nama_siswa: namaSiswaVal,
          hari: hariStr,
          tanggal: tanggalStr,
          waktu: waktuScanStr,
          status: 'Hadir',
          device_id: currentDeviceId,
          created_at: serverTimestamp()
        });

        await hardReleaseCamera();

        showNotif(`🎉 ABSENSI BERHASIL!\n${namaSiswaVal}\n[${sesiData.id_kelas} - ${sesiData.nama_mapel}]`, "success");

        scanStatusBadge.innerText = "Sukses";
        scanStatusBadge.className = "px-2.5 py-0.5 rounded-full text-[10px] font-bold font-mono bg-emerald-500/15 text-emerald-400 border border-emerald-500/30";

        setTimeout(() => {
          resetProcessingLock(1000);
          startCameraEngine();
        }, 3500);

      } catch (err) {
        console.error(err);
        showNotif("❌ Gagal menyimpan presensi: " + err.message, "error");
        resetProcessingLock(3000);
      }
    }

    function resetProcessingLock(delayMs) {
      setTimeout(() => {
        isProcessingScan = false;
        notifBox.classList.add('hidden');
        scanStatusBadge.innerText = "Siap Scan";
        scanStatusBadge.className = "px-2.5 py-0.5 rounded-full text-[10px] font-bold font-mono bg-cyan-500/15 text-cyan-400 border border-cyan-500/30";
      }, delayMs);
    }

    function showNotif(msg, type) {
      notifBox.innerText = msg;
      notifBox.classList.remove('hidden');

      if (type === 'success') {
        notifBox.className = "p-3.5 rounded-xl text-xs font-semibold text-center font-mono bg-emerald-500/15 text-emerald-300 border border-emerald-500/30 whitespace-pre-line";
      } else if (type === 'warn') {
        notifBox.className = "p-3.5 rounded-xl text-xs font-semibold text-center font-mono bg-amber-500/15 text-amber-300 border border-amber-500/30 whitespace-pre-line";
      } else {
        notifBox.className = "p-3.5 rounded-xl text-xs font-semibold text-center font-mono bg-red-500/15 text-red-300 border border-red-500/30 whitespace-pre-line";
      }
    }

    // Jalankan inisialisasi sesi saat DOM siap
    document.addEventListener('DOMContentLoaded', initSiswaSession);
    // Jalankan fallback jika event DOMContentLoaded sudah lewat saat script di-load
    if (document.readyState === 'interactive' || document.readyState === 'complete') {
      initSiswaSession();
    }
  </script>
</body>
</html>
