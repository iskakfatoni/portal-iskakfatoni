  <link rel="stylesheet" href="style/style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">

      display: inline-block;

<body class="theme-glass">

  <!-- PARTICLE CANVAS -->
  <canvas id="particle-canvas"></canvas>

  <main class="container">
    
    <!-- Profil Header -->
    <header class="profile">
      <div class="avatar-ring">
        <img src="foto_asn_profile.png" alt="Muchamad Iskak Fatoni" class="avatar">
      </div>

    </header>

    <!-- SECTION KONTEN PORTAL UTAMA -->
    <section class="dark-panel dark-panel--compact">
      
      <!-- UCAPAN SALAM SISWA TERIKAT -->
      <div id="greeting-wrapper" class="greeting-badge hidden">
        <div class="greeting-text">
          <i class="fa-solid fa-hand-wave icon-accent"></i>

        <span id="greeting-student-class" class="greeting-kelas">-</span>
      </div>

      <!-- RUNNING TEXT PENGUMUMAN (WARNA MERAH, INSTAN ZERO-DELAY) -->

      <!-- KONDISI A: PORTAL MAINTENANCE (OFF) -->
      <div id="maintenance-view" class="maintenance-box hidden">
        <i class="fa-solid fa-screwdriver-wrench maintenance-icon"></i>
        <h2 class="maintenance-title">PORTAL TUTUP!!</h2>
        <p class="maintenance-desc">Belum ada tugas atau info terbaru.</p>
      </div>

      <!-- KONDISI B: LIST LINK PORTAL AKTIF (ON) -->
      <div id="portal-content-view">
        <div class="section-header-row">
          <h2 class="section-header-title">
            <i class="fa-solid fa-graduation-cap icon-accent section-header-title-icon"></i> Daftar Link:

    <!-- Footer -->
    <footer class="footer">

        <a href="https://wa.me/085645453111" target="_blank" rel="noopener noreferrer" class="social-btn wa"><i class="fa-brands fa-whatsapp"></i></a>
        <a href="https://facebook.com/iskakfatoni" target="_blank" rel="noopener noreferrer" class="social-btn fb"><i class="fa-brands fa-facebook-f"></i></a>
        <a href="https://instagram.com/iskakfatoni" target="_blank" rel="noopener noreferrer" class="social-btn ig"><i class="fa-brands fa-instagram"></i></a>
        <a href="https://youtube.com/iskakfatoni" target="_blank" rel="noopener noreferrer" class="social-btn yt"><i class="fa-brands fa-youtube"></i></a>
        <a href="https://tiktok.com/@iskakfatoni" target="_blank" rel="noopener noreferrer" class="social-btn tt"><i class="fa-brands fa-tiktok"></i></a>
      </div>

      <div class="supported-by">
        <img src="nisnas_logo_colorful.png" alt="Logo NisNas Computer" class="supporter-logo">
        <p>Supported by <span>NisNas Computer</span></p>
      </div>
    </footer>

  </main>

  <!-- PARTICLE CANVAS -->
  <script>
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function initCanvas() {
      canvas.width = document.documentElement.clientWidth || window.innerWidth;
      canvas.height = window.innerHeight;
      particles = [];
      for (let i = 0; i < 35; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          radius: Math.random() * 2 + 1,
          speedY: Math.random() * -0.5 - 0.2,
          speedX: (Math.random() - 0.5) * 0.3,
          opacity: Math.random() * 0.6 + 0.3
        });
      }
    }

    function drawParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const isDarkMode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const particleColor = isDarkMode ? "0, 245, 212" : "139, 92, 246";

      particles.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${particleColor}, ${p.opacity})`;
        ctx.shadowBlur = 6;
        ctx.shadowColor = `rgb(${particleColor})`;
        ctx.fill();

        p.y += p.speedY; p.x += p.speedX;
        if (p.y < 0) { p.y = canvas.height; p.x = Math.random() * canvas.width; }
      });
      requestAnimationFrame(drawParticles);
    }

    window.addEventListener('resize', initCanvas);
    initCanvas();
    drawParticles();
  </script>

  <!-- FIREBASE LOGIC & HARDWARE DEVICE CHECK FOR GREETING -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, doc, onSnapshot, query, where, getDocs, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { firebaseConfig } from "./assets/js/config/firebase-config.js";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const marqueeWrapper = document.getElementById('marquee-wrapper');
    const runningTextContent = document.getElementById('running-text-content');
    const maintenanceView = document.getElementById('maintenance-view');
    const portalContentView = document.getElementById('portal-content-view');
    const publicLinksContainer = document.getElementById('public-links-container');
    const linkTotalBadge = document.getElementById('link-total-badge');

    const greetingWrapper = document.getElementById('greeting-wrapper');
    const greetingStudentName = document.getElementById('greeting-student-name');
    const greetingStudentClass = document.getElementById('greeting-student-class');

    // FUNGSI HARDWARE FINGERPRINT KONSISTEN
    async function getHardwareFingerprint() {
      const gl = document.createElement('canvas').getContext('webgl');
      let gpuVendor = '';
      if (gl) {
        const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
        if (debugInfo) {
          gpuVendor = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) || '';
        }
      }

      const rawString = [
        navigator.userAgent,
        screen.width + 'x' + screen.height,
        screen.colorDepth,
        navigator.hardwareConcurrency || 2,
        gpuVendor,
        Intl.DateTimeFormat().resolvedOptions().timeZone
      ].join('||');

      const msgBuffer = new TextEncoder().encode(rawString);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
      
      return 'HW-' + hashHex.substring(0, 16).toUpperCase();
    }

    // MEMERIKSA STATUS IKATAN DEVICE UNTUK TAMPILKAN "Hai, [Nama]"
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const currentDeviceId = await getHardwareFingerprint();
        
        // Cek data di LocalStorage terlebih dahulu
        const savedUserJson = localStorage.getItem('portal_siswa_user');
        if (savedUserJson) {
          const user = JSON.parse(savedUserJson);
          if (user && user.nama_siswa) {
            showStudentGreeting(user.nama_siswa, user.nama_kelas || user.id_kelas);
            return;
          }
        }

        // Jika LocalStorage kosong, verifikasi langsung ke Firestore via device_id
        const qDevice = query(collection(db, "siswa"), where("device_id", "==", currentDeviceId));
        const deviceSnap = await getDocs(qDevice);

        if (!deviceSnap.empty) {
          const studentData = deviceSnap.docs[0].data();
          showStudentGreeting(studentData.nama_siswa, studentData.nama_kelas || studentData.id_kelas);
        }
      } catch (err) {
        console.error("Gagal memuat salam siswa:", err);
      }
    });

    function showStudentGreeting(name, kelas) {
      if (!name) return;
      greetingStudentName.innerText = name;
      greetingStudentClass.innerText = kelas || 'TEI';
      greetingWrapper.classList.remove('hidden');
    }

    // FUNGSI UNTUK MENENTUKAN IKON DAN WARNA BACKGROUNDNYA (CLASS)
    function getLinkIconConfig(data) {
      // Prioritaskan ikon yang disimpan di database
      let dbIcon = data.icon || "fa-solid fa-link";
      
      // Kembalikan objek dengan ikon dari database dan warna latar (class) 
      // yang disesuaikan dengan jenis ikonnya.
      if (dbIcon.includes('fa-file-pen')) return { icon: dbIcon, cls: 'link-type-form' };
      if (dbIcon.includes('fa-palette')) return { icon: dbIcon, cls: 'link-type-canva' };
      if (dbIcon.includes('fa-file-pdf')) return { icon: dbIcon, cls: 'link-type-drive' };
      if (dbIcon.includes('fa-youtube')) return { icon: dbIcon, cls: 'link-type-youtube' };
      if (dbIcon.includes('fa-gamepad')) return { icon: dbIcon, cls: 'link-type-quiz' };
      if (dbIcon.includes('fa-whatsapp')) return { icon: dbIcon, cls: 'link-type-whatsapp' };
      if (dbIcon.includes('fa-github')) return { icon: dbIcon, cls: 'link-type-github' };
      if (dbIcon.includes('fa-google-drive')) return { icon: dbIcon, cls: 'link-type-drive' }; // Google Drive
      if (dbIcon.includes('fa-file-lines')) return { icon: dbIcon, cls: 'link-type-form' }; // Google Docs
      if (dbIcon.includes('fa-table-cells')) return { icon: dbIcon, cls: 'link-type-canva' }; // Google Sheets (Pakai warna canva sebagai fallback)
      if (dbIcon.includes('fa-file-signature')) return { icon: dbIcon, cls: 'link-type-form' }; // Google Forms

      // Jika ikon di database adalah default atau tidak dikenali, coba tebak dari title/url
      const t = (data.title || "").toLowerCase();
      const u = (data.url || "").toLowerCase();

      if (u.includes('forms.google.com') || u.includes('forms.gle') || u.includes('/forms/') || t.includes('form') || t.includes('tugas') || t.includes('upload')) {
        return { icon: 'fa-solid fa-file-pen', cls: 'link-type-form' };
      }

      if (u.includes('canva.com') || u.includes('canva.link') || t.includes('canva')) {
        return { icon: 'fa-solid fa-palette', cls: 'link-type-canva' };
      }

      if (u.includes('drive.google.com') || u.includes('docs.google.com') || t.includes('drive') || t.includes('modul') || t.includes('pdf')) {
        return { icon: 'fa-solid fa-file-pdf', cls: 'link-type-drive' };
      }

      if (u.includes('youtube.com') || u.includes('youtu.be') || t.includes('video') || t.includes('youtube')) {
        return { icon: 'fa-brands fa-youtube', cls: 'link-type-youtube' };
      }

      if (u.includes('quizizz.com') || t.includes('quiz') || t.includes('ujian')) {
        return { icon: 'fa-solid fa-gamepad', cls: 'link-type-quiz' };
      }

      if (u.includes('wa.me') || u.includes('whatsapp.com') || t.includes('wa') || t.includes('grup')) {
        return { icon: 'fa-brands fa-whatsapp', cls: 'link-type-whatsapp' };
      }

      if (u.includes('github.com') || t.includes('github') || t.includes('koding') || t.includes('code')) {
        return { icon: 'fa-brands fa-github', cls: 'link-type-github' };
      }

      return { icon: dbIcon, cls: 'link-type-default' };
    }

    // 1. LISTEN REALTIME STATUS PORTAL ON / OFF
    onSnapshot(doc(db, "settings", "portal_status"), (docSnap) => {
      let isOnline = true;

      if (docSnap.exists()) {
        const data = docSnap.data();
        isOnline = data.is_online !== false;
      }

      if (isOnline) {
        maintenanceView.classList.add('hidden');
        portalContentView.classList.remove('hidden');
      } else {
        maintenanceView.classList.remove('hidden');
        portalContentView.classList.add('hidden');
      }
    });

    // 2. LISTEN REALTIME RUNNING TEXT
    onSnapshot(doc(db, "settings", "announcement"), (docSnap) => {
      if (docSnap.exists()) {
        const data = docSnap.data();
        const textVal = data.text || data.announcement || data.content || "";

        if (textVal && textVal.trim() !== "") {
          runningTextContent.innerText = textVal;
          marqueeWrapper.classList.remove('hidden');
          return;
        }
      }
      marqueeWrapper.classList.add('hidden');
    });

    // 3. LISTEN REALTIME DAFTAR LINK TERURUT (FILTER HANYA YANG AKTIF)
    const qLinks = query(collection(db, "links"), orderBy("order", "asc"));

    onSnapshot(qLinks, (snapshot) => {
      publicLinksContainer.innerHTML = '';

      let activeCount = 0;

      snapshot.forEach((docSnap) => {
        const data = docSnap.data();

        if (data.is_active === false) return;

        activeCount++;
        // Sekarang kirim seluruh objek 'data' ke fungsi getLinkIconConfig
        const iconConfig = getLinkIconConfig(data);

        const a = document.createElement('a');
        a.href = data.url;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.className = "link-card-item";

        a.innerHTML = `
          <div class="link-info">
            <div class="link-icon-box ${iconConfig.cls}">
              <i class="${iconConfig.icon}"></i>
            </div>
            <div class="link-text">
              <h3><span class="link-number">${activeCount}.</span>${data.title}</h3>
            </div>
          </div>
          <i class="fa-solid fa-arrow-up-right-from-square arrow-icon"></i>
        `;

        publicLinksContainer.appendChild(a);
      });

      linkTotalBadge.innerText = `${activeCount} Link`;

      if (activeCount === 0) {
        publicLinksContainer.innerHTML = '<p class="muted-note">// Belum ada tautan aktif yang dibagikan.</p>';
      }
    });
  </script>
  <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js')
        .then((reg) => console.log('Service Worker registered successfully:', reg.scope))
        .catch((err) => console.error('Service Worker registration failed:', err));
    });
  }
  </script>
</body>
