  <!-- PROTEKSI AKSES PERANGKAT IPHONE (WAJIB PWA) -->
  <script>
    (function checkIOSPWARequirement() {
      const ua = navigator.userAgent || navigator.vendor || window.opera || '';
      const isIOS = /iPhone|iPod/.test(ua) || 
                    (/iPad/.test(ua)) || 
                    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

      if (isIOS) {
        const isStandaloneIOS = ('standalone' in window.navigator) && window.navigator.standalone;
        const isStandaloneCSS = window.matchMedia('(display-mode: standalone)').matches;
        const isPWA = isStandaloneIOS || isStandaloneCSS;

        // Jika iPhone mengakses dari browser biasa (Non-PWA), alihkan langsung ke iphone.html
        if (!isPWA) {
          window.location.replace('iphone.html');
        }
      }
    })();
  </script>
