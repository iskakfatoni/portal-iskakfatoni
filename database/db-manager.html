  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;

    #particle-canvas {

      z-index: 0;
      pointer-events: none;
    }

    .glass-card {

      -webkit-backdrop-filter: blur(16px);

    /* Custom Scrollbar untuk Table Horizontal/Vertical */

      width: 6px;
      height: 6px;
    }

      background: rgba(15, 23, 42, 0.6);
    }

      background: rgba(56, 189, 248, 0.3);
      border-radius: 4px;

    ::-webkit-scrollbar-thumb:hover {

        <div>

      <div class="flex items-center gap-3 w-full sm:w-auto justify-end">

          <i class="fa-solid fa-arrow-left"></i> <span>Kembali ke Admin</span>

    <!-- DASHBOARD PANEL -->

      <!-- NAVIGASI KOLEKSI DATABASE (KOLOM KIRI) -->
      <aside class="lg:col-span-3 space-y-3">

            <i class="fa-solid fa-folder-tree"></i> Koleksi Database
          </h2>

            </button>
            <button data-collection="sesi_absensi" class="btn-col w-full text-left px-3.5 py-2.5 rounded-xl text-xs font-bold transition flex items-center justify-between cursor-pointer bg-slate-900/60 text-slate-400 hover:bg-slate-800 border border-slate-800">
              <span class="flex items-center gap-2"><i class="fa-solid fa-calendar-check"></i> sesi_absensi</span>
              <span id="badge-sesi_absensi" class="px-2 py-0.5 rounded-full text-[10px] bg-slate-900 border border-slate-700 font-mono text-slate-300">0</span>
            </button>
            <button data-collection="log_absensi" class="btn-col w-full text-left px-3.5 py-2.5 rounded-xl text-xs font-bold transition flex items-center justify-between cursor-pointer bg-slate-900/60 text-slate-400 hover:bg-slate-800 border border-slate-800">
              <span class="flex items-center gap-2"><i class="fa-solid fa-clipboard-user"></i> log_absensi</span>
              <span id="badge-log_absensi" class="px-2 py-0.5 rounded-full text-[10px] bg-slate-900 border border-slate-700 font-mono text-slate-300">0</span>

      <!-- KONTEN TABEL MATRIKS DINAMIS (KOLOM KANAN) -->

        <div class="glass-card p-5 md:p-6 rounded-2xl shadow-xl space-y-4">
          
          <!-- TOOLBAR TABLE -->
          <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 border-b border-slate-800 pb-4">
            <div>
              <h2 id="active-collection-title" class="text-sm font-extrabold text-white flex items-center gap-2 uppercase tracking-wide">
                <i class="fa-solid fa-table-list text-cyan-400"></i> Koleksi: <span class="text-cyan-400 font-mono">siswa</span>

              <p class="text-[11px] text-slate-400 font-mono mt-0.5">Total dokumen: <span id="total-doc-count" class="text-emerald-400 font-bold">0</span></p>
            </div>

            <!-- AKSI SELEKSI & HAPUS MASAL -->
            <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
              <button id="btn-delete-selected" disabled class="py-2 px-3.5 bg-red-500/10 hover:bg-red-500/25 text-red-400 border border-red-500/30 font-bold text-xs rounded-xl transition flex items-center gap-1.5 cursor-pointer disabled:opacity-40 disabled:cursor-not-allowed">
                <i class="fa-solid fa-trash-can"></i> <span>Hapus Terpilih (<span id="selected-count">0</span>)</span>

              <button id="btn-clear-collection" class="py-2 px-3.5 bg-rose-950/40 hover:bg-rose-900/60 text-rose-300 border border-rose-800/60 font-bold text-xs rounded-xl transition flex items-center gap-1.5 cursor-pointer">
                <i class="fa-solid fa-triangle-exclamation"></i> <span>Kosongkan Koleksi</span>

          <!-- TABEL FIRESTORE DINAMIS (MATRIKS KOLOM & BARIS) -->
          <div class="overflow-x-auto max-h-[560px] overflow-y-auto rounded-xl border border-slate-800 bg-slate-950/70">
            <table class="w-full text-left border-collapse text-xs whitespace-nowrap">
              <thead class="sticky top-0 bg-slate-900/95 backdrop-blur border-b border-slate-800 text-slate-300 uppercase tracking-wider font-mono text-[11px] z-10">
                <tr id="table-header-row">
                  <th class="p-3 w-10 text-center border-r border-slate-800">
                    <input type="checkbox" id="select-all-checkbox" class="rounded bg-slate-900 border-slate-700 text-cyan-500 focus:ring-0 cursor-pointer">

                  <th class="p-3 font-bold text-cyan-400 border-r border-slate-800">Document ID</th>
                  <!-- HEADER FIELD AKAN DIBUAT DINAMIS LEWAT JAVASCRIPT -->
                  <th class="p-3 w-16 text-center">Aksi</th>
                </tr>
              </thead>
              <tbody id="table-body" class="divide-y divide-slate-800/60 text-slate-300 font-mono">
                <tr>
                  <td colspan="3" class="p-8 text-center text-slate-500 font-sans">// Memuat data koleksi...</td>
                </tr>
              </tbody>
            </table>
          </div>

          <!-- FOOTER TABLE STATUS -->
          <div class="flex items-center justify-between text-[11px] text-slate-500 font-mono pt-1">
            <span>Realtime Listener Active</span>
            <span id="sync-status" class="text-emerald-400">Firestore Connected</span>
          </div>

        </div>
      </section>

    </div>

    <!-- FOOTER -->
    <div class="text-center pt-2">
      <p class="text-xs text-slate-500 font-mono">Developed by Iskak Fatoni, S.Pd., Gr.</p>
    </div>

  </main>

  <!-- PARTICLE CANVAS ANIMATION -->
  <script>
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function initCanvas() {
      canvas.width = document.documentElement.clientWidth || window.innerWidth;
      canvas.height = window.innerHeight;
      particles = [];
      for (let i = 0; i < 35; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          radius: Math.random() * 2 + 1,
          speedY: Math.random() * -0.5 - 0.2,
          speedX: (Math.random() - 0.5) * 0.3,
          opacity: Math.random() * 0.6 + 0.3
        });
      }
    }

    function drawParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const isDarkMode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const particleColor = isDarkMode ? "0, 245, 212" : "139, 92, 246";

      particles.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${particleColor}, ${p.opacity})`;
        ctx.shadowBlur = 6;
        ctx.shadowColor = `rgb(${particleColor})`;
        ctx.fill();

        p.y += p.speedY; p.x += p.speedX;
        if (p.y < 0) { p.y = canvas.height; p.x = Math.random() * canvas.width; }
      });
      requestAnimationFrame(drawParticles);
    }

    window.addEventListener('resize', initCanvas);
    initCanvas();
    drawParticles();
  </script>

  <!-- FIREBASE AUTH & FIRESTORE SCRIPT -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, collection, doc, deleteDoc, onSnapshot, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDhq4QoCn00GkfpKXSP8PnvSvEKa2yn0ic",
      authDomain: "portal-iskakfatoni.firebaseapp.com",
      projectId: "portal-iskakfatoni",
      storageBucket: "portal-iskakfatoni.firebasestorage.app",
      messagingSenderId: "367350728822",
      appId: "1:367350728822:web:6b0c6fd4824102d8acf757",
      measurementId: "G-0BNNKQQ24V"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const userEmailDisplay = document.getElementById('user-email-display');
    const btnLogout = document.getElementById('btn-logout');

    const activeCollectionTitle = document.getElementById('active-collection-title');
    const totalDocCount = document.getElementById('total-doc-count');
    const tableHeaderRow = document.getElementById('table-header-row');
    const tableBody = document.getElementById('table-body');
    const selectAllCheckbox = document.getElementById('select-all-checkbox');
    const btnDeleteSelected = document.getElementById('btn-delete-selected');
    const btnClearCollection = document.getElementById('btn-clear-collection');
    const selectedCountSpan = document.getElementById('selected-count');

    let currentCollection = 'siswa';
    let unsubscribeCurrent = null;
    let selectedDocIds = new Set();
    let currentDocsList = [];

    // 🔒 PROTEKSI ROUTE
    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = "../admin.html";
      } else {
        userEmailDisplay.innerText = user.email;
        initBadgesCount();
        loadCollectionData(currentCollection);
      }
    });

    btnLogout.addEventListener('click', () => {
      window.location.href = "../admin.html";
    });

    // HITUNG DATA DI BADGE NAVIGASI SIDEBAR
    function initBadgesCount() {
      const collections = ['siswa', 'kelas', 'mapel', 'sesi_absensi', 'log_absensi', 'links'];
      collections.forEach(colName => {
        onSnapshot(collection(db, colName), (snap) => {
          const badge = document.getElementById(`badge-${colName}`);
          if (badge) badge.innerText = snap.size;
        });
      });
    }

    // NAVIGASI GANTI KOLEKSI
    document.querySelectorAll('.btn-col').forEach(btn => {
      btn.addEventListener('click', () => {
        const targetCol = btn.getAttribute('data-collection');
        if (targetCol === currentCollection) return;

        document.querySelectorAll('.btn-col').forEach(b => {
          b.className = "btn-col w-full text-left px-3.5 py-2.5 rounded-xl text-xs font-bold transition flex items-center justify-between cursor-pointer bg-slate-900/60 text-slate-400 hover:bg-slate-800 border border-slate-800";
        });
        btn.className = "btn-col w-full text-left px-3.5 py-2.5 rounded-xl text-xs font-bold transition flex items-center justify-between cursor-pointer bg-cyan-500/20 text-cyan-300 border border-cyan-500/40";

        currentCollection = targetCol;
        activeCollectionTitle.innerHTML = `<i class="fa-solid fa-table-list text-cyan-400"></i> Koleksi: <span class="text-cyan-400 font-mono">${currentCollection}</span>`;
        loadCollectionData(currentCollection);
      });
    });

    // FORMAT VALUE DARI FIRESTORE KE TAMPILAN TEXT YANG RAPI
    function formatCellContent(value) {
      if (value === null || value === undefined) return '<span class="text-slate-600">-</span>';
      
      // Jika tipe data Timestamp dari Firestore
      if (typeof value === 'object' && value.seconds !== undefined) {
        return `<span class="text-emerald-400">${new Date(value.seconds * 1000).toLocaleString('id-ID')}</span>`;
      }
      
      // Jika tipe data Object/Array
      if (typeof value === 'object') {
        return `<span class="text-amber-300/80">${JSON.stringify(value)}</span>`;
      }

      // Tipe data Boolean
      if (typeof value === 'boolean') {
        return value 
          ? '<span class="text-emerald-400 font-bold">true</span>' 
          : '<span class="text-rose-400 font-bold">false</span>';
      }

      return String(value);
    }

    // FUNGSI UNTUK MENGUBAH NAMA HEADER FIELD AGAR LEBIH RAPI
    function formatHeaderName(fieldKey) {
      const lower = fieldKey.toLowerCase();
      if (lower === 'wali_kelas' || lower === 'id_wali_kelas' || lower === 'namawalikelas' || lower === 'nama_wali_kelas') {
        return 'Guru Kelas';
      }
      return fieldKey;
    }

    // MUAT DATA DINAMIS TABEL MATRIKS (KOLOM & BARIS)
    function loadCollectionData(colName) {
      if (unsubscribeCurrent) unsubscribeCurrent();

      selectedDocIds.clear();
      updateSelectedUI();
      selectAllCheckbox.checked = false;
      
      tableHeaderRow.innerHTML = `
        <th class="p-3 w-10 text-center border-r border-slate-800">
          <input type="checkbox" id="select-all-checkbox" class="rounded bg-slate-900 border-slate-700 text-cyan-500 focus:ring-0 cursor-pointer">
        </th>
        <th class="p-3 font-bold text-cyan-400 border-r border-slate-800">Document ID</th>
        <th class="p-3 w-16 text-center">Aksi</th>
      `;
      
      document.getElementById('select-all-checkbox').addEventListener('change', handleSelectAll);
      tableBody.innerHTML = `<tr><td colspan="10" class="p-8 text-center text-slate-500 font-sans">// Memuat koleksi "${colName}"...</td></tr>`;

      unsubscribeCurrent = onSnapshot(collection(db, colName), (snapshot) => {
        currentDocsList = snapshot.docs;
        totalDocCount.innerText = snapshot.size;

        if (snapshot.empty) {
          tableBody.innerHTML = `<tr><td colspan="10" class="p-8 text-center text-slate-500 font-sans">// Koleksi "${colName}" masih kosong.</td></tr>`;
          return;
        }

        // 1. KUMPULKAN FIELD UNIK & FILTER `created_at`
        const fieldSet = new Set();
        snapshot.docs.forEach(docSnap => {
          Object.keys(docSnap.data()).forEach(k => {
            // Sembunyikan field 'created_at' dan variasi penulisannya
            if (k.toLowerCase() !== 'created_at' && k.toLowerCase() !== 'createdat') {
              fieldSet.add(k);
            }
          });
        });
        const dynamicFields = Array.from(fieldSet);

        // 2. RENDER HEADER TABEL DINAMIS (DENGAN REPLACEMENT 'Guru Kelas')
        tableHeaderRow.innerHTML = `
          <th class="p-3 w-10 text-center border-r border-slate-800">
            <input type="checkbox" id="select-all-checkbox" class="rounded bg-slate-900 border-slate-700 text-cyan-500 focus:ring-0 cursor-pointer">
          </th>
          <th class="p-3 font-bold text-cyan-400 border-r border-slate-800">Document ID</th>
          ${dynamicFields.map(f => `<th class="p-3 border-r border-slate-800 text-slate-300 font-semibold">${formatHeaderName(f)}</th>`).join('')}
          <th class="p-3 w-16 text-center">Aksi</th>
        `;

        document.getElementById('select-all-checkbox').addEventListener('change', handleSelectAll);

        // 3. RENDER BARIS & KOLOM MATRIKS
        tableBody.innerHTML = '';
        snapshot.forEach((docSnap) => {
          const docId = docSnap.id;
          const dataObj = docSnap.data();
          const isChecked = selectedDocIds.has(docId);

          const tr = document.createElement('tr');
          tr.className = "hover:bg-slate-900/80 transition border-b border-slate-800/40";
          
          // Render isi data sel per kolom field
          const fieldCells = dynamicFields.map(fieldKey => {
            const val = dataObj[fieldKey];
            return `<td class="p-3 border-r border-slate-800/60 max-w-xs overflow-hidden text-ellipsis">${formatCellContent(val)}</td>`;
          }).join('');

          tr.innerHTML = `
            <td class="p-3 text-center border-r border-slate-800/60">
              <input type="checkbox" data-id="${docId}" ${isChecked ? 'checked' : ''} class="row-checkbox rounded bg-slate-900 border-slate-700 text-cyan-500 focus:ring-0 cursor-pointer">
            </td>
            <td class="p-3 font-bold text-cyan-400 border-r border-slate-800/60 font-mono">${docId}</td>
            ${fieldCells}
            <td class="p-3 text-center">
              <button class="btn-del-single p-2 bg-red-500/15 hover:bg-red-500/30 text-red-400 border border-red-500/30 rounded-lg text-xs font-semibold cursor-pointer transition" title="Hapus Dokumen Ini">
                <i class="fa-solid fa-trash-can"></i>
              </button>
            </td>
          `;

          // Checkbox handler per baris
          const chk = tr.querySelector('.row-checkbox');
          chk.addEventListener('change', (e) => {
            if (e.target.checked) {
              selectedDocIds.add(docId);
            } else {
              selectedDocIds.delete(docId);
            }
            updateSelectedUI();
          });

          // Single delete handler
          tr.querySelector('.btn-del-single').onclick = async () => {
            if (confirm(`Hapus dokumen ID: "${docId}" dari koleksi ${colName}?`)) {
              try {
                await deleteDoc(doc(db, colName, docId));
                selectedDocIds.delete(docId);
                updateSelectedUI();
              } catch (err) {
                alert("Gagal menghapus: " + err.message);
              }
            }
          };

          tableBody.appendChild(tr);
        });

        // Update status Checkbox Select All
        const headerChk = document.getElementById('select-all-checkbox');
        if (headerChk) {
          headerChk.checked = currentDocsList.length > 0 && selectedDocIds.size === currentDocsList.length;
        }
      });
    }

    function handleSelectAll(e) {
      const isChecked = e.target.checked;
      const rowCheckboxes = document.querySelectorAll('.row-checkbox');

      selectedDocIds.clear();
      rowCheckboxes.forEach(chk => {
        chk.checked = isChecked;
        if (isChecked) {
          selectedDocIds.add(chk.getAttribute('data-id'));
        }
      });
      updateSelectedUI();
    }

    function updateSelectedUI() {
      const count = selectedDocIds.size;
      selectedCountSpan.innerText = count;
      btnDeleteSelected.disabled = count === 0;
    }

    // HANDLER HAPUS TERPILIH (BULK DELETE)
    btnDeleteSelected.addEventListener('click', async () => {
      const count = selectedDocIds.size;
      if (count === 0) return;

      if (confirm(`Apakah Anda yakin ingin menghapus ${count} dokumen terpilih dari koleksi "${currentCollection}"?`)) {
        try {
          const batch = writeBatch(db);
          selectedDocIds.forEach(id => {
            batch.delete(doc(db, currentCollection, id));
          });

          await batch.commit();
          selectedDocIds.clear();
          updateSelectedUI();
          const headerChk = document.getElementById('select-all-checkbox');
          if (headerChk) headerChk.checked = false;
          alert(`Berhasil menghapus ${count} dokumen!`);
        } catch (err) {
          alert("Gagal menghapus dokumen terpilih: " + err.message);
        }
      }
    });

    // HANDLER KOSONGKAN SELURUH KOLEKSI
    btnClearCollection.addEventListener('click', async () => {
      if (currentDocsList.length === 0) {
        alert(`Koleksi "${currentCollection}" sudah kosong.`);
        return;
      }

      const promptInput = prompt(`⚠️ PERINGATAN BAHAYA!\n\nAnda akan menghapus SELURUH data (${currentDocsList.length} dokumen) dalam koleksi "${currentCollection}".\n\nKetik nama koleksi "${currentCollection}" di bawah ini untuk mengonfirmasi:`);

      if (promptInput === currentCollection) {
        try {
          const batch = writeBatch(db);
          currentDocsList.forEach(d => {
            batch.delete(doc(db, currentCollection, d.id));
          });

          await batch.commit();
          selectedDocIds.clear();
          updateSelectedUI();
          const headerChk = document.getElementById('select-all-checkbox');
          if (headerChk) headerChk.checked = false;
          alert(`Koleksi "${currentCollection}" berhasil dikosongkan!`);
        } catch (err) {
          alert("Gagal mengosongkan koleksi: " + err.message);
        }
      } else if (promptInput !== null) {
        alert("Konfirmasi dibatalkan: Nama koleksi yang dimasukkan tidak cocok.");
      }
    });
  </script>
</body>
</html>
