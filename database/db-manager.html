  <!-- PARTICLE CANVAS ANIMATION -->
  <script>
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function initCanvas() {
      canvas.width = document.documentElement.clientWidth || window.innerWidth;
      canvas.height = window.innerHeight;
      particles = [];
      for (let i = 0; i < 35; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          radius: Math.random() * 2 + 1,
          speedY: Math.random() * -0.5 - 0.2,
          speedX: (Math.random() - 0.5) * 0.3,
          opacity: Math.random() * 0.6 + 0.3
        });
      }
    }

    function drawParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const isDarkMode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const particleColor = isDarkMode ? "0, 245, 212" : "139, 92, 246";

      particles.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${particleColor}, ${p.opacity})`;
        ctx.shadowBlur = 6;
        ctx.shadowColor = `rgb(${particleColor})`;
        ctx.fill();

        p.y += p.speedY; p.x += p.speedX;
        if (p.y < 0) { p.y = canvas.height; p.x = Math.random() * canvas.width; }
      });
      requestAnimationFrame(drawParticles);
    }

    window.addEventListener('resize', initCanvas);
    initCanvas();
    drawParticles();
  </script>

  <!-- FIREBASE AUTH & FIRESTORE SCRIPT -->
  <script type="module">
    // Import Konfigurasi Terpisah (Aman dari Kebocoran API Key)
    import { firebaseConfig } from "../assets/js/config/firebase-config.js";
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, collection, doc, deleteDoc, updateDoc, deleteField, onSnapshot, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const userEmailDisplay = document.getElementById('user-email-display');
    const btnLogout = document.getElementById('btn-logout');

    const activeCollectionTitle = document.getElementById('active-collection-title');
    const totalDocCount = document.getElementById('total-doc-count');
    const tableHeaderRow = document.getElementById('table-header-row');
    const tableBody = document.getElementById('table-body');
    const selectAllCheckbox = document.getElementById('select-all-checkbox');
    const btnDeleteSelected = document.getElementById('btn-delete-selected');
    const btnClearCollection = document.getElementById('btn-clear-collection');
    const selectedCountSpan = document.getElementById('selected-count');
    const btnExportDeviceExcel = document.getElementById('btn-export-device-excel');

    let currentCollection = 'siswa';
    let unsubscribeCurrent = null;
    let selectedDocIds = new Set();
    let currentDocsList = [];
    
    // STATE UNTUK SORTING
    let currentSortField = null;
    let currentSortOrder = 'asc';
    let currentDynamicFields = [];

    // 🔒 AUTH GUARD: Proteksi Route jika Belum Login
    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = "../admin.html";
      } else {
        document.documentElement.style.display = 'block';
        userEmailDisplay.innerText = user.email;
        initBadgesCount();
        loadCollectionData(currentCollection);
      }
    });

    btnLogout.addEventListener('click', () => {
      window.location.href = "../admin.html";
    });

    // HITUNG DATA DI BADGE NAVIGASI SIDEBAR
    function initBadgesCount() {
      const collections = ['siswa', 'kelas', 'mapel', 'sesi_absensi', 'log_absensi', 'links'];
      collections.forEach(colName => {
        onSnapshot(collection(db, colName), (snap) => {
          const badge = document.getElementById(`badge-${colName}`);
          if (badge) badge.innerText = snap.size;
        });
      });
    }

    // NAVIGASI GANTI KOLEKSI
    document.querySelectorAll('.btn-col').forEach(btn => {
      btn.addEventListener('click', () => {
        const targetCol = btn.getAttribute('data-collection');
        if (targetCol === currentCollection) return;

        document.querySelectorAll('.btn-col').forEach(b => {
          b.className = "btn-col w-full text-left px-3.5 py-2.5 rounded-xl text-xs font-bold transition flex items-center justify-between cursor-pointer bg-slate-900/60 text-slate-400 hover:bg-slate-800 border border-slate-800";
        });
        btn.className = "btn-col w-full text-left px-3.5 py-2.5 rounded-xl text-xs font-bold transition flex items-center justify-between cursor-pointer bg-cyan-500/20 text-cyan-300 border border-cyan-500/40";

        currentCollection = targetCol;
        currentSortField = null;
        currentSortOrder = 'asc';
        activeCollectionTitle.innerHTML = `<i class="fa-solid fa-table-list text-cyan-400"></i> Koleksi: <span class="text-cyan-400 font-mono">${currentCollection}</span>`;
        
        // Tampilkan/sembunyikan tombol Ekspor Perangkat sesuai koleksi aktif
        if (btnExportDeviceExcel) {
          btnExportDeviceExcel.style.display = currentCollection === 'siswa' ? 'inline-flex' : 'none';
        }

        loadCollectionData(currentCollection);
      });
    });

    // FORMAT VALUE DARI FIRESTORE KE TAMPILAN TEXT
    function formatCellContent(value) {
      if (value === null || value === undefined) return '<span class="text-slate-600">-</span>';
      
      if (typeof value === 'object' && value.seconds !== undefined) {
        return `<span class="text-emerald-400">${new Date(value.seconds * 1000).toLocaleString('id-ID')}</span>`;
      }
      
      if (typeof value === 'object') {
        return `<span class="text-amber-300/80">${JSON.stringify(value)}</span>`;
      }

      if (typeof value === 'boolean') {
        return value 
          ? '<span class="text-emerald-400 font-bold">true</span>' 
          : '<span class="text-rose-400 font-bold">false</span>';
      }

      return String(value);
    }

    // FORMAT NAMA HEADER LEBIH RAPI
    function formatHeaderName(fieldKey) {
      const lower = fieldKey.toLowerCase();
      if (lower === 'wali_kelas' || lower === 'id_wali_kelas' || lower === 'namawalikelas' || lower === 'nama_wali_kelas') {
        return 'Guru Kelas';
      }
      return fieldKey;
    }

    // MUAT DATA DINAMIS TABEL MATRIKS
    function loadCollectionData(colName) {
      if (unsubscribeCurrent) unsubscribeCurrent();

      selectedDocIds.clear();
      updateSelectedUI();
      
      tableBody.innerHTML = `<tr><td colspan="12" class="p-8 text-center text-slate-500 font-sans">// Memuat koleksi "${colName}"...</td></tr>`;

      unsubscribeCurrent = onSnapshot(collection(db, colName), (snapshot) => {
        currentDocsList = snapshot.docs;
        totalDocCount.innerText = snapshot.size;

        if (snapshot.empty) {
          tableBody.innerHTML = `<tr><td colspan="12" class="p-8 text-center text-slate-500 font-sans">// Koleksi "${colName}" masih kosong.</td></tr>`;
          return;
        }

        // 1. KUMPULKAN FIELD UNIK & FILTER `created_at`
        const fieldSet = new Set();
        snapshot.docs.forEach(docSnap => {
          Object.keys(docSnap.data()).forEach(k => {
            if (k.toLowerCase() !== 'created_at' && k.toLowerCase() !== 'createdat') {
              fieldSet.add(k);
            }
          });
        });
        currentDynamicFields = Array.from(fieldSet);

        // 2. RENDER HEADER TABEL DINAMIS
        renderTableHeaders();

        // 3. RENDER ISI TABEL DATA
        renderSortedTableBody();
      });
    }

    // RENDER HEADER DENGAN POSISI CHECKBOX DI SISI KANAN
    function renderTableHeaders() {
      const getSortIcon = (field) => {
        if (currentSortField !== field) return '<span class="text-[10px] text-slate-600 ml-1">⇅</span>';
        return currentSortOrder === 'asc' 
          ? '<span class="text-[10px] text-cyan-400 ml-1">▲</span>' 
          : '<span class="text-[10px] text-cyan-400 ml-1">▼</span>';
      };

      const fieldsHeaderHTML = currentDynamicFields.map(f => {
        const isSorted = currentSortField === f;
        const bgClass = isSorted ? 'bg-cyan-950/40 text-cyan-300 font-bold' : 'text-slate-300 font-semibold';
        return `
          <th class="p-3 border-r border-slate-800 ${bgClass} cursor-pointer hover:bg-slate-800/80 transition select-none sort-header" data-sort="${f}">
            ${formatHeaderName(f)} ${getSortIcon(f)}
          </th>
        `;
      }).join('');

      const idHeaderClass = currentSortField === '__id__' ? 'bg-cyan-950/40 text-cyan-300 font-bold' : 'text-cyan-400 font-bold';

      tableHeaderRow.innerHTML = `
        <th class="p-3 w-12 text-center border-r border-slate-800 font-bold text-slate-400">NO</th>
        <th class="p-3 ${idHeaderClass} border-r border-slate-800 cursor-pointer hover:bg-slate-800/80 transition select-none sort-header" data-sort="__id__">
          Document ID ${getSortIcon('__id__')}
        </th>
        ${fieldsHeaderHTML}
        <th class="p-3 w-10 text-center border-r border-slate-800">
          <input type="checkbox" id="select-all-checkbox" class="rounded bg-slate-900 border-slate-700 text-cyan-500 focus:ring-0 cursor-pointer" title="Pilih Semua">
        </th>
        <th class="p-3 w-28 text-center">Aksi</th>
      `;

      // BIND EVENT LISTENERS PADA HEADER
      const headerChk = document.getElementById('select-all-checkbox');
      if (headerChk) headerChk.addEventListener('change', handleSelectAll);

      document.querySelectorAll('.sort-header').forEach(th => {
        th.addEventListener('click', () => {
          const sortKey = th.getAttribute('data-sort');
          if (currentSortField === sortKey) {
            currentSortOrder = currentSortOrder === 'asc' ? 'desc' : 'asc';
          } else {
            currentSortField = sortKey;
            currentSortOrder = 'asc';
          }
          renderTableHeaders();
          renderSortedTableBody();
        });
      });
    }

    // FUNGSI SORTING LOKAL & RENDER BODY TABEL
    function renderSortedTableBody() {
      if (currentDocsList.length === 0) return;

      let sortedDocs = [...currentDocsList];

      if (currentSortField) {
        sortedDocs.sort((a, b) => {
          let valA, valB;

          if (currentSortField === '__id__') {
            valA = a.id;
            valB = b.id;
          } else {
            valA = a.data()[currentSortField];
            valB = b.data()[currentSortField];
          }

          if (valA === undefined || valA === null) valA = '';
          if (valB === undefined || valB === null) valB = '';

          if (typeof valA === 'object' && valA.seconds !== undefined) valA = valA.seconds;
          if (typeof valB === 'object' && valB.seconds !== undefined) valB = valB.seconds;

          if (typeof valA === 'string') valA = valA.toLowerCase();
          if (typeof valB === 'string') valB = valB.toLowerCase();

          if (valA < valB) return currentSortOrder === 'asc' ? -1 : 1;
          if (valA > valB) return currentSortOrder === 'asc' ? 1 : -1;
          return 0;
        });
      }

      // RENDER BARIS TABEL
      tableBody.innerHTML = '';
      sortedDocs.forEach((docSnap, index) => {
        const docId = docSnap.id;
        const dataObj = docSnap.data();
        const isChecked = selectedDocIds.has(docId);

        const tr = document.createElement('tr');
        tr.className = "hover:bg-slate-900/80 transition border-b border-slate-800/40";
        
        const fieldCells = currentDynamicFields.map(fieldKey => {
          const val = dataObj[fieldKey];
          return `<td class="p-3 border-r border-slate-800/60 max-w-xs overflow-hidden text-ellipsis">${formatCellContent(val)}</td>`;
        }).join('');

        // Tombol Reset Device khusus untuk koleksi 'siswa'
        const isSiswaCollection = currentCollection === 'siswa';
        const btnResetDeviceHTML = isSiswaCollection ? `
          <button class="btn-reset-device p-2 bg-amber-500/15 hover:bg-amber-500/30 text-amber-400 border border-amber-500/30 rounded-lg text-xs font-semibold cursor-pointer transition mr-1" title="Reset Perangkat Siswa">
            <i class="fa-solid fa-mobile-screen-button"></i>
          </button>
        ` : '';

        tr.innerHTML = `
          <td class="p-3 text-center border-r border-slate-800/60 font-mono text-slate-400 font-bold">${index + 1}</td>
          <td class="p-3 font-bold text-cyan-400 border-r border-slate-800/60 font-mono">${docId}</td>
          ${fieldCells}
          <td class="p-3 text-center border-r border-slate-800/60">
            <input type="checkbox" data-id="${docId}" ${isChecked ? 'checked' : ''} class="row-checkbox rounded bg-slate-900 border-slate-700 text-cyan-500 focus:ring-0 cursor-pointer">
          </td>
          <td class="p-3 text-center whitespace-nowrap">
            ${btnResetDeviceHTML}
            <button class="btn-del-single p-2 bg-red-500/15 hover:bg-red-500/30 text-red-400 border border-red-500/30 rounded-lg text-xs font-semibold cursor-pointer transition" title="Hapus Dokumen Ini">
              <i class="fa-solid fa-trash-can"></i>
            </button>
          </td>
        `;

        // Checkbox handler
        const chk = tr.querySelector('.row-checkbox');
        chk.addEventListener('change', (e) => {
          if (e.target.checked) {
            selectedDocIds.add(docId);
          } else {
            selectedDocIds.delete(docId);
          }
          updateSelectedUI();
        });

        // Reset Device Handler (Khusus Siswa)
        if (isSiswaCollection) {
          const btnReset = tr.querySelector('.btn-reset-device');
          if (btnReset) {
            btnReset.onclick = async () => {
              const studentName = dataObj.nama_siswa || docId;
              if (confirm(`Reset pendaftaran perangkat (HP) untuk siswa "${studentName}" (${docId})? Siswa dapat melakukan registrasi di HP baru.`)) {
                try {
                  await updateDoc(doc(db, "siswa", docId), {
                    device_id: deleteField(),
                    device_token: deleteField(),
                    mac_address: deleteField(),
                    registered_at: deleteField()
                  });
                  alert(`Perangkat siswa "${studentName}" berhasil di-reset!`);
                } catch (err) {
                  alert("Gagal mereset perangkat: " + err.message);
                }
              }
            };
          }
        }

        // Delete handler
        tr.querySelector('.btn-del-single').onclick = async () => {
          if (confirm(`Hapus dokumen ID: "${docId}" dari koleksi ${currentCollection}?`)) {
            try {
              await deleteDoc(doc(db, currentCollection, docId));
              selectedDocIds.delete(docId);
              updateSelectedUI();
            } catch (err) {
              alert("Gagal menghapus: " + err.message);
            }
          }
        };

        tableBody.appendChild(tr);
      });

      // Update status Select All Header
      const headerChk = document.getElementById('select-all-checkbox');
      if (headerChk) {
        headerChk.checked = currentDocsList.length > 0 && selectedDocIds.size === currentDocsList.length;
      }
    }

    function handleSelectAll(e) {
      const isChecked = e.target.checked;
      const rowCheckboxes = document.querySelectorAll('.row-checkbox');

      selectedDocIds.clear();
      rowCheckboxes.forEach(chk => {
        chk.checked = isChecked;
        if (isChecked) {
          selectedDocIds.add(chk.getAttribute('data-id'));
        }
      });
      updateSelectedUI();
    }

    function updateSelectedUI() {
      const count = selectedDocIds.size;
      selectedCountSpan.innerText = count;
      btnDeleteSelected.disabled = count === 0;
    }

    // HANDLER HAPUS TERPILIH (BULK DELETE)
    btnDeleteSelected.addEventListener('click', async () => {
      const count = selectedDocIds.size;
      if (count === 0) return;

      if (confirm(`Apakah Anda yakin ingin menghapus ${count} dokumen terpilih dari koleksi "${currentCollection}"?`)) {
        try {
          const batch = writeBatch(db);
          selectedDocIds.forEach(id => {
            batch.delete(doc(db, currentCollection, id));
          });

          await batch.commit();
          selectedDocIds.clear();
          updateSelectedUI();
          const headerChk = document.getElementById('select-all-checkbox');
          if (headerChk) headerChk.checked = false;
          alert(`Berhasil menghapus ${count} dokumen!`);
        } catch (err) {
          alert("Gagal menghapus dokumen terpilih: " + err.message);
        }
      }
    });

    // HANDLER KOSONGKAN SELURUH KOLEKSI
    btnClearCollection.addEventListener('click', async () => {
      if (currentDocsList.length === 0) {
        alert(`Koleksi "${currentCollection}" sudah kosong.`);
        return;
      }

      const promptInput = prompt(`⚠️ PERINGATAN BAHAYA!\n\nAnda akan menghapus SELURUH data (${currentDocsList.length} dokumen) dalam koleksi "${currentCollection}".\n\nKetik nama koleksi "${currentCollection}" di bawah ini untuk mengonfirmasi:`);

      if (promptInput === currentCollection) {
        try {
          const batch = writeBatch(db);
          currentDocsList.forEach(d => {
            batch.delete(doc(db, currentCollection, d.id));
          });

          await batch.commit();
          selectedDocIds.clear();
          updateSelectedUI();
          const headerChk = document.getElementById('select-all-checkbox');
          if (headerChk) headerChk.checked = false;
          alert(`Koleksi "${currentCollection}" berhasil dikosongkan!`);
        } catch (err) {
          alert("Gagal mengosongkan koleksi: " + err.message);
        }
      } else if (promptInput !== null) {
        alert("Konfirmasi dibatalkan: Nama koleksi yang dimasukkan tidak cocok.");
      }
    });

    // HANDLER EKSPOR DATA PERANGKAT HP SISWA KE EXCEL
    if (btnExportDeviceExcel) {
      btnExportDeviceExcel.addEventListener('click', () => {
        if (currentCollection !== 'siswa') {
          alert('Fitur ekspor perangkat HP hanya tersedia untuk koleksi "siswa".');
          return;
        }

        if (!currentDocsList || currentDocsList.length === 0) {
          alert('Tidak ada data siswa untuk diekspor.');
          return;
        }

        // Ekstrak & Format Data Perangkat Siswa
        const exportData = currentDocsList.map((docSnap, index) => {
          const data = docSnap.data();
          const isBound = Boolean(data.device_id || data.device_token || data.mac_address);

          return {
            "No": index + 1,
            "Document ID": docSnap.id,
            "NIS": data.nis || docSnap.id,
            "Nama Siswa": data.nama_siswa || data.nama || "-",
            "ID Kelas": data.id_kelas || "-",
            "Nama Kelas": data.nama_kelas || "-",
            "Status Perangkat": isBound ? "TERIKAT (BOUND)" : "BELUM TERIKAT",
            "Device ID / Fingerprint": data.device_id || "-",
            "Device Token": data.device_token || "-",
            "Waktu Terikat": data.registered_at && data.registered_at.seconds 
              ? new Date(data.registered_at.seconds * 1000).toLocaleString('id-ID') 
              : "-"
          };
        });

        // Buat Worksheet Excel
        const worksheet = XLSX.utils.json_to_sheet(exportData);
        
        // Atur Lebar Kolom
        worksheet['!cols'] = [
          { wch: 5 },  // No
          { wch: 15 }, // Document ID
          { wch: 15 }, // NIS
          { wch: 28 }, // Nama Siswa
          { wch: 12 }, // ID Kelas
          { wch: 15 }, // Nama Kelas
          { wch: 20 }, // Status Perangkat
          { wch: 35 }, // Device ID
          { wch: 30 }, // Device Token
          { wch: 22 }  // Waktu Terikat
        ];

        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "Perangkat Siswa");

        // Unduh File Excel (.xlsx)
        const today = new Date().toISOString().split('T')[0];
        XLSX.writeFile(workbook, `Rekap_Perangkat_Siswa_${today}.xlsx`);
      });
    }
  </script>
</body>
</html>
