<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PORTAL :: Firestore Database CRUD Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0b0f19;
      color: #ffffff;
    }
    .glass-card {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-start items-center p-4 md:p-8">

  <div id="dashboard-section" class="max-w-6xl w-full space-y-6 my-auto">
    
    <!-- TOP BAR HEADER -->
    <header class="flex items-center justify-between glass-card p-4 md:p-5 rounded-2xl shadow-xl">
      <div class="flex items-center gap-3.5">
        <div class="w-11 h-11 rounded-xl bg-purple-500/10 border border-purple-500/30 flex items-center justify-center text-purple-400 font-bold">
          <i class="fa-solid fa-database text-xl"></i>
        </div>
        <div>
          <h2 class="text-base font-bold text-white tracking-wide">Firestore Database Manager</h2>
          <p id="user-email-display" class="text-xs text-slate-400 font-mono">admin@domain.com</p>
        </div>
      </div>

      <!-- TOMBOL KEMBALI KE ADMIN PUSAT -->
      <button id="btn-logout" title="Kembali ke Master Admin" class="py-2.5 px-4 bg-red-500/15 hover:bg-red-500/30 text-red-400 border border-red-500/40 font-bold text-xs rounded-xl transition flex items-center gap-2 cursor-pointer">
        <i class="fa-solid fa-arrow-left"></i> <span>Kembali ke Hub Admin</span>
      </button>
    </header>

    <!-- TAB SELECTOR KOLEKSI DATABASE -->
    <div class="flex items-center gap-2 p-1.5 glass-card rounded-xl overflow-x-auto">
      <button id="tab-siswa" class="py-2.5 px-4 rounded-lg font-bold text-xs bg-cyan-500 text-slate-950 transition flex items-center gap-2 whitespace-nowrap cursor-pointer">
        <i class="fa-solid fa-user-graduate"></i> Koleksi: siswa
      </button>
      <button id="tab-kelas" class="py-2.5 px-4 rounded-lg font-bold text-xs text-slate-400 hover:text-white transition flex items-center gap-2 whitespace-nowrap cursor-pointer">
        <i class="fa-solid fa-chalkboard-user"></i> Koleksi: kelas
      </button>
      <button id="tab-mapel" class="py-2.5 px-4 rounded-lg font-bold text-xs text-slate-400 hover:text-white transition flex items-center gap-2 whitespace-nowrap cursor-pointer">
        <i class="fa-solid fa-book"></i> Koleksi: mapel
      </button>
      <button id="tab-log" class="py-2.5 px-4 rounded-lg font-bold text-xs text-slate-400 hover:text-white transition flex items-center gap-2 whitespace-nowrap cursor-pointer">
        <i class="fa-solid fa-clipboard-list"></i> Koleksi: log_absensi
      </button>
    </div>

    <!-- MAIN GRID: FORM EDITOR (KIRI) vs DATA VIEWER (KANAN) -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      
      <!-- FORM INPUT / EDIT DOCUMENT -->
      <div class="lg:col-span-4 glass-card p-6 rounded-2xl space-y-4 shadow-xl h-fit">
        <h3 id="form-title" class="text-xs font-bold text-cyan-400 border-b border-slate-800 pb-2 flex items-center gap-2 uppercase tracking-wider">
          <i class="fa-solid fa-plus-circle"></i> Tambah Dokumen Siswa
        </h3>

        <form id="crud-form" class="space-y-3" onsubmit="return false;">
          <input type="hidden" id="edit-doc-id">

          <div id="group-siswa-nis" class="space-y-1">
            <label class="block text-[11px] font-semibold text-slate-300">NIS (ID Dokumen)</label>
            <input type="text" id="input-nis" placeholder="Contoh: 2026001" class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-slate-100 text-xs focus:outline-none focus:border-cyan-500">
          </div>

          <div id="group-siswa-nama" class="space-y-1">
            <label class="block text-[11px] font-semibold text-slate-300">Nama Siswa</label>
            <input type="text" id="input-nama-siswa" placeholder="Ahmad Fatoni" class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-slate-100 text-xs focus:outline-none focus:border-cyan-500">
          </div>

          <div id="group-siswa-kelas" class="space-y-1">
            <label class="block text-[11px] font-semibold text-slate-300">Kelas</label>
            <input type="text" id="input-nama-kelas" placeholder="XI TEI 1" class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-slate-100 text-xs focus:outline-none focus:border-cyan-500">
          </div>

          <div id="group-extra-field" class="space-y-1 hidden">
            <label id="label-extra" class="block text-[11px] font-semibold text-slate-300">Wali Kelas / Kategori</label>
            <input type="text" id="input-extra" placeholder="..." class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-slate-100 text-xs focus:outline-none focus:border-cyan-500">
          </div>

          <div id="group-form-actions" class="pt-2 flex gap-2">
            <button type="submit" id="btn-save-doc" class="flex-1 py-3 px-4 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-xs rounded-xl transition shadow-lg shadow-cyan-500/20 flex items-center justify-center gap-2 cursor-pointer">
              <i class="fa-solid fa-floppy-disk"></i> Simpan Data
            </button>
            
            <button type="button" id="btn-cancel-edit" class="py-3 px-3 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-xs rounded-xl transition hidden">
              Batal
            </button>
          </div>
        </form>
      </div>

      <!-- DATA LIST VIEWER -->
      <div class="lg:col-span-8 glass-card p-6 rounded-2xl space-y-4 shadow-xl">
        <div class="flex items-center justify-between border-b border-slate-800 pb-3">
          <h3 id="collection-title" class="text-xs font-bold text-cyan-400 flex items-center gap-2 uppercase tracking-wider">
            <i class="fa-solid fa-table"></i> Daftar Dokumen Koleksi: SISWA
          </h3>
          <span id="doc-count" class="text-xs text-slate-400 font-mono font-bold bg-slate-950 px-3 py-1 rounded-full border border-slate-800">0 Dokumen</span>
        </div>

        <div id="data-list-container" class="space-y-2.5 max-h-[500px] overflow-y-auto pr-2">
          <p class="text-xs text-slate-500 text-center py-10">// Memuat data dari Firestore...</p>
        </div>
      </div>

    </div>

    <!-- FOOTER -->
    <div class="text-center pt-2">
      <p class="text-xs text-slate-500 font-mono">Developed by Iskak Fatoni, S.Pd., Gr.</p>
    </div>

  </div>

  <!-- FIREBASE LOGIC -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, collection, doc, setDoc, deleteDoc, updateDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDhq4QoCn00GkfpKXSP8PnvSvEKa2yn0ic",
      authDomain: "portal-iskakfatoni.firebaseapp.com",
      projectId: "portal-iskakfatoni",
      storageBucket: "portal-iskakfatoni.firebasestorage.app",
      messagingSenderId: "367350728822",
      appId: "1:367350728822:web:6b0c6fd4824102d8acf757",
      measurementId: "G-0BNNKQQ24V"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const userEmailDisplay = document.getElementById('user-email-display');
    const btnLogout = document.getElementById('btn-logout');

    const tabSiswa = document.getElementById('tab-siswa');
    const tabKelas = document.getElementById('tab-kelas');
    const tabMapel = document.getElementById('tab-mapel');
    const tabLog = document.getElementById('tab-log');

    const formTitle = document.getElementById('form-title');
    const collectionTitle = document.getElementById('collection-title');
    const docCount = document.getElementById('doc-count');
    const dataListContainer = document.getElementById('data-list-container');
    const editDocId = document.getElementById('edit-doc-id');
    const btnCancelEdit = document.getElementById('btn-cancel-edit');
    const crudForm = document.getElementById('crud-form');
    const groupFormActions = document.getElementById('group-form-actions');

    const inputNis = document.getElementById('input-nis');
    const inputNamaSiswa = document.getElementById('input-nama-siswa');
    const inputNamaKelas = document.getElementById('input-nama-kelas');
    const groupExtraField = document.getElementById('group-extra-field');
    const labelExtra = document.getElementById('label-extra');
    const inputExtra = document.getElementById('input-extra');

    let activeCollection = 'siswa';
    let unsubscribeCollection = null;

    // 🔒 PROTEKSI ROUTE
    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = "../admin.html";
      } else {
        userEmailDisplay.innerText = user.email;
        loadCollection('siswa');
      }
    });

    // ↩️ KEMBALI KE HUB ADMIN (TANPA LOGOUT)
    btnLogout.addEventListener('click', () => {
      window.location.href = "../admin.html";
    });

    function setTabActive(tabBtn, colName) {
      [tabSiswa, tabKelas, tabMapel, tabLog].forEach(b => {
        b.className = "py-2.5 px-4 rounded-lg font-bold text-xs text-slate-400 hover:text-white transition flex items-center gap-2 whitespace-nowrap cursor-pointer";
      });
      tabBtn.className = "py-2.5 px-4 rounded-lg font-bold text-xs bg-cyan-500 text-slate-950 transition flex items-center gap-2 whitespace-nowrap cursor-pointer";
      
      activeCollection = colName;
      resetForm();
      adjustFormUI(colName);
      loadCollection(colName);
    }

    tabSiswa.addEventListener('click', () => setTabActive(tabSiswa, 'siswa'));
    tabKelas.addEventListener('click', () => setTabActive(tabKelas, 'kelas'));
    tabMapel.addEventListener('click', () => setTabActive(tabMapel, 'mapel'));
    tabLog.addEventListener('click', () => setTabActive(tabLog, 'log_absensi'));

    function adjustFormUI(colName) {
      if (colName === 'siswa') {
        formTitle.innerHTML = '<i class="fa-solid fa-plus-circle"></i> Tambah Dokumen Siswa';
        document.getElementById('group-siswa-nis').classList.remove('hidden');
        document.getElementById('group-siswa-nama').classList.remove('hidden');
        document.getElementById('group-siswa-kelas').classList.remove('hidden');
        groupExtraField.classList.add('hidden');
        groupFormActions.classList.remove('hidden');
      } else if (colName === 'kelas') {
        formTitle.innerHTML = '<i class="fa-solid fa-plus-circle"></i> Tambah Dokumen Kelas';
        document.getElementById('group-siswa-nis').classList.remove('hidden');
        document.getElementById('group-siswa-nama').classList.add('hidden');
        document.getElementById('group-siswa-kelas').classList.remove('hidden');
        groupExtraField.classList.remove('hidden');
        labelExtra.innerText = "Wali Kelas";
        groupFormActions.classList.remove('hidden');
      } else if (colName === 'mapel') {
        formTitle.innerHTML = '<i class="fa-solid fa-plus-circle"></i> Tambah Dokumen Mapel';
        document.getElementById('group-siswa-nis').classList.remove('hidden');
        document.getElementById('group-siswa-nama').classList.add('hidden');
        document.getElementById('group-siswa-kelas').classList.remove('hidden');
        groupExtraField.classList.remove('hidden');
        labelExtra.innerText = "Kategori Mapel";
        groupFormActions.classList.remove('hidden');
      } else {
        formTitle.innerHTML = '<i class="fa-solid fa-info-circle"></i> Log Absensi Viewer';
        document.getElementById('group-siswa-nis').classList.add('hidden');
        document.getElementById('group-siswa-nama').classList.add('hidden');
        document.getElementById('group-siswa-kelas').classList.add('hidden');
        groupExtraField.classList.add('hidden');
        groupFormActions.classList.add('hidden');
      }
    }

    function loadCollection(colName) {
      collectionTitle.innerText = `Daftar Dokumen Koleksi: ${colName.toUpperCase()}`;
      if (unsubscribeCollection) unsubscribeCollection();

      unsubscribeCollection = onSnapshot(collection(db, colName), (snapshot) => {
        dataListContainer.innerHTML = '';
        docCount.innerText = `${snapshot.size} Dokumen`;

        if (snapshot.empty) {
          dataListContainer.innerHTML = '<p class="text-xs text-slate-500 text-center py-10">// Koleksi ini masih kosong...</p>';
          return;
        }

        snapshot.forEach((docSnap) => {
          const data = docSnap.data();
          const docId = docSnap.id;

          const item = document.createElement('div');
          item.className = 'flex items-center justify-between p-3.5 bg-slate-950/90 rounded-xl border border-slate-800 text-xs hover:border-cyan-500/30 transition';

          let detailsHTML = `<p class="font-bold text-white text-sm">ID: ${docId}</p>`;
          if (colName === 'siswa') {
            detailsHTML += `<p class="text-slate-400 font-mono mt-0.5">${data.nama_siswa || '-'} (${data.nama_kelas || '-'})</p>`;
            if (data.device_id) {
              detailsHTML += `<p class="text-[10px] text-emerald-400 font-mono mt-0.5">🔒 ${data.device_id}</p>`;
            } else {
              detailsHTML += `<p class="text-[10px] text-slate-500 font-mono mt-0.5">🔓 Perangkat Belum Terikat</p>`;
            }
          } else if (colName === 'kelas') {
            detailsHTML += `<p class="text-slate-400 font-mono mt-0.5">${data.nama_kelas || docId} | Wali: ${data.wali_kelas || '-'}</p>`;
          } else if (colName === 'mapel') {
            detailsHTML += `<p class="text-slate-400 font-mono mt-0.5">${data.nama_mapel || docId} (${data.kategori || 'Wajib'})</p>`;
          } else if (colName === 'log_absensi') {
            detailsHTML += `
              <p class="font-bold text-white text-sm">${data.nama_siswa || 'Siswa'} (NIS: ${data.nis || '-'})</p>
              <p class="text-slate-400 font-mono text-[11px] mt-0.5">Kelas: ${data.id_kelas || '-'} | Waktu: ${data.waktu_scan || '-'}</p>
            `;
          }

          item.innerHTML = `
            <div>${detailsHTML}</div>
            <div class="flex items-center gap-1.5">
              ${colName === 'siswa' && data.device_id ? `
                <button class="btn-reset-device p-2 bg-amber-500/15 hover:bg-amber-500/30 text-amber-400 border border-amber-500/30 rounded-lg text-xs font-semibold cursor-pointer" title="Reset Device Locking HP">
                  <i class="fa-solid fa-mobile-screen-button"></i> Reset HP
                </button>
              ` : ''}
              <button class="btn-delete-doc p-2 bg-red-500/15 hover:bg-red-500/30 text-red-400 border border-red-500/30 rounded-lg text-xs font-semibold cursor-pointer" title="Hapus Dokumen">
                <i class="fa-solid fa-trash"></i>
              </button>
            </div>
          `;

          // Event Reset Device Locking
          const btnReset = item.querySelector('.btn-reset-device');
          if (btnReset) {
            btnReset.onclick = async () => {
              if (confirm(`Reset ikatan HP siswa ${data.nama_siswa}?`)) {
                await updateDoc(doc(db, "siswa", docId), { device_id: "" });
              }
            };
          }

          // Event Hapus Dokumen
          const btnDelete = item.querySelector('.btn-delete-doc');
          if (btnDelete) {
            btnDelete.onclick = async () => {
              const infoName = data.nama_siswa ? `${data.nama_siswa} (${docId})` : docId;
              if (confirm(`Apakah Anda yakin ingin MENGHAPUS dokumen "${infoName}" dari koleksi ${colName.toUpperCase()}?`)) {
                await deleteDoc(doc(db, colName, docId));
              }
            };
          }

          dataListContainer.appendChild(item);
        });
      });
    }

    crudForm.addEventListener('submit', async () => {
      if (activeCollection === 'log_absensi') return;

      const docId = inputNis.value.trim();
      const namaSiswa = inputNamaSiswa.value.trim();
      const namaKelas = inputNamaKelas.value.trim();
      const extraVal = inputExtra.value.trim();

      if (!docId) {
        alert("ID Dokumen / NIS wajib diisi!");
        return;
      }

      try {
        let payload = { updated_at: serverTimestamp() };

        if (activeCollection === 'siswa') {
          payload = {
            nis: docId,
            nama_siswa: namaSiswa,
            id_kelas: namaKelas.replace(/\s+/g, '-').toUpperCase(),
            nama_kelas: namaKelas,
            device_id: "",
            created_at: serverTimestamp()
          };
        } else if (activeCollection === 'kelas') {
          payload = {
            nama_kelas: namaKelas || docId,
            wali_kelas: extraVal || "Iskak Fatoni, S.Pd., Gr.",
            created_at: serverTimestamp()
          };
        } else if (activeCollection === 'mapel') {
          payload = {
            nama_mapel: namaKelas || docId,
            kategori: extraVal || "Wajib",
            created_at: serverTimestamp()
          };
        }

        await setDoc(doc(db, activeCollection, docId), payload, { merge: true });
        resetForm();
        alert(`Dokumen "${docId}" berhasil disimpan!`);

      } catch (err) {
        alert("Gagal menyimpan dokumen: " + err.message);
      }
    });

    btnCancelEdit.addEventListener('click', resetForm);

    function resetForm() {
      inputNis.value = '';
      inputNamaSiswa.value = '';
      inputNamaKelas.value = '';
      inputExtra.value = '';
      editDocId.value = '';
      btnCancelEdit.classList.add('hidden');
    }
  </script>
</body>
</html>
